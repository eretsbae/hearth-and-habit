# 정기 발행 파이프라인 (2026-10-11부터 게시 전용)
# - 글은 오너 PC의 Claude Code 예약 작업이 월/수/금 20:43 KST에 써서 main에
#   커밋한다(scripts/claude-publish.ps1 → generator/CLAUDE_RUN.md, API 크레딧 미사용).
# - 이 워크플로우는 같은 날 22:17 KST에 그 글을 Blogger(www.hearth-habit.com)에
#   게시하고 핀을 갱신한다. 커밋된 새 글이 없으면 실패해 ci-alerts 이슈가 열린다.
# - Actions 탭에서 "Run workflow"로 수동 실행도 가능합니다.
#
# 필요한 리포지토리 시크릿 (Settings → Secrets and variables → Actions):
#   GOOGLE_CLIENT_ID      generator/blogger_auth.py 실행 결과
#   GOOGLE_CLIENT_SECRET  generator/blogger_auth.py 실행 결과
#   GOOGLE_REFRESH_TOKEN  generator/blogger_auth.py 실행 결과

name: Generate & Publish Post

on:
  schedule:
    # 주 3회(월/수/금). 2026-09-29에 한시 주 5회에서 복귀했다 — 글 43·51편에서도
    # 애드센스가 거절해 발행량은 병목이 아니었다. 발행 중단 조건은
    # docs/SETUP_GUIDE.md "중단 기준" 절 (1차 점검 2026-11-16).
    # 예약을 멈출 때는 .github/scripts/ci_alert.py의 WATCH에서도 뺄 것
    # (안 빼면 매일 "[CI 정지]" 이슈가 뜬다).
    - cron: "17 13 * * 1,3,5" # Mon/Wed/Fri 13:17 UTC ≈ 9:17 AM ET
  workflow_dispatch:

permissions:
  contents: write

# main에 커밋하는 워크플로우 3개(이것, pinterest-publish, weekly-report)가 같은
# 그룹을 씁니다. 그룹이 다르면 동시에 돌 수 있고, 둘 다 topics.yml을 통째로
# 다시 쓰기 때문에 늦게 push하는 쪽이 non-fast-forward로 거부됩니다 — 그러면
# Blogger/Pinterest에는 이미 올라갔는데 기록만 유실되어 다음 실행에서 중복
# 게시됩니다. 같은 그룹 + push 직전 rebase로 그 경로를 막습니다.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 인증이 죽어 있으면(만료된 refresh token 등) 여기서 즉시 실패시킨다.
      - name: Verify Blogger credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python generator/blogger_publish.py --check-auth

      # 2026-10-11부터 글은 여기서 쓰지 않는다. API 크레딧이 바닥나서, 오너 PC의
      # 예약 작업(scripts/claude-publish.ps1, 월/수/금 20:43 KST)이 Claude Code 세션
      # 토큰으로 리서치·집필·검증한 뒤 main에 커밋한다(generator/CLAUDE_RUN.md).
      # 이 단계는 그 글이 들어왔는지만 확인한다. 없으면 실패시켜 ci-alerts가 이슈를
      # 열게 한다(PC가 꺼져 있었거나 세션이 글을 못 냈다는 뜻).
      - name: Require a post from the Claude Code session
        run: |
          python - <<'EOF'
          import sys, yaml
          topics = yaml.safe_load(open("config/topics.yml", encoding="utf-8"))["topics"]
          ready = [t["title"] for t in topics if t.get("status") == "published" and not t.get("blogger_url")]
          if not ready:
              sys.exit("No new post to publish: the Claude Code run (scripts/claude-publish.ps1) did not commit one. "
                       "Check logs/claude-publish/ on the owner's PC.")
          print("ready to publish:", *ready, sep="\n  ")
          EOF

      - name: Configure git
        run: |
          git config user.name "hearth-habit-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Publish to Blogger
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python generator/blogger_publish.py

      # 발행 기록(blogger_url)은 핀 렌더 전에 먼저 커밋합니다. 글은 이미
      # Blogger에 라이브인데 뒤 단계(핀 렌더)가 죽어서 이 기록이 안 남으면,
      # 다음 실행이 같은 글을 다시 발행합니다(blogger_url 없는 글을 발행
      # 대상으로 고르므로). 핀은 실패해도 다시 그리면 그만이지만 중복 발행은
      # 되돌리기 어렵습니다.
      - name: Commit Blogger publish record
        run: |
          git add config/topics.yml
          git diff --cached --quiet || git commit -m "chore: record Blogger publish URLs"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      # Pinterest 핀 이미지 + 핀 큐(PINS.md) 갱신. 발행 뒤에 실행해야
      # 새 글의 blogger_url이 핀 큐에 들어갑니다. --all은 멱등이라
      # 이미 만든 핀은 같은 결과로 다시 그려질 뿐입니다.
      - name: Render Pinterest pins
        run: python generator/make_pin.py --all

      # 글 frontmatter의 pin_hooks로 헤드라인 변형 핀 + 업로드용 CSV(content/pins/hooks/)
      # 갱신. 같은 글의 두 번째 핀은 다른 레이아웃이라 "fresh pin"으로 잡힙니다.
      - name: Render hook pins
        run: python generator/make_pin.py --hooks

      - name: Commit refreshed pins
        run: |
          git add content/pins/
          git diff --cached --quiet || git commit -m "chore: refresh pins"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
