# 라이브 글 전체의 내부 링크("Keep reading" + 필러 허브 링크)를 현재
# config/site.yml -> blogger.blog_url 기준으로 다시 씁니다.
# - 수동 실행 전용. 도메인 전환(peterpb.blogspot.com -> www.hearth-habit.com,
#   2026-09-11) 직후 1회 실행. 구 주소는 301로 넘어가긴 하지만, 내부 링크가
#   전부 다른 도메인을 거쳐 들어오는 사이트는 애드센스/검색 입장에서 깔끔하지
#   않으므로 새 도메인을 직접 가리키게 합니다.
# - 글을 새로 발행하지 않고, 이미 blogger_post_id 가 기록된 글만 PATCH 합니다.
# - Blogger에서 커스텀 도메인이 실제로 열린 뒤(https://www.hearth-habit.com 접속
#   확인)에 돌릴 것. 그 전에 돌리면 아직 안 열린 주소로 링크가 바뀝니다.

name: Relink Posts to Current Domain

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  relink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rewrite related-post links on all live posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python generator/blogger_publish.py --relink-all

      # --relink-all 은 보통 topics.yml 을 바꾸지 않지만(post id 가 이미 전부
      # 기록돼 있음), 누락된 id 를 채운 경우에만 커밋이 생깁니다.
      - name: Commit cached post ids (if any)
        run: |
          git config user.name "hearth-habit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/topics.yml
          git diff --cached --quiet || git commit -m "chore: cache Blogger post ids after relink"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
