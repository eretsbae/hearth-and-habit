# Blogger label taxonomy. Posts may only use tags listed under `labels`; the
# pillar name is added automatically at publish time, so it is never a tag.
# Why: by 2026-10-13 the site had 170 distinct tags on 71 posts (148 used by
# two posts or fewer), which spilled a messy label cloud and dozens of
# near-empty label pages onto the live site. Each post gets 1-4 labels from
# this list. `aliases` maps every retired tag to its labels; it was used once
# by the consolidation and is kept so old drafts can be normalised the same way.
labels:
  home-maintenance:
    - plumbing
    - heating and HVAC
    - electrical and home safety
    - roof and gutters
    - winter prep
    - DIY repair basics
  cleaning-organization:
