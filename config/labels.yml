    - heating and cooling costs
    - water and gas bills
    - appliance efficiency
  kitchen-habits:
    - food safety
    - food storage and leftovers
    - meal planning and food waste
    - cookware and kitchen appliances
  yard-outdoor:
    - lawn care
    - fall and winter yard
    - outdoor maintenance
    - pests and drainage
