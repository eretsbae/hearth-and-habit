<text x="175"><tspan x="175" y="205" font-size="32" font-weight="bold">Mon</tspan><tspan x="175" y="305">Ground meat,</tspan><tspan x="175" y="339">poultry</tspan></text>
<text x="387"><tspan x="387" y="205" font-size="32" font-weight="bold">Tue</tspan><tspan x="387" y="305">Last day,</tspan><tspan x="387" y="339">raw poultry</tspan></text>
<text x="599"><tspan x="599" y="205" font-size="32" font-weight="bold">Wed</tspan><tspan x="599" y="305">Chops or</tspan><tspan x="599" y="339">thawed meat</tspan></text>
