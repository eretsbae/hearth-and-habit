<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- soft division background halves -->
  <rect x="0" y="0" width="600" height="630" fill="#E4C7B2" opacity="0.35"/>
  <rect x="600" y="0" width="600" height="630" fill="#5C6E58" opacity="0.08"/>

  <!-- warm glow left side -->
  <circle cx="280" cy="220" r="230" fill="#D9A441" opacity="0.18"/>
  <circle cx="280" cy="220" r="150" fill="#D9A441" opacity="0.15"/>

  <!-- cool breeze right side -->
  <circle cx="920" cy="220" r="230" fill="#5C6E58" opacity="0.10"/>

  <!-- dishwasher base tub -->
  <rect x="140" y="470" width="920" height="120" rx="14" fill="#2E2A24"/>
  <rect x="160" y="480" width="880" height="90" rx="10" fill="#B85C38" opacity="0.15"/>

  <!-- rack frame -->
  <rect x="170" y="420" width="860" height="30" rx="8" fill="#5C6E58"/>
  <line x1="220" y1="420" x2="220" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="330" y1="420" x2="330" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="440" y1="420" x2="440" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="550" y1="420" x2="550" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="660" y1="420" x2="660" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="770" y1="420" x2="770" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="880" y1="420" x2="880" y2="590" stroke="#5C6E58" stroke-width="8"/>
  <line x1="980" y1="420" x2="980" y2="590" stroke="#5C6E58" stroke-width="8"/>

  <!-- LEFT: heated dry plates with warm glow rays -->
  <g>
    <path d="M280 150 L280 90" stroke="#D9A441" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M320 165 L360 115" stroke="#D9A441" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M240 165 L200 115" stroke="#D9A441" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- plates standing in rack, left half -->
  <g fill="#F6EFE6" stroke="#B85C38" stroke-width="4">
    <ellipse cx="255" cy="430" rx="30" ry="12"/>
    <rect x="245" y="330" width="20" height="100" rx="8"/>
    <ellipse cx="255" cy="330" rx="30" ry="12"/>
  </g>
  <g fill="#F6EFE6" stroke="#B85C38" stroke-width="4">
    <ellipse cx="365" cy="430" rx="30" ry="12"/>
    <rect x="355" y="340" width="20" height="90" rx="8"/>
    <ellipse cx="365" cy="340" rx="30" ry="12"/>
  </g>
  <g fill="#F6EFE6" stroke="#B85C38" stroke-width="4">
    <ellipse cx="475" cy="430" rx="30" ry="12"/>
    <rect x="465" y="320" width="20" height="110" rx="8"/>
    <ellipse cx="475" cy="320" rx="30" ry="12"/>
  </g>

  <!-- bowl left -->
  <path d="M180 430 a45 30 0 0 0 90 0 z" fill="#E4C7B2" stroke="#B85C38" stroke-width="4"/>

  <!-- small warmth wisps -->
  <path d="M300 260 q10 -20 0 -40" stroke="#D9A441" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M420 250 q10 -20 0 -40" stroke="#D9A441" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- RIGHT: air-dry plates with breeze icon -->
  <g fill="#F6EFE6" stroke="#5C6E58" stroke-width="4">
    <ellipse cx="635" cy="430" rx="30" ry="12"/>
    <rect x="625" y="330" width="20" height="100" rx="8"/>
    <ellipse cx="635" cy="330" rx="30" ry="12"/>
  </g>
  <g fill="#F6EFE6" stroke="#5C6E58" stroke-width="4">
    <ellipse cx="745" cy="430" rx="30" ry="12"/>
    <rect x="735" y="340" width="20" height="90" rx="8"/>
    <ellipse cx="745" cy="340" rx="30" ry="12"/>
  </g>
  <g fill="#F6EFE6" stroke="#5C6E58" stroke-width="4">
    <ellipse cx="855" cy="430" rx="30" ry="12"/>
    <rect x="845" y="320" width="20" height="110" rx="8"/>
    <ellipse cx="855" cy="320" rx="30" ry="12"/>
  </g>

  <!-- bowl right -->
  <path d="M900 430 a45 30 0 0 0 90 0 z" fill="#E4C7B2" stroke="#5C6E58" stroke-width="4"/>

  <!-- breeze swirl icon -->
  <g stroke="#5C6E58" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M900 190 q60 -20 120 0 q20 8 0 18 q-30 12 -60 0"/>
    <path d="M930 220 q50 -14 100 4 q16 8 -2 16 q-24 10 -50 0"/>
    <path d="M950 250 q40 -10 80 6"/>
  </g>

  <!-- small extra dish accents -->
  <circle cx="990" cy="400" r="10" fill="#5C6E58" opacity="0.4"/>
  <circle cx="200" cy="395" r="10" fill="#D9A441" opacity="0.5"/>

  <!-- gentle countertop line -->
  <rect x="0" y="600" width="1200" height="30" fill="#2E2A24" opacity="0.06"/>
</svg>