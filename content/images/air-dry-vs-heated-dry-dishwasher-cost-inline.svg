<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Where a dishwasher cycle's energy goes</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<text x="80" y="150" font-size="30" font-weight="bold">ENERGY STAR cycle: about 1.12 kWh</text>
<rect x="80" y="175" width="1040" height="90" rx="10" fill="#E4C7B2"/>
<rect x="80" y="175" width="600" height="90" rx="10" fill="#5C6E58"/>
<rect x="680" y="175" width="440" height="90" fill="#D9A441"/>
<rect x="680" y="175" width="440" height="90" rx="0" fill="none" stroke="#F6EFE6" stroke-width="4"/>
<text x="110" y="320" font-size="28">Water heating: most of it</text>
<text x="700" y="320" font-size="28">Pumps + drying: under half</text>
<line x1="900" y1="340" x2="900" y2="420" stroke="#2E2A24" stroke-width="4"/>
<polygon points="888,412 912,412 900,432" fill="#2E2A24"/>
<rect x="560" y="445" width="560" height="120" rx="14" fill="#FFFDF9" stroke="#B85C38" stroke-width="4"/>
<text x="840" y="495" font-size="30" font-weight="bold" text-anchor="middle">Heated dry: under 10¢</text>
<text x="840" y="540" font-size="26" text-anchor="middle">per load at 17–18¢ per kWh</text>
</g>
</svg>
