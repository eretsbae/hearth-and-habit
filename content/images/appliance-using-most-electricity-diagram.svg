<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- gridlines every 1,000 kWh -->
  <g stroke="#E4C7B2" stroke-width="1.5">
    <line x1="458" y1="146" x2="458" y2="518"/>
    <line x1="586" y1="146" x2="586" y2="518"/>
    <line x1="714" y1="146" x2="714" y2="518"/>
    <line x1="842" y1="146" x2="842" y2="518"/>
    <line x1="970" y1="146" x2="970" y2="518"/>
  </g>
  <line x1="330" y1="146" x2="330" y2="518" stroke="#2E2A24" stroke-width="2"/>

  <!-- range bars: low to high typical yearly kWh -->
  <g fill="#B85C38">
    <rect x="714" y="158" width="192" height="24" rx="4"/>
    <rect x="522" y="205" width="320" height="24" rx="4"/>
    <rect x="394" y="252" width="51.2" height="24" rx="4"/>
    <rect x="374.8" y="299" width="44.8" height="24" rx="4"/>
    <rect x="368.4" y="346" width="38.4" height="24" rx="4"/>
    <rect x="349.2" y="393" width="19.2" height="24" rx="4"/>
    <rect x="342.8" y="440" width="12.8" height="24" rx="4"/>
    <rect x="336.4" y="487" width="12.8" height="24" rx="4"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="76" font-size="38" font-weight="bold" fill="#2E2A24">Typical yearly use (kWh)</text>
    <text x="40" y="114" font-size="24" fill="#6D6A66">Ranges vary by model, climate and use</text>

    <g font-size="26" fill="#2E2A24" text-anchor="end">
      <text x="310" y="179">Electric water heater</text>
      <text x="310" y="226">Central AC</text>
      <text x="310" y="273">Clothes dryer</text>
      <text x="310" y="320">Refrigerator</text>
      <text x="310" y="367">Range / oven</text>
      <text x="310" y="414">Dishwasher</text>
      <text x="310" y="461">TV</text>
      <text x="310" y="508">Washer (motor)</text>
    </g>

    <g font-size="24" font-weight="bold" fill="#2E2A24">
      <text x="918" y="178">3,000–4,500</text>
      <text x="854" y="225">1,500–4,000</text>
      <text x="457" y="272">500–900</text>
      <text x="432" y="319">350–700</text>
      <text x="419" y="366">300–600</text>
      <text x="380" y="413">150–300</text>
      <text x="368" y="460">100–200</text>
      <text x="361" y="507">50–150</text>
    </g>

    <g font-size="24" fill="#6D6A66" text-anchor="middle">
      <text x="330" y="550">0</text>
      <text x="458" y="550">1,000</text>
      <text x="586" y="550">2,000</text>
      <text x="714" y="550">3,000</text>
      <text x="842" y="550">4,000</text>
      <text x="970" y="550">5,000</text>
    </g>
  </g>
</svg>
