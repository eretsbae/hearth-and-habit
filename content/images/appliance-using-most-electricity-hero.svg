<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- subtle background glow rays -->
  <circle cx="600" cy="315" r="290" fill="#D9A441" opacity="0.06"/>
  <circle cx="600" cy="315" r="230" fill="#D9A441" opacity="0.07"/>

  <!-- ground line -->
  <rect x="0" y="560" width="1200" height="70" fill="#E4C7B2" opacity="0.4"/>

  <!-- house outer glow outline -->
  <rect x="255" y="150" width="690" height="410" rx="10" fill="none" stroke="#D9A441" stroke-width="6" opacity="0.35"/>
  <polygon points="245,150 600,60 955,150" fill="none" stroke="#D9A441" stroke-width="6" opacity="0.35"/>

  <!-- roof -->
  <polygon points="245,150 600,60 955,150" fill="#B85C38"/>
  <polygon points="600,60 955,150 890,150 600,90" fill="#a54f2f"/>

  <!-- house body -->
  <rect x="255" y="150" width="690" height="410" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>

  <!-- interior dividing walls (cutaway rooms) -->
  <line x1="600" y1="150" x2="600" y2="560" stroke="#2E2A24" stroke-width="3"/>
  <line x1="255" y1="360" x2="945" y2="360" stroke="#2E2A24" stroke-width="3"/>

  <!-- ===== Top-left room: Fridge ===== -->
  <g>
    <rect x="310" y="200" width="120" height="150" rx="8" fill="#5C6E58"/>
    <rect x="310" y="200" width="120" height="60" rx="8" fill="#6d8067"/>
    <rect x="320" y="270" width="10" height="20" fill="#D9A441"/>
    <rect x="320" y="215" width="10" height="20" fill="#D9A441"/>
    <!-- glow outline -->
    <rect x="305" y="195" width="130" height="160" rx="10" fill="none" stroke="#D9A441" stroke-width="4" opacity="0.55"/>
    <rect x="298" y="188" width="144" height="174" rx="14" fill="none" stroke="#D9A441" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- ===== Top-right room: AC unit (window mounted) ===== -->
  <g>
    <rect x="760" y="210" width="150" height="80" rx="6" fill="#5C6E58"/>
    <rect x="775" y="225" width="35" height="12" fill="#E4C7B2"/>
    <rect x="775" y="245" width="35" height="12" fill="#E4C7B2"/>
    <rect x="775" y="265" width="35" height="12" fill="#E4C7B2"/>
    <circle cx="855" cy="250" r="18" fill="#D9A441"/>
    <circle cx="855" cy="250" r="9" fill="#F6EFE6"/>
    <!-- glow outline -->
    <rect x="753" y="203" width="164" height="94" rx="10" fill="none" stroke="#D9A441" stroke-width="4" opacity="0.6"/>
    <rect x="745" y="196" width="180" height="108" rx="14" fill="none" stroke="#D9A441" stroke-width="2" opacity="0.28"/>
    <!-- wavy air lines -->
    <path d="M770 300 q10 10 20 0 q10 10 20 0 q10 10 20 0" stroke="#B85C38" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <!-- ===== Bottom-left room: Water heater ===== -->
  <g>
    <rect x="330" y="420" width="80" height="130" rx="18" fill="#B85C38"/>
    <rect x="330" y="420" width="80" height="24" rx="12" fill="#c96b47"/>
    <rect x="360" y="460" width="20" height="14" rx="3" fill="#D9A441"/>
    <rect x="345" y="490" width="50" height="8" fill="#2E2A24" opacity="0.15"/>
    <!-- glow outline -->
    <rect x="322" y="414" width="96" height="142" rx="24" fill="none" stroke="#D9A441" stroke-width="5" opacity="0.7"/>
    <rect x="312" y="404" width="116" height="162" rx="30" fill="none" stroke="#D9A441" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- ===== Bottom-right room: Dryer ===== -->
  <g>
    <rect x="800" y="430" width="110" height="110" rx="10" fill="#5C6E58"/>
    <circle cx="855" cy="485" r="35" fill="#F6EFE6"/>
    <circle cx="855" cy="485" r="26" fill="#5C6E58" opacity="0.3"/>
    <circle cx="855" cy="485" r="26" fill="none" stroke="#2E2A24" stroke-width="2"/>
    <rect x="810" y="440" width="14" height="10" fill="#D9A441"/>
    <!-- glow outline strongest = biggest drain -->
    <rect x="792" y="422" width="126" height="126" rx="14" fill="none" stroke="#D9A441" stroke-width="6" opacity="0.85"/>
    <rect x="780" y="410" width="150" height="150" rx="20" fill="none" stroke="#D9A441" stroke-width="3" opacity="0.4"/>
    <rect x="768" y="398" width="174" height="174" rx="26" fill="none" stroke="#D9A441" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Door for realism -->
  <rect x="565" y="470" width="70" height="90" fill="#E4C7B2" stroke="#2E2A24" stroke-width="2"/>
  <circle cx="622" cy="515" r="3" fill="#2E2A24"/>

  <!-- small window details -->
  <rect x="470" y="230" width="40" height="40" fill="#D9A441" opacity="0.3" stroke="#2E2A24" stroke-width="2"/>
  <rect x="690" y="440" width="40" height="40" fill="#D9A441" opacity="0.3" stroke="#2E2A24" stroke-width="2"/>

  <!-- chimney -->
  <rect x="820" y="90" width="35" height="60" fill="#5C6E58"/>

  <!-- small energy spark near dryer -->
  <path d="M935 460 l8 -18 l-4 0 l10 -20 l-6 22 l4 0 z" fill="#D9A441" opacity="0.8"/>

  <!-- decorative bushes -->
  <circle cx="220" cy="580" r="26" fill="#5C6E58" opacity="0.6"/>
  <circle cx="255" cy="590" r="20" fill="#5C6E58" opacity="0.5"/>
  <circle cx="980" cy="585" r="24" fill="#5C6E58" opacity="0.6"/>
  <circle cx="945" cy="575" r="18" fill="#5C6E58" opacity="0.5"/>
</svg>