<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2E2A24">Two loads on one circuit add up</text>
  <!-- microwave box -->
  <rect x="80" y="150" width="280" height="150" rx="14" fill="#B85C38"/>
  <text x="220" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6">Microwave 1,100 W</text>
  <text x="430" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="60" fill="#2E2A24">+</text>
  <!-- toaster box -->
  <rect x="500" y="150" width="280" height="150" rx="14" fill="#D9A441"/>
  <text x="640" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#2E2A24">Toaster 1,400 W</text>
  <text x="850" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="60" fill="#2E2A24">=</text>
  <!-- total -->
  <rect x="910" y="150" width="230" height="150" rx="14" fill="#5C6E58"/>
  <text x="1025" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#F6EFE6">2,500 W</text>
  <!-- arrow down -->
  <path d="M1025 310 L1025 370" stroke="#2E2A24" stroke-width="6"/>
  <path d="M1008 362 L1025 390 L1042 362 Z" fill="#2E2A24"/>
  <text x="1025" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">÷ 120 V = 20.8 A</text>
  <!-- bars -->
  <text x="80" y="400" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">15 A breaker rating</text>
  <rect x="80" y="415" width="540" height="40" rx="6" fill="#E4C7B2"/>
  <text x="80" y="500" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">20 A breaker rating</text>
  <rect x="80" y="515" width="720" height="40" rx="6" fill="#E4C7B2"/>
  <rect x="80" y="565" width="749" height="22" rx="6" fill="#B85C38"/>
  <text x="845" y="584" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Pair: 20.8 A</text>
</svg>
