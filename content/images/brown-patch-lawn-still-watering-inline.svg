<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Sky/background band -->
  <rect x="0" y="0" width="1200" height="180" fill="#F6EFE6"/>

  <!-- soft sun -->
  <circle cx="1060" cy="90" r="55" fill="#D9A441" opacity="0.35"/>
  <circle cx="1060" cy="90" r="34" fill="#D9A441" opacity="0.55"/>

  <!-- Ground line divider -->
  <rect x="0" y="180" width="1200" height="450" fill="#E4C7B2"/>
  <rect x="0" y="180" width="1200" height="40" fill="#5C6E58"/>

  <!-- soil layers -->
  <rect x="0" y="220" width="1200" height="140" fill="#E4C7B2"/>
  <rect x="0" y="360" width="1200" height="130" fill="#D9A441" opacity="0.35"/>
  <rect x="0" y="490" width="1200" height="140" fill="#B85C38" opacity="0.25"/>

  <!-- center divider marking healthy vs compacted -->
  <rect x="595" y="180" width="10" height="450" fill="#2E2A24" opacity="0.15"/>

  <!-- LEFT SIDE: healthy grass, deep roots -->
  <g>
    <!-- grass blades -->
    <g fill="#5C6E58">
      <path d="M60 220 C55 190 65 160 60 140 C75 165 80 195 75 220 Z"/>
      <path d="M100 220 C95 185 110 150 105 125 C120 155 125 190 118 220 Z"/>
      <path d="M140 220 C138 195 150 165 145 140 C160 165 165 195 158 220 Z"/>
      <path d="M180 220 C175 185 190 150 185 125 C200 155 205 190 198 220 Z"/>
      <path d="M220 220 C218 195 230 165 225 140 C240 165 245 195 238 220 Z"/>
      <path d="M260 220 C255 185 270 150 265 125 C280 155 285 190 278 220 Z"/>
      <path d="M300 220 C298 195 310 165 305 140 C320 165 325 195 318 220 Z"/>
      <path d="M340 220 C335 185 350 150 345 125 C360 155 365 190 358 220 Z"/>
      <path d="M380 220 C378 195 390 165 385 140 C400 165 405 195 398 220 Z"/>
      <path d="M420 220 C415 185 430 150 425 125 C440 155 445 190 438 220 Z"/>
      <path d="M460 220 C458 195 470 165 465 140 C480 165 485 195 478 220 Z"/>
      <path d="M500 220 C495 185 510 150 505 125 C520 155 525 190 518 220 Z"/>
      <path d="M540 220 C538 195 550 165 545 140 C560 165 565 195 558 220 Z"/>
    </g>

    <!-- deep roots -->
    <g stroke="#2E2A24" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M100 220 C90 300 130 340 100 420 C80 480 120 520 100 580"/>
      <path d="M100 220 C110 280 80 330 110 400"/>
      <path d="M100 220 C95 260 60 300 70 360"/>
      <path d="M220 220 C210 300 250 340 220 420 C200 480 240 530 220 590"/>
      <path d="M220 220 C230 280 200 330 230 400"/>
      <path d="M340 220 C330 300 370 350 340 420 C320 480 360 520 340 580"/>
      <path d="M340 220 C350 270 320 320 350 390"/>
      <path d="M460 220 C450 300 490 340 460 420 C440 480 480 520 460 580"/>
      <path d="M460 220 C470 270 440 320 470 390"/>
      <path d="M540 220 C530 290 560 330 540 400"/>
    </g>

    <!-- small nutrient dots -->
    <g fill="#B85C38" opacity="0.5">
      <circle cx="140" cy="330" r="5"/>
      <circle cx="260" cy="420" r="5"/>
      <circle cx="400" cy="380" r="5"/>
      <circle cx="480" cy="500" r="5"/>
      <circle cx="180" cy="520" r="5"/>
    </g>
  </g>

  <!-- RIGHT SIDE: brown, shallow, compacted -->
  <g>
    <!-- compacted soil block -->
    <rect x="620" y="230" width="560" height="110" fill="#B85C38" opacity="0.18"/>
    <rect x="620" y="250" width="560" height="10" fill="#2E2A24" opacity="0.1"/>
    <rect x="620" y="275" width="560" height="10" fill="#2E2A24" opacity="0.1"/>
    <rect x="620" y="300" width="560" height="10" fill="#2E2A24" opacity="0.1"/>

    <!-- sparse dry grass blades -->
    <g fill="#D9A441">
      <path d="M660 220 C658 205 665 190 662 175 C670 190 673 205 668 220 Z"/>
      <path d="M700 220 C700 208 705 195 702 182 C710 195 712 208 706 220 Z"/>
      <path d="M760 220 C758 205 765 192 762 178 C770 192 773 205 768 220 Z"/>
      <path d="M830 220 C830 208 835 195 832 182 C840 195 842 208 836 220 Z"/>
      <path d="M900 220 C898 205 905 192 902 178 C910 192 913 205 908 220 Z"/>
      <path d="M970 220 C970 208 975 195 972 182 C980 195 982 208 976 220 Z"/>
      <path d="M1040 220 C1038 205 1045 192 1042 178 C1050 192 1053 205 1048 220 Z"/>
      <path d="M1110 220 C1110 208 1115 195 1112 182 C1120 195 1122 208 1116 220 Z"/>
    </g>

    <!-- shallow stubby roots -->
    <g stroke="#2E2A24" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M662 220 C660 240 670 250 664 265"/>
      <path d="M703 220 C705 238 698 252 704 268"/>
      <path d="M763 220 C762 240 770 252 765 266"/>
      <path d="M833 220 C834 238 826 250 832 266"/>
      <path d="M903 220 C902 240 910 252 905 266"/>
      <path d="M973 220 C974 238 966 250 972 266"/>
      <path d="M1043 220 C1042 240 1050 252 1045 266"/>
      <path d="M1113 220 C1114 238 1106 250 1112 266"/>
    </g>

    <!-- compaction lumps -->
    <g fill="#2E2A24" opacity="0.15">
      <ellipse cx="750" cy="300" rx="60" ry="18"/>
      <ellipse cx="950" cy="320" rx="70" ry="18"/>
      <ellipse cx="1100" cy="290" rx="50" ry="16"/>
    </g>
  </g>

  <!-- watering can spouts implying watering both sides equally -->
  <g>
    <!-- left water drops -->
    <ellipse cx="200" cy="150" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>
    <ellipse cx="230" cy="130" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>
    <ellipse cx="260" cy="150" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>

    <!-- right water drops sitting on top, not absorbing -->
    <ellipse cx="820" cy="150" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>
    <ellipse cx="860" cy="130" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>
    <ellipse cx="900" cy="150" rx="6" ry="9" fill="#5C6E58" opacity="0.5"/>
  </g>

  <!-- soft framing border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#2E2A24" stroke-width="1" opacity="0.08"/>
</svg>