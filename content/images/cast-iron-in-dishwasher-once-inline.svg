<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="82" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Bringing back dishwashed cast iron</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<circle cx="130" cy="170" r="34" fill="#B85C38"/><text x="130" y="181" font-size="30" font-weight="bold" fill="#F6EFE6" text-anchor="middle">1</text>
<text x="190" y="181" font-size="30">Scour off the rust</text>
<circle cx="130" cy="262" r="34" fill="#D9A441"/><text x="130" y="273" font-size="30" font-weight="bold" text-anchor="middle">2</text>
<text x="190" y="273" font-size="30">Dry completely, then heat</text>
<circle cx="130" cy="354" r="34" fill="#5C6E58"/><text x="130" y="365" font-size="30" font-weight="bold" fill="#F6EFE6" text-anchor="middle">3</text>
<text x="190" y="365" font-size="30">Very thin oil coat</text>
<circle cx="130" cy="446" r="34" fill="#B85C38"/><text x="130" y="457" font-size="30" font-weight="bold" fill="#F6EFE6" text-anchor="middle">4</text>
<text x="190" y="457" font-size="30">Upside down, 450–500°F, 1 hour</text>
<circle cx="130" cy="538" r="34" fill="#5C6E58"/><text x="130" y="548" font-size="30" font-weight="bold" fill="#F6EFE6" text-anchor="middle">5</text>
<text x="190" y="548" font-size="30">Cool in the oven</text>
</g>
<g transform="translate(900 360)">
<ellipse cx="0" cy="0" rx="170" ry="70" fill="#2E2A24"/>
<path d="M-150 0 Q0 -95 150 0 Z" fill="#3F4F3B"/>
<rect x="160" y="-18" width="110" height="30" rx="12" fill="#2E2A24"/>
<line x1="-150" y1="110" x2="150" y2="110" stroke="#D9A441" stroke-width="10" stroke-linecap="round"/>
<line x1="-150" y1="140" x2="150" y2="140" stroke="#D9A441" stroke-width="10" stroke-linecap="round"/>
</g>
</svg>
