<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="72" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Sizing a Deep Caulk Joint</text>
<rect x="300" y="170" width="200" height="380" fill="#E4C7B2"/>
<rect x="700" y="170" width="200" height="380" fill="#E4C7B2"/>
<rect x="500" y="170" width="200" height="100" fill="#5C6E58"/>
<circle cx="600" cy="330" r="62" fill="#D9A441"/>
<line x1="500" y1="140" x2="700" y2="140" stroke="#2E2A24" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="600" y="128" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Joint width</text>
<line x1="930" y1="172" x2="930" y2="268" stroke="#2E2A24" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="950" y="214" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Caulk depth =</text>
<text x="950" y="250" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">half the width</text>
<line x1="670" y1="350" x2="930" y2="420" stroke="#2E2A24" stroke-width="3" marker-start="url(#a)"/>
<text x="940" y="430" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Backer rod</text>
<line x1="510" y1="220" x2="270" y2="300" stroke="#B85C38" stroke-width="3" marker-start="url(#a)"/>
<line x1="690" y1="220" x2="270" y2="300" stroke="#B85C38" stroke-width="3" marker-start="url(#a)"/>
<text x="60" y="340" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Bonds to</text>
<text x="60" y="376" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">two sides only</text>
<text x="600" y="594" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Caulk won't stick to the rod, so it can stretch</text>
</svg>
