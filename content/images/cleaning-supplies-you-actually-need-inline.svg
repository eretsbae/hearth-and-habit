<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="72" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Clean or Disinfect?</text>
<rect x="60" y="120" width="500" height="80" rx="14" fill="#E4C7B2"/>
<text x="310" y="171" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">Routine dirt</text>
<rect x="640" y="120" width="500" height="80" rx="14" fill="#E4C7B2"/>
<text x="890" y="171" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">Someone is sick</text>
<line x1="310" y1="200" x2="310" y2="250" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="890" y1="200" x2="890" y2="250" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="260" width="500" height="80" rx="14" fill="#5C6E58"/>
<text x="310" y="311" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6" text-anchor="middle">Clean: soap or cleaner</text>
<rect x="640" y="260" width="500" height="80" rx="14" fill="#5C6E58"/>
<text x="890" y="311" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6" text-anchor="middle">Clean first, then disinfect</text>
<line x1="890" y1="340" x2="890" y2="390" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="640" y="400" width="500" height="80" rx="14" fill="#D9A441"/>
<text x="890" y="451" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Keep wet for label time</text>
<rect x="60" y="520" width="1080" height="70" rx="14" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<text x="600" y="565" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Never mix bleach with vinegar or ammonia</text>
</svg>
