<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Divider -->
  <line x1="600" y1="70" x2="600" y2="560" stroke="#E4C7B2" stroke-width="3"/>

  <!-- LEFT PANEL: Balanced system -->
  <g>
    <circle cx="300" cy="105" r="14" fill="#5C6E58"/>
    <!-- Furnace / unit -->
    <rect x="150" y="150" width="120" height="90" rx="8" fill="#5C6E58"/>
    <rect x="175" y="175" width="70" height="14" rx="4" fill="#F6EFE6"/>
    <rect x="175" y="200" width="70" height="10" rx="4" fill="#F6EFE6"/>

    <!-- Main trunk duct -->
    <rect x="270" y="185" width="230" height="24" rx="6" fill="#D9A441"/>

    <!-- Branch ducts -->
    <rect x="420" y="209" width="20" height="90" fill="#D9A441"/>
    <rect x="330" y="209" width="20" height="150" fill="#D9A441"/>
    <rect x="480" y="209" width="20" height="150" fill="#D9A441"/>

    <!-- Vents (open, even) -->
    <g fill="#B85C38">
      <rect x="405" y="295" width="50" height="16" rx="3"/>
      <rect x="315" y="355" width="50" height="16" rx="3"/>
      <rect x="465" y="355" width="50" height="16" rx="3"/>
    </g>
    <!-- Vent slats -->
    <g stroke="#F6EFE6" stroke-width="2">
      <line x1="412" y1="299" x2="412" y2="307"/>
      <line x1="422" y1="299" x2="422" y2="307"/>
      <line x1="432" y1="299" x2="432" y2="307"/>
      <line x1="442" y1="299" x2="442" y2="307"/>
      <line x1="322" y1="359" x2="322" y2="367"/>
      <line x1="332" y1="359" x2="332" y2="367"/>
      <line x1="342" y1="359" x2="342" y2="367"/>
      <line x1="352" y1="359" x2="352" y2="367"/>
      <line x1="472" y1="359" x2="472" y2="367"/>
      <line x1="482" y1="359" x2="482" y2="367"/>
      <line x1="492" y1="359" x2="492" y2="367"/>
      <line x1="502" y1="359" x2="502" y2="367"/>
    </g>

    <!-- Even airflow arrows -->
    <g fill="#5C6E58">
      <path d="M430 320 l-8 20 h16 z"/>
      <path d="M340 385 l-8 20 h16 z"/>
      <path d="M490 385 l-8 20 h16 z"/>
    </g>

    <!-- Rooms outline -->
    <rect x="180" y="330" width="360" height="170" rx="6" fill="none" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="300" y1="330" x2="300" y2="500" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="420" y1="330" x2="420" y2="500" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Small balanced icon (checkmark circle) -->
    <circle cx="510" cy="120" r="22" fill="#5C6E58"/>
    <path d="M500 121 l7 8 l14 -16" stroke="#F6EFE6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT PANEL: Closed vent / pressure buildup -->
  <g transform="translate(600,0)">
    <circle cx="300" cy="105" r="14" fill="#B85C38"/>
    <!-- Furnace / unit -->
    <rect x="150" y="150" width="120" height="90" rx="8" fill="#5C6E58"/>
    <rect x="175" y="175" width="70" height="14" rx="4" fill="#F6EFE6"/>
    <rect x="175" y="200" width="70" height="10" rx="4" fill="#F6EFE6"/>

    <!-- Main trunk duct, bulging to show pressure -->
    <path d="M270 185 h180 q30 0 30 12 q0 12 -30 12 h-180 z" fill="#D9A441"/>

    <!-- Branch ducts -->
    <rect x="420" y="209" width="20" height="90" fill="#D9A441"/>
    <rect x="330" y="209" width="24" height="150" fill="#D9A441"/>
    <rect x="478" y="209" width="24" height="150" fill="#D9A441"/>

    <!-- Bulging duct segment near closed vent (pressure) -->
    <ellipse cx="342" cy="330" rx="22" ry="18" fill="#E4C7B2"/>

    <!-- Vents: one open, one CLOSED, one open with strong flow -->
    <g fill="#B85C38">
      <rect x="405" y="295" width="50" height="16" rx="3"/>
      <rect x="313" y="355" width="54" height="18" rx="3"/>
      <rect x="465" y="355" width="50" height="16" rx="3"/>
    </g>
    <!-- Closed vent slats shut (solid ink bar) -->
    <rect x="317" y="358" width="46" height="10" rx="2" fill="#2E2A24"/>
    <!-- Open vent slats -->
    <g stroke="#F6EFE6" stroke-width="2">
      <line x1="412" y1="299" x2="412" y2="307"/>
      <line x1="422" y1="299" x2="422" y2="307"/>
      <line x1="432" y1="299" x2="432" y2="307"/>
      <line x1="442" y1="299" x2="442" y2="307"/>
      <line x1="472" y1="359" x2="472" y2="367"/>
      <line x1="482" y1="359" x2="482" y2="367"/>
      <line x1="492" y1="359" x2="492" y2="367"/>
      <line x1="502" y1="359" x2="502" y2="367"/>
    </g>

    <!-- Airflow arrows: weak into closed room, strong/overpressured elsewhere -->
    <g fill="#B85C38">
      <path d="M430 320 l-10 26 h20 z"/>
      <path d="M490 385 l-11 28 h22 z"/>
    </g>
    <!-- Small leak arrows escaping from bulge / seam (representing pressure loss) -->
    <g stroke="#B85C38" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M355 320 q15 -5 22 -18"/>
      <path d="M330 315 q-14 -2 -20 -14"/>
    </g>
    <g fill="#B85C38">
      <path d="M377 300 l6 -10 l6 10 z"/>
      <path d="M305 298 l-8 -8 l10 -4 z"/>
    </g>

    <!-- X mark over closed vent -->
    <g stroke="#F6EFE6" stroke-width="3" stroke-linecap="round">
      <line x1="325" y1="358" x2="355" y2="368"/>
      <line x1="355" y1="358" x2="325" y2="368"/>
    </g>

    <!-- Rooms outline -->
    <rect x="180" y="330" width="360" height="170" rx="6" fill="none" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="300" y1="330" x2="300" y2="500" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="420" y1="330" x2="420" y2="500" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Warning icon (triangle exclamation) -->
    <g>
      <path d="M510 98 l24 40 h-48 z" fill="#B85C38"/>
      <rect x="507" y="112" width="6" height="16" fill="#F6EFE6"/>
      <circle cx="510" cy="133" r="3" fill="#F6EFE6"/>
    </g>
  </g>

  <!-- Ground baseline strokes -->
  <line x1="60" y1="560" x2="540" y2="560" stroke="#2E2A24" stroke-width="2"/>
  <line x1="660" y1="560" x2="1140" y2="560" stroke="#2E2A24" stroke-width="2"/>
</svg>