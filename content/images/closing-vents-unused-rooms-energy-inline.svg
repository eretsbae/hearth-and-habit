<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="82" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Unused room: what to do with the vent</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<rect x="60" y="130" width="520" height="190" rx="14" fill="#E4C7B2"/>
<rect x="60" y="130" width="18" height="190" rx="6" fill="#B85C38"/>
<text x="105" y="200">Ducts in attic or crawlspace</text>
<text x="105" y="260" font-weight="bold">Leave vents open</text>
<rect x="620" y="130" width="520" height="190" rx="14" fill="#E4C7B2"/>
<rect x="620" y="130" width="18" height="190" rx="6" fill="#5C6E58"/>
<text x="665" y="200">Electric baseboard heat</text>
<text x="665" y="260" font-weight="bold">Turn that room down</text>
<rect x="60" y="360" width="520" height="190" rx="14" fill="#E4C7B2"/>
<rect x="60" y="360" width="18" height="190" rx="6" fill="#D9A441"/>
<text x="105" y="430">Closing one anyway?</text>
<text x="105" y="490" font-weight="bold">Farthest vent first</text>
<rect x="620" y="360" width="520" height="190" rx="14" fill="#E4C7B2"/>
<rect x="620" y="360" width="18" height="190" rx="6" fill="#B85C38"/>
<text x="665" y="430">Any forced-air system</text>
<text x="665" y="490" font-weight="bold">Never close over 60%</text>
</g>
</svg>
