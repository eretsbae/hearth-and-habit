<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- soft background zone shapes -->
  <rect x="0" y="470" width="1200" height="160" fill="#E4C7B2" opacity="0.35"/>
  <circle cx="1080" cy="120" r="140" fill="#D9A441" opacity="0.12"/>
  <circle cx="90" cy="500" r="180" fill="#5C6E58" opacity="0.08"/>

  <!-- CLOSET (right side) -->
  <g>
    <!-- closet frame -->
    <rect x="760" y="90" width="360" height="440" fill="#E4C7B2" opacity="0.5"/>
    <rect x="760" y="90" width="360" height="440" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- top shelf -->
    <rect x="775" y="130" width="330" height="16" fill="#B85C38"/>
    <!-- folded items on shelf -->
    <rect x="800" y="98" width="80" height="32" rx="4" fill="#5C6E58"/>
    <rect x="895" y="104" width="80" height="26" rx="4" fill="#D9A441"/>
    <rect x="985" y="96" width="70" height="34" rx="4" fill="#B85C38" opacity="0.85"/>

    <!-- hanging rod -->
    <rect x="775" y="180" width="330" height="6" fill="#2E2A24"/>

    <!-- hanging clothes -->
    <g>
      <circle cx="820" cy="188" r="6" fill="none" stroke="#2E2A24" stroke-width="3"/>
      <path d="M814 194 L826 194 L840 260 Q820 275 800 260 Z" fill="#5C6E58"/>
    </g>
    <g>
      <circle cx="900" cy="188" r="6" fill="none" stroke="#2E2A24" stroke-width="3"/>
      <path d="M894 194 L906 194 L920 270 Q900 285 880 270 Z" fill="#B85C38"/>
    </g>
    <g>
      <circle cx="980" cy="188" r="6" fill="none" stroke="#2E2A24" stroke-width="3"/>
      <path d="M974 194 L986 194 L998 255 Q980 268 962 255 Z" fill="#D9A441" opacity="0.9"/>
    </g>

    <!-- hook -->
    <circle cx="1055" cy="205" r="7" fill="#2E2A24"/>
    <path d="M1055 205 Q1075 215 1060 232" stroke="#2E2A24" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- item on hook -->
    <path d="M1040 232 Q1060 220 1082 232 L1078 290 Q1060 300 1044 290 Z" fill="#E4C7B2" stroke="#2E2A24" stroke-width="2"/>

    <!-- lower shelf with folded stack -->
    <rect x="775" y="400" width="330" height="14" fill="#B85C38"/>
    <rect x="800" y="360" width="120" height="20" rx="4" fill="#5C6E58"/>
    <rect x="800" y="378" width="120" height="20" rx="4" fill="#D9A441" opacity="0.9"/>
    <rect x="940" y="368" width="110" height="20" rx="4" fill="#B85C38" opacity="0.8"/>
    <rect x="940" y="388" width="110" height="20" rx="4" fill="#E4C7B2"/>
  </g>

  <!-- CHAIR (left side) -->
  <g>
    <!-- back legs -->
    <rect x="330" y="470" width="14" height="110" fill="#2E2A24" opacity="0.85"/>
    <rect x="560" y="470" width="14" height="110" fill="#2E2A24" opacity="0.85"/>
    <!-- front legs -->
    <rect x="310" y="480" width="16" height="130" fill="#2E2A24"/>
    <rect x="580" y="480" width="16" height="130" fill="#2E2A24"/>

    <!-- seat -->
    <rect x="300" y="430" width="310" height="50" rx="10" fill="#B85C38"/>

    <!-- backrest -->
    <rect x="320" y="230" width="60" height="220" rx="16" fill="#5C6E58"/>
    <rect x="530" y="230" width="60" height="220" rx="16" fill="#5C6E58"/>
    <rect x="320" y="230" width="270" height="40" rx="16" fill="#5C6E58"/>

    <!-- draped folded clothing items on chair -->
    <!-- sweater draped over back -->
    <path d="M330 260 Q460 220 590 260 L580 330 Q460 360 340 330 Z" fill="#D9A441"/>
    <path d="M330 260 Q460 285 590 260" fill="none" stroke="#2E2A24" stroke-width="2" opacity="0.3"/>

    <!-- folded shirt on seat -->
    <rect x="330 " y="400" width="0" height="0"/>
    <rect x="335" y="395" width="150" height="45" rx="8" fill="#E4C7B2" stroke="#2E2A24" stroke-width="1.5" opacity="0.95"/>
    <rect x="360" y="405" width="100" height="10" rx="4" fill="#B85C38" opacity="0.5"/>

    <!-- folded scarf draped over arm -->
    <path d="M300 380 Q280 420 300 470 L320 465 Q305 420 320 385 Z" fill="#5C6E58"/>

    <!-- small folded pants over seat edge -->
    <rect x="470" y="400" width="120" height="40" rx="8" fill="#B85C38" opacity="0.85"/>
    <line x1="530" y1="400" x2="530" y2="440" stroke="#2E2A24" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- subtle floor line -->
  <line x1="0" y1="610" x2="1200" y2="610" stroke="#2E2A24" stroke-width="2" opacity="0.15"/>

  <!-- decorative floating dots for calm balance -->
  <circle cx="660" cy="120" r="8" fill="#B85C38" opacity="0.4"/>
  <circle cx="700" cy="160" r="5" fill="#D9A441" opacity="0.5"/>
  <circle cx="640" cy="500" r="6" fill="#5C6E58" opacity="0.3"/>
</svg>