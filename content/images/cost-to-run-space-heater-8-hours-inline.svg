<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">Cost of the same 12 kWh of heat</text>
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#2E2A24" stroke-width="3"/>

  <rect x="140" y="160" width="160" height="340" fill="#B85C38"/>
  <text x="220" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24">$2.04</text>
  <text x="220" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Space heater</text>

  <rect x="400" y="330" width="160" height="170" fill="#D9A441"/>
  <text x="480" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24">$1.02</text>
  <text x="480" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Heat pump, COP 2</text>

  <rect x="660" y="377" width="160" height="123" fill="#5C6E58"/>
  <text x="740" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24">$0.74</text>
  <text x="740" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Gas furnace</text>

  <rect x="920" y="432" width="160" height="68" fill="#D9A441"/>
  <text x="1000" y="417" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24">$0.41</text>
  <text x="1000" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Heat pump, COP 5</text>

</svg>
