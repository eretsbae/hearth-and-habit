<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Rot weakens wood before it shows</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<text x="80" y="140" font-size="28" font-weight="bold">1% of weight lost to rot</text>
<rect x="80" y="160" width="1000" height="46" rx="6" fill="#E4C7B2"/>
<rect x="140" y="160" width="440" height="46" fill="#D9A441"/>
<rect x="580" y="160" width="80" height="46" fill="#D9A441" opacity="0.5"/>
<text x="80" y="246" font-size="26">Toughness down 6% to over 50%</text>
<text x="80" y="320" font-size="28" font-weight="bold">10% of weight lost to rot</text>
<rect x="80" y="340" width="1000" height="46" rx="6" fill="#E4C7B2"/>
<rect x="80" y="340" width="580" height="46" rx="6" fill="#B85C38"/>
<text x="80" y="426" font-size="26">Most strength down over half</text>
<line x1="580" y1="150" x2="580" y2="396" stroke="#2E2A24" stroke-width="3" stroke-dasharray="8 6"/>
<text x="590" y="440" font-size="24">50% line</text>
<rect x="80" y="476" width="1040" height="104" rx="14" fill="#FFFDF9" stroke="#5C6E58" stroke-width="3"/>
<text x="600" y="520" font-size="28" text-anchor="middle">Both stages: seen only under a microscope</text>
<text x="600" y="560" font-size="28" text-anchor="middle" font-weight="bold">Soft, visible rot: far weaker</text>
</g>
</svg>
