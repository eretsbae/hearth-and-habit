<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Deck boards from above -->
  <g>
    <rect x="80" y="60" width="1040" height="60" fill="#E4C7B2"/>
    <rect x="80" y="60" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <rect x="80" y="126" width="1040" height="60" fill="#DEBBA0"/>
    <rect x="80" y="126" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <rect x="80" y="192" width="1040" height="60" fill="#E4C7B2"/>
    <rect x="80" y="192" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <!-- Sunken darker board with cutaway -->
    <rect x="80" y="258" width="1040" height="66" fill="#B85C38" opacity="0.85"/>
    <rect x="80" y="258" width="1040" height="66" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.35"/>

    <rect x="80" y="330" width="1040" height="60" fill="#DEBBA0"/>
    <rect x="80" y="330" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <rect x="80" y="396" width="1040" height="60" fill="#E4C7B2"/>
    <rect x="80" y="396" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <rect x="80" y="462" width="1040" height="60" fill="#DEBBA0"/>
    <rect x="80" y="462" width="1040" height="60" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>

    <rect x="80" y="528" width="1040" height="42" fill="#E4C7B2"/>
    <rect x="80" y="528" width="1040" height="42" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- wood grain lines on non-cutaway boards -->
  <g stroke="#2E2A24" stroke-width="1" opacity="0.12">
    <path d="M120 80 Q400 90 700 78 T1080 85"/>
    <path d="M120 150 Q450 140 800 155 T1080 145"/>
    <path d="M120 215 Q380 225 650 210 T1080 220"/>
    <path d="M120 355 Q420 365 750 350 T1080 358"/>
    <path d="M120 420 Q400 415 700 428 T1080 420"/>
    <path d="M120 485 Q450 495 800 480 T1080 488"/>
    <path d="M120 545 Q380 555 700 540 T1080 548"/>
  </g>

  <!-- Cutaway section revealing joist underneath -->
  <g>
    <!-- cut opening frame -->
    <rect x="430" y="258" width="280" height="66" fill="#2E2A24"/>
    <!-- inside depth shadow -->
    <rect x="440" y="264" width="260" height="54" fill="#3a352c"/>

    <!-- joist beam running perpendicular under boards -->
    <rect x="440" y="278" width="260" height="26" fill="#5C6E58"/>
    <rect x="440" y="278" width="260" height="26" fill="none" stroke="#2E2A24" stroke-width="1.5" opacity="0.4"/>

    <!-- joist end grain hint -->
    <rect x="440" y="278" width="14" height="26" fill="#4a5a47"/>
    <rect x="686" y="278" width="14" height="26" fill="#4a5a47"/>

    <!-- small gap shadows below joist -->
    <rect x="440" y="304" width="260" height="10" fill="#221f1a"/>

    <!-- screws/fasteners visible on sunken board edges -->
    <circle cx="460" cy="270" r="3" fill="#D9A441"/>
    <circle cx="680" cy="270" r="3" fill="#D9A441"/>
    <circle cx="460" cy="312" r="3" fill="#D9A441"/>
    <circle cx="680" cy="312" r="3" fill="#D9A441"/>
  </g>

  <!-- subtle shadow around sunken board to show depression -->
  <g opacity="0.25">
    <rect x="80" y="256" width="1040" height="4" fill="#2E2A24"/>
    <rect x="80" y="322" width="1040" height="4" fill="#2E2A24"/>
  </g>

  <!-- fasteners on other boards for consistency -->
  <g fill="#D9A441" opacity="0.6">
    <circle cx="110" cy="90" r="3"/>
    <circle cx="1090" cy="90" r="3"/>
    <circle cx="110" cy="156" r="3"/>
    <circle cx="1090" cy="156" r="3"/>
    <circle cx="110" cy="222" r="3"/>
    <circle cx="1090" cy="222" r="3"/>
    <circle cx="110" cy="360" r="3"/>
    <circle cx="1090" cy="360" r="3"/>
    <circle cx="110" cy="426" r="3"/>
    <circle cx="1090" cy="426" r="3"/>
    <circle cx="110" cy="492" r="3"/>
    <circle cx="1090" cy="492" r="3"/>
  </g>

  <!-- decorative potted plant top-down, upper right corner for editorial touch -->
  <g transform="translate(1020,470)">
    <circle r="55" fill="#B85C38" opacity="0.9"/>
    <circle r="42" fill="#5C6E58"/>
    <circle cx="-10" cy="-8" r="14" fill="#6f8169"/>
    <circle cx="14" cy="6" r="12" fill="#6f8169"/>
    <circle cx="-4" cy="16" r="10" fill="#4b5a47"/>
  </g>

  <!-- small decorative shadow of a chair leg edge, top-left corner -->
  <g opacity="0.5">
    <rect x="60" y="60" width="14" height="14" fill="#2E2A24"/>
    <rect x="60" y="500" width="14" height="14" fill="#2E2A24"/>
  </g>
</svg>