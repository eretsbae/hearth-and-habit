<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- background soft shapes -->
  <circle cx="1080" cy="90" r="90" fill="#E4C7B2" opacity="0.5"/>
  <circle cx="120" cy="80" r="60" fill="#D9A441" opacity="0.3"/>
  <circle cx="150" cy="550" r="120" fill="#5C6E58" opacity="0.15"/>

  <!-- gutter trough -->
  <path d="M300 380 L900 380 L860 480 Q600 520 340 480 Z" fill="#B85C38"/>
  <path d="M340 400 L860 400 L830 470 Q600 500 370 470 Z" fill="#8f4429"/>

  <!-- gutter interior shadow -->
  <path d="M370 410 L830 410 L810 460 Q600 485 390 460 Z" fill="#7a3a24"/>

  <!-- water pooled at bottom -->
  <path d="M420 440 L780 440 L765 465 Q600 480 435 465 Z" fill="#5C6E58" opacity="0.6"/>

  <!-- gutter guard mesh sitting on top -->
  <g>
    <rect x="300" y="330" width="600" height="26" rx="6" fill="#D9A441"/>
    <rect x="300" y="330" width="600" height="26" rx="6" fill="#D9A441" opacity="0.9"/>
    <!-- mesh holes -->
    <g fill="#F6EFE6" opacity="0.85">
      <rect x="320" y="337" width="18" height="12" rx="2"/>
      <rect x="360" y="337" width="18" height="12" rx="2"/>
      <rect x="400" y="337" width="18" height="12" rx="2"/>
      <rect x="440" y="337" width="18" height="12" rx="2"/>
      <rect x="480" y="337" width="18" height="12" rx="2"/>
      <rect x="520" y="337" width="18" height="12" rx="2"/>
      <rect x="560" y="337" width="18" height="12" rx="2"/>
      <rect x="600" y="337" width="18" height="12" rx="2"/>
      <rect x="640" y="337" width="18" height="12" rx="2"/>
      <rect x="680" y="337" width="18" height="12" rx="2"/>
      <rect x="720" y="337" width="18" height="12" rx="2"/>
      <rect x="760" y="337" width="18" height="12" rx="2"/>
      <rect x="800" y="337" width="18" height="12" rx="2"/>
      <rect x="840" y="337" width="18" height="12" rx="2"/>
    </g>
  </g>

  <!-- roofline edge behind gutter -->
  <path d="M260 330 L940 330 L940 300 L260 300 Z" fill="#5C6E58"/>
  <path d="M260 300 L940 300 L900 270 L300 270 Z" fill="#788c72"/>

  <!-- leaves and debris sitting on guard -->
  <g>
    <!-- leaf shapes -->
    <path d="M400 320 Q420 290 450 305 Q440 330 410 335 Z" fill="#5C6E58"/>
    <path d="M400 320 Q420 300 445 308" stroke="#3f4b3c" stroke-width="2" fill="none"/>

    <path d="M480 315 Q505 285 535 300 Q520 328 490 330 Z" fill="#B85C38"/>
    <path d="M482 316 Q505 296 530 304" stroke="#823f27" stroke-width="2" fill="none"/>

    <path d="M600 312 Q625 280 655 298 Q640 325 610 328 Z" fill="#D9A441"/>
    <path d="M602 313 Q625 292 650 300" stroke="#a87b2c" stroke-width="2" fill="none"/>

    <path d="M700 318 Q722 288 752 302 Q740 328 710 332 Z" fill="#5C6E58"/>
    <path d="M702 319 Q722 300 748 306" stroke="#3f4b3c" stroke-width="2" fill="none"/>

    <path d="M780 312 Q805 282 835 298 Q818 325 790 328 Z" fill="#B85C38"/>
    <path d="M782 313 Q805 294 830 300" stroke="#823f27" stroke-width="2" fill="none"/>

    <!-- twig -->
    <path d="M540 330 Q580 300 630 320" stroke="#2E2A24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M560 316 L575 305" stroke="#2E2A24" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- small debris dots -->
    <circle cx="460" cy="330" r="4" fill="#2E2A24" opacity="0.6"/>
    <circle cx="660" cy="333" r="3" fill="#2E2A24" opacity="0.5"/>
    <circle cx="860" cy="328" r="4" fill="#2E2A24" opacity="0.6"/>
  </g>

  <!-- water drops falling through and out from downspout -->
  <g fill="#5C6E58" opacity="0.85">
    <path d="M600 500 Q605 515 600 528 Q595 515 600 500 Z"/>
    <path d="M620 520 Q625 535 620 548 Q615 535 620 520 Z"/>
    <path d="M580 530 Q585 545 580 558 Q575 545 580 530 Z"/>
    <path d="M600 560 Q605 575 600 588 Q595 575 600 560 Z"/>
  </g>

  <!-- droplets seeping through mesh holes -->
  <g fill="#5C6E58" opacity="0.7">
    <circle cx="440" cy="365" r="5"/>
    <circle cx="520" cy="370" r="4"/>
    <circle cx="700" cy="368" r="5"/>
    <circle cx="780" cy="372" r="4"/>
  </g>

  <!-- downspout hint -->
  <rect x="580" y="480" width="40" height="120" fill="#8f4429"/>
  <rect x="580" y="480" width="40" height="120" fill="#7a3a24" opacity="0.4"/>

</svg>