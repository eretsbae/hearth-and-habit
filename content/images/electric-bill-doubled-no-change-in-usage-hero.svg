<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- background soft shapes -->
  <circle cx="150" cy="120" r="90" fill="#E4C7B2" opacity="0.5"/>
  <circle cx="1080" cy="500" r="120" fill="#D9A441" opacity="0.2"/>
  <circle cx="1050" cy="90" r="60" fill="#5C6E58" opacity="0.15"/>

  <!-- wall panel -->
  <rect x="0" y="0" width="1200" height="630" fill="none"/>
  <rect x="550" y="60" width="220" height="340" rx="10" fill="#E4C7B2" opacity="0.4"/>

  <!-- electric meter body -->
  <g>
    <circle cx="660" cy="220" r="140" fill="#F6EFE6" stroke="#2E2A24" stroke-width="6"/>
    <circle cx="660" cy="220" r="110" fill="#ffffff" opacity="0.6"/>
    <circle cx="660" cy="220" r="110" fill="none" stroke="#5C6E58" stroke-width="4"/>

    <!-- dial display -->
    <rect x="600" y="195" width="120" height="50" rx="6" fill="#2E2A24"/>
    <rect x="608" y="203" width="18" height="34" fill="#D9A441"/>
    <rect x="632" y="203" width="18" height="34" fill="#D9A441"/>
    <rect x="656" y="203" width="18" height="34" fill="#B85C38"/>
    <rect x="680" y="203" width="18" height="34" fill="#D9A441"/>

    <!-- gauge needle -->
    <circle cx="660" cy="290" r="30" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
    <line x1="660" y1="290" x2="678" y2="270" stroke="#B85C38" stroke-width="5" stroke-linecap="round"/>
    <circle cx="660" cy="290" r="5" fill="#2E2A24"/>

    <!-- meter top screws -->
    <circle cx="660" cy="90" r="10" fill="#2E2A24"/>
    <rect x="640" y="70" width="40" height="20" rx="4" fill="#5C6E58"/>

    <!-- base box behind meter -->
    <rect x="600" y="345" width="120" height="90" rx="8" fill="#5C6E58"/>
    <rect x="615" y="360" width="90" height="14" fill="#2E2A24" opacity="0.4"/>
    <rect x="615" y="385" width="90" height="14" fill="#2E2A24" opacity="0.4"/>
    <rect x="615" y="410" width="90" height="14" fill="#2E2A24" opacity="0.4"/>
  </g>

  <!-- oversized bill -->
  <g transform="translate(230,300) rotate(-6)">
    <rect x="0" y="0" width="300" height="380" rx="10" fill="#F6EFE6" stroke="#2E2A24" stroke-width="5"/>
    <rect x="25" y="30" width="180" height="22" rx="4" fill="#5C6E58"/>
    <rect x="25" y="70" width="250" height="10" fill="#D9A441"/>
    <rect x="25" y="95" width="250" height="10" fill="#E4C7B2"/>
    <rect x="25" y="120" width="180" height="10" fill="#E4C7B2"/>
    <rect x="25" y="150" width="250" height="2" fill="#2E2A24" opacity="0.3"/>

    <!-- big alarming total -->
    <rect x="25" y="175" width="250" height="70" rx="6" fill="#B85C38"/>
    <circle cx="60" cy="210" r="18" fill="#F6EFE6"/>
    <rect x="90" y="198" width="140" height="24" rx="4" fill="#F6EFE6"/>

    <rect x="25" y="265" width="250" height="10" fill="#E4C7B2"/>
    <rect x="25" y="290" width="200" height="10" fill="#E4C7B2"/>
    <rect x="25" y="315" width="230" height="10" fill="#E4C7B2"/>

    <!-- exclamation stamp -->
    <circle cx="245" cy="330" r="34" fill="#D9A441" opacity="0.9"/>
    <rect x="240" y="312" width="10" height="26" fill="#2E2A24"/>
    <circle cx="245" cy="346" r="5" fill="#2E2A24"/>
  </g>

  <!-- magnifying glass hovering over bill/meter -->
  <g transform="translate(560,430)">
    <circle cx="0" cy="0" r="95" fill="#F6EFE6" opacity="0.35" stroke="#2E2A24" stroke-width="8"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#B85C38" stroke-width="10"/>
    <rect x="60" y="55" width="30" height="140" rx="14" fill="#2E2A24" transform="rotate(40)"/>
    <!-- little alarmed spark inside lens -->
    <path d="M-10 -30 L10 -5 L-5 -5 L15 30 L-25 5 L-8 5 Z" fill="#B85C38" opacity="0.85"/>
  </g>

  <!-- small warning bolts floating around -->
  <g fill="#B85C38">
    <path d="M900 180 L915 210 L903 210 L920 245 L888 215 L900 215 Z" opacity="0.8"/>
    <path d="M950 350 L960 372 L952 372 L965 398 L940 378 L950 378 Z" opacity="0.6"/>
  </g>

  <!-- floating coin/cost icons -->
  <circle cx="1000" cy="480" r="26" fill="#D9A441"/>
  <circle cx="1000" cy="480" r="26" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <circle cx="960" cy="530" r="18" fill="#D9A441" opacity="0.7"/>
  <circle cx="960" cy="530" r="18" fill="none" stroke="#2E2A24" stroke-width="2"/>
</svg>