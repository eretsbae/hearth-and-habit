<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="78" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Bill ratio = three ratios multiplied</text>
<rect x="60" y="140" width="320" height="120" rx="16" fill="#5C6E58"/>
<text x="220" y="212" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F6EFE6" text-anchor="middle">Days billed</text>
<text x="420" y="214" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2E2A24" text-anchor="middle">×</text>
<rect x="460" y="140" width="280" height="120" rx="16" fill="#D9A441"/>
<text x="600" y="212" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24" text-anchor="middle">kWh per day</text>
<text x="780" y="214" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2E2A24" text-anchor="middle">×</text>
<rect x="820" y="140" width="320" height="120" rx="16" fill="#B85C38"/>
<text x="980" y="212" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F6EFE6" text-anchor="middle">Price per kWh</text>
<line x1="220" y1="262" x2="220" y2="352" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="600" y1="262" x2="600" y2="352" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="980" y1="262" x2="980" y2="352" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="364" width="320" height="200" rx="16" fill="#E4C7B2"/>
<text x="220" y="430" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Longer cycle</text>
<text x="220" y="470" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">or estimate</text>
<text x="220" y="510" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">catch-up</text>
<rect x="440" y="364" width="320" height="200" rx="16" fill="#E4C7B2"/>
<text x="600" y="430" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Weather,</text>
<text x="600" y="470" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">heat strips,</text>
<text x="600" y="510" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">new load</text>
<rect x="820" y="364" width="320" height="200" rx="16" fill="#E4C7B2"/>
<text x="980" y="430" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Plan expired,</text>
<text x="980" y="470" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">higher tier,</text>
<text x="980" y="510" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">settle-up</text>
</svg>
