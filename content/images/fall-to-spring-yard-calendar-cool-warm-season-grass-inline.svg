<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">Soil temperature triggers</text>
  <rect x="100" y="300" width="1000" height="40" rx="20" fill="#E4C7B2"/>
  <rect x="100" y="300" width="250" height="40" rx="20" fill="#5C6E58"/>
  <rect x="600" y="300" width="250" height="40" fill="#B85C38" opacity="0.45"/>
  <line x1="350" y1="200" x2="350" y2="300" stroke="#5C6E58" stroke-width="6"/>
  <text x="350" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">50°F: fescue seeding stops</text>
  <line x1="475" y1="340" x2="475" y2="440" stroke="#D9A441" stroke-width="6"/>
  <text x="475" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">55°F: preventer down before</text>
  <line x1="725" y1="200" x2="725" y2="300" stroke="#B85C38" stroke-width="6"/>
  <text x="790" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">65°F: warm-season green-up</text>
  <line x1="600" y1="560" x2="850" y2="560" stroke="#B85C38" stroke-width="8"/>
  <text x="870" y="568" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">60–70°F: crabgrass peak</text>
</svg>
