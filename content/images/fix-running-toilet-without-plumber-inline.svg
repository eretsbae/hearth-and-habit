<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="70" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Tank settings that stop the running</text>
<!-- tank -->
<rect x="120" y="120" width="460" height="440" rx="14" fill="#E4C7B2" stroke="#2E2A24" stroke-width="4"/>
<rect x="124" y="236" width="452" height="320" rx="10" fill="#5C6E58" fill-opacity="0.35"/>
<line x1="124" y1="236" x2="576" y2="236" stroke="#2E2A24" stroke-width="2" stroke-dasharray="6 5"/>
<!-- overflow pipe -->
<rect x="330" y="220" width="36" height="300" fill="#F6EFE6" stroke="#2E2A24" stroke-width="3"/>
<!-- fill valve -->
<rect x="470" y="160" width="40" height="380" fill="#D9A441" stroke="#2E2A24" stroke-width="3"/>
<rect x="455" y="150" width="70" height="20" rx="4" fill="#B85C38"/>
<!-- flapper and chain -->
<path d="M280 530 Q348 500 416 530 Z" fill="#B85C38" stroke="#2E2A24" stroke-width="3"/>
<path d="M300 520 Q290 400 250 300 Q240 260 230 160" fill="none" stroke="#2E2A24" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="150" y1="150" x2="300" y2="150" stroke="#2E2A24" stroke-width="8" stroke-linecap="round"/>
<!-- callouts -->
<g stroke="#2E2A24" stroke-width="2">
<line x1="580" y1="228" x2="650" y2="228"/>
<line x1="530" y1="160" x2="650" y2="140"/>
<line x1="300" y1="152" x2="650" y2="330"/>
<line x1="270" y1="400" x2="650" y2="430"/>
<line x1="400" y1="528" x2="650" y2="520"/>
</g>
<g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">
<text x="660" y="236">Water ~1/2" below overflow top</text>
<text x="660" y="148">Valve cap ~3" above overflow</text>
<text x="660" y="338">Overflow 1"+ below lever hole</text>
<text x="660" y="438">Chain: about 1/2" slack</text>
<text x="660" y="528">Flapper: 2" or 3" size</text>
</g>
</svg>
