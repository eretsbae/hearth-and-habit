<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="80" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Outage hold times, door closed</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">
<text x="80" y="170">Fridge: about 4 hours</text>
<rect x="80" y="186" width="1040" height="50" rx="8" fill="#E4C7B2"/>
<rect x="80" y="186" width="87" height="50" rx="8" fill="#B85C38"/>
<text x="80" y="320">Half-full freezer: about 24 hours</text>
<rect x="80" y="336" width="1040" height="50" rx="8" fill="#E4C7B2"/>
<rect x="80" y="336" width="520" height="50" rx="8" fill="#D9A441"/>
<text x="80" y="470">Full freezer: about 48 hours</text>
<rect x="80" y="486" width="1040" height="50" rx="8" fill="#5C6E58"/>
</g>
<g stroke="#2E2A24" stroke-width="3" stroke-dasharray="8 6">
<line x1="600" y1="140" x2="600" y2="560"/>
<line x1="1120" y1="140" x2="1120" y2="560"/>
</g>
</svg>
