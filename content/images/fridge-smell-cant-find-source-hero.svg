<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Fridge outer body -->
  <rect x="330" y="60" width="540" height="520" rx="18" fill="#E4C7B2"/>
  <rect x="330" y="60" width="540" height="520" rx="18" fill="none" stroke="#2E2A24" stroke-width="3"/>

  <!-- Interior cavity -->
  <rect x="365" y="95" width="470" height="450" rx="10" fill="#F6EFE6"/>
  <rect x="365" y="95" width="470" height="450" rx="10" fill="none" stroke="#2E2A24" stroke-width="2.5"/>

  <!-- Interior side shading -->
  <rect x="365" y="95" width="30" height="450" fill="#E4C7B2" opacity="0.5"/>
  <rect x="805" y="95" width="30" height="450" fill="#2E2A24" opacity="0.06"/>

  <!-- Shelves -->
  <rect x="380" y="215" width="440" height="10" rx="4" fill="#5C6E58"/>
  <rect x="380" y="335" width="440" height="10" rx="4" fill="#5C6E58"/>
  <rect x="380" y="455" width="440" height="10" rx="4" fill="#5C6E58"/>

  <!-- Top compartment items -->
  <rect x="400" y="130" width="70" height="70" rx="6" fill="#B85C38"/>
  <circle cx="530" cy="170" r="35" fill="#D9A441"/>
  <rect x="600" y="140" width="55" height="60" rx="8" fill="#5C6E58"/>
  <rect x="680" y="150" width="90" height="50" rx="6" fill="#F6EFE6" stroke="#2E2A24" stroke-width="2"/>

  <!-- Middle compartment items -->
  <rect x="400" y="245" width="60" height="75" rx="6" fill="#D9A441"/>
  <circle cx="510" cy="285" r="30" fill="#B85C38"/>
  <rect x="560" y="255" width="80" height="65" rx="10" fill="#F6EFE6" stroke="#2E2A24" stroke-width="2"/>
  <rect x="660" y="260" width="50" height="60" rx="6" fill="#5C6E58"/>
  <rect x="730" y="250" width="65" height="70" rx="6" fill="#E4C7B2" stroke="#2E2A24" stroke-width="2"/>

  <!-- Lower compartment items -->
  <rect x="400" y="365" width="90" height="75" rx="8" fill="#5C6E58"/>
  <rect x="510" y="375" width="70" height="65" rx="6" fill="#D9A441"/>
  <circle cx="640" cy="405" r="32" fill="#B85C38"/>
  <rect x="700" y="370" width="80" height="70" rx="8" fill="#F6EFE6" stroke="#2E2A24" stroke-width="2"/>

  <!-- Bottom drawers -->
  <rect x="380" y="475" width="440" height="60" rx="8" fill="#5C6E58"/>
  <rect x="410" y="500" width="60" height="8" rx="4" fill="#F6EFE6"/>
  <rect x="380" y="545" width="440" height="60" rx="8" fill="#B85C38"/>
  <rect x="410" y="570" width="60" height="8" rx="4" fill="#F6EFE6"/>

  <!-- Door bins on left side, suggested by inner panel -->
  <rect x="365" y="95" width="30" height="450" rx="6" fill="none"/>

  <!-- Odor wavy lines rising from bottom drawer corner -->
  <path d="M 800 545 C 815 520, 785 500, 800 475 C 815 450, 785 430, 800 405"
        fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 825 555 C 840 530, 810 510, 825 485 C 840 460, 810 440, 825 415"
        fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 850 545 C 865 520, 835 500, 850 475 C 865 450, 835 430, 850 405"
        fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Small decorative dots for ambience -->
  <circle cx="150" cy="120" r="6" fill="#D9A441" opacity="0.5"/>
  <circle cx="1080" cy="180" r="8" fill="#B85C38" opacity="0.4"/>
  <circle cx="1120" cy="500" r="6" fill="#5C6E58" opacity="0.4"/>
  <circle cx="90" cy="480" r="7" fill="#E4C7B2" opacity="0.6"/>
</svg>