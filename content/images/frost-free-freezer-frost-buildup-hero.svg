    <circle cx="450" cy="190" r="6"/><circle cx="520" cy="175" r="5"/><circle cx="610" cy="195" r="7"/>
    <circle cx="700" cy="180" r="5"/><circle cx="760" cy="200" r="6"/><circle cx="480" cy="330" r="5"/>
    <circle cx="740" cy="340" r="6"/>
