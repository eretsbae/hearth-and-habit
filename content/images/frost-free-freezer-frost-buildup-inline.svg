    <circle cx="700" cy="415" r="7"/><circle cx="550" cy="275" r="7"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">
    <text x="365" y="160" text-anchor="end">Rear wall:</text>
    <text x="365" y="190" text-anchor="end">blocked vents, warm air</text>
    <text x="365" y="334" text-anchor="end">Door edge:</text>
    <text x="365" y="364" text-anchor="end">gasket not sealing</text>
    <text x="365" y="502" text-anchor="end">Floor ice sheet:</text>
    <text x="365" y="532" text-anchor="end">likely blocked drain</text>
    <text x="835" y="409">Ice bucket:</text>
    <text x="835" y="439">air leak at flap or seal</text>
    <text x="835" y="214">Inside packages:</text>
    <text x="835" y="244">packaging (freezer burn)</text>
