<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- utility room background -->
  <rect x="0" y="0" width="1200" height="420" fill="#F6EFE6"/>
  <rect x="0" y="420" width="1200" height="210" fill="#E4C7B2" opacity="0.4"/>

  <!-- wall panel lines -->
  <rect x="80" y="60" width="1040" height="360" fill="none" stroke="#D9A441" stroke-width="2" opacity="0.25"/>
  <line x1="80" y1="240" x2="1120" y2="240" stroke="#5C6E58" stroke-width="1.5" opacity="0.15"/>

  <!-- duct pipe entering from top -->
  <rect x="540" y="0" width="120" height="120" fill="#5C6E58" opacity="0.85"/>
  <rect x="530" y="100" width="140" height="30" fill="#2E2A24" opacity="0.7"/>

  <!-- shelf / utility box in background -->
  <rect x="120" y="360" width="180" height="90" fill="#B85C38" opacity="0.5"/>
  <rect x="130" y="340" width="160" height="20" fill="#5C6E58" opacity="0.5"/>

  <rect x="900" y="380" width="140" height="70" fill="#5C6E58" opacity="0.4"/>
  <circle cx="970" cy="415" r="18" fill="#D9A441" opacity="0.5"/>

  <!-- furnace filter frame -->
  <g>
    <rect x="450" y="130" width="300" height="380" rx="10" fill="#2E2A24"/>
    <rect x="465" y="145" width="270" height="350" rx="6" fill="#F6EFE6"/>

    <!-- clean half (left) -->
    <clipPath id="cleanClip">
      <rect x="465" y="145" width="135" height="350"/>
    </clipPath>
    <g clip-path="url(#cleanClip)">
      <rect x="465" y="145" width="135" height="350" fill="#F6EFE6"/>
      <g stroke="#D9A441" stroke-width="3">
        <line x1="470" y1="150" x2="470" y2="490" />
        <line x1="490" y1="150" x2="490" y2="490" />
        <line x1="510" y1="150" x2="510" y2="490" />
        <line x1="530" y1="150" x2="530" y2="490" />
        <line x1="550" y1="150" x2="550" y2="490" />
        <line x1="570" y1="150" x2="570" y2="490" />
        <line x1="590" y1="150" x2="590" y2="490" />
      </g>
      <g stroke="#B85C38" stroke-width="6" opacity="0.6">
        <path d="M465 150 L600 490" fill="none"/>
        <path d="M465 250 L520 490" fill="none"/>
        <path d="M465 350 L440 490" fill="none"/>
      </g>
    </g>

    <!-- gray/dirty half (right) -->
    <clipPath id="dirtyClip">
      <rect x="600" y="145" width="135" height="350"/>
    </clipPath>
    <g clip-path="url(#dirtyClip)">
      <rect x="600" y="145" width="135" height="350" fill="#5C6E58" opacity="0.35"/>
      <g stroke="#2E2A24" stroke-width="3" opacity="0.6">
        <line x1="610" y1="150" x2="610" y2="490" />
        <line x1="630" y1="150" x2="630" y2="490" />
        <line x1="650" y1="150" x2="650" y2="490" />
        <line x1="670" y1="150" x2="670" y2="490" />
        <line x1="690" y1="150" x2="690" y2="490" />
        <line x1="710" y1="150" x2="710" y2="490" />
        <line x1="730" y1="150" x2="730" y2="490" />
      </g>
      <g fill="#2E2A24" opacity="0.5">
        <circle cx="620" cy="200" r="10"/>
        <circle cx="660" cy="260" r="14"/>
        <circle cx="700" cy="320" r="9"/>
        <circle cx="640" cy="380" r="12"/>
        <circle cx="690" cy="440" r="10"/>
        <circle cx="720" cy="190" r="7"/>
        <circle cx="610" cy="450" r="8"/>
      </g>
    </g>

    <!-- center divider -->
    <line x1="600" y1="145" x2="600" y2="495" stroke="#2E2A24" stroke-width="4"/>
  </g>

  <!-- dust particles floating around, more concentrated near dirty side -->
  <g fill="#5C6E58" opacity="0.55">
    <circle cx="800" cy="150" r="6"/>
    <circle cx="850" cy="220" r="9"/>
    <circle cx="820" cy="300" r="5"/>
    <circle cx="870" cy="380" r="7"/>
    <circle cx="790" cy="460" r="6"/>
    <circle cx="900" cy="140" r="4"/>
    <circle cx="930" cy="260" r="6"/>
    <circle cx="860" cy="500" r="5"/>
  </g>

  <g fill="#2E2A24" opacity="0.4">
    <circle cx="775" cy="200" r="4"/>
    <circle cx="805" cy="340" r="4"/>
    <circle cx="845" cy="440" r="3"/>
    <circle cx="915" cy="200" r="3"/>
    <circle cx="880" cy="320" r="4"/>
  </g>

  <!-- lighter dust near clean side, sparse -->
  <g fill="#D9A441" opacity="0.4">
    <circle cx="380" cy="180" r="5"/>
    <circle cx="340" cy="280" r="4"/>
    <circle cx="400" cy="400" r="5"/>
    <circle cx="360" cy="480" r="3"/>
  </g>

  <!-- floor shadow under filter -->
  <ellipse cx="600" cy="520" rx="220" ry="20" fill="#2E2A24" opacity="0.12"/>

  <!-- small vignette accents at corners for editorial feel -->
  <circle cx="100" cy="80" r="40" fill="#D9A441" opacity="0.12"/>
  <circle cx="1120" cy="560" r="60" fill="#B85C38" opacity="0.1"/>
</svg>