<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="80" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Gray in two weeks? Check in this order</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<rect x="60" y="125" width="1080" height="95" rx="14" fill="#B85C38"/>
<text x="100" y="185" font-size="32" font-weight="bold" fill="#F6EFE6">1  Fan on "On": at least 4x the air</text>
<rect x="60" y="240" width="1080" height="95" rx="14" fill="#D9A441"/>
<text x="100" y="300" font-size="32" font-weight="bold">2  Pets, people, smoking, remodel</text>
<rect x="60" y="355" width="1080" height="95" rx="14" fill="#5C6E58"/>
<text x="100" y="415" font-size="32" font-weight="bold" fill="#F6EFE6">3  Loose filter-slot cover</text>
<rect x="60" y="470" width="1080" height="95" rx="14" fill="#E4C7B2"/>
<text x="100" y="530" font-size="32" font-weight="bold">4  Leaky return ducts in attic</text>
</g>
</svg>
