<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- attic roof triangle background -->
  <polygon points="0,120 600,0 1200,120 1200,0 0,0" fill="#E4C7B2" opacity="0.5"/>
  <polygon points="60,150 600,20 1140,150" fill="#E4C7B2" opacity="0.4"/>

  <!-- roof rafters -->
  <g stroke="#2E2A24" stroke-width="4" opacity="0.35">
    <line x1="200" y1="112" x2="600" y2="30"/>
    <line x1="400" y1="112" x2="600" y2="45"/>
    <line x1="800" y1="112" x2="600" y2="45"/>
    <line x1="1000" y1="112" x2="600" y2="30"/>
  </g>

  <!-- attic floor -->
  <rect x="0" y="150" width="1200" height="16" fill="#D9A441" opacity="0.5"/>

  <!-- insulation batts -->
  <g fill="#F6EFE6">
    <rect x="40" y="166" width="150" height="20" rx="6"/>
    <rect x="230" y="166" width="150" height="20" rx="6"/>
    <rect x="900" y="166" width="150" height="20" rx="6"/>
    <rect x="1080" y="166" width="120" height="20" rx="6"/>
  </g>

  <!-- main horizontal duct trunk -->
  <rect x="150" y="230" width="900" height="120" rx="10" fill="#5C6E58"/>
  <rect x="150" y="230" width="900" height="18" fill="#4a5a47"/>

  <!-- duct segments joints -->
  <g stroke="#2E2A24" stroke-width="3" opacity="0.4">
    <line x1="330" y1="230" x2="330" y2="350"/>
    <line x1="510" y1="230" x2="510" y2="350"/>
    <line x1="690" y1="230" x2="690" y2="350"/>
    <line x1="870" y1="230" x2="870" y2="350"/>
  </g>

  <!-- cutaway interior of duct -->
  <rect x="150" y="260" width="900" height="60" fill="#3f4d3c"/>
  <g fill="#2E2A24" opacity="0.5">
    <circle cx="220" cy="290" r="4"/>
    <circle cx="260" cy="285" r="3"/>
    <circle cx="400" cy="292" r="4"/>
    <circle cx="600" cy="288" r="3"/>
    <circle cx="760" cy="292" r="4"/>
    <circle cx="900" cy="286" r="3"/>
  </g>

  <!-- branch duct going down to furnace -->
  <rect x="560" y="350" width="90" height="150" fill="#5C6E58"/>
  <rect x="560" y="350" width="90" height="16" fill="#4a5a47"/>

  <!-- furnace box -->
  <rect x="500" y="490" width="210" height="110" rx="12" fill="#B85C38"/>
  <rect x="520" y="510" width="80" height="70" rx="6" fill="#F6EFE6"/>
  <g fill="#2E2A24" opacity="0.6">
    <rect x="530" y="518" width="60" height="6"/>
    <rect x="530" y="530" width="60" height="6"/>
    <rect x="530" y="542" width="60" height="6"/>
    <rect x="530" y="554" width="60" height="6"/>
    <rect x="530" y="566" width="60" height="6"/>
  </g>
  <circle cx="670" cy="545" r="18" fill="#D9A441"/>
  <circle cx="670" cy="545" r="8" fill="#F6EFE6"/>

  <!-- leaking joints: gaps with escaping air/dust puffs -->
  <g opacity="0.9">
    <path d="M330 260 q10 -14 22 0" stroke="#F6EFE6" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M510 260 q10 -14 22 0" stroke="#F6EFE6" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M690 260 q10 -14 22 0" stroke="#F6EFE6" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M870 260 q10 -14 22 0" stroke="#F6EFE6" stroke-width="6" fill="none" opacity="0.7"/>
  </g>

  <!-- dust particles escaping upward from joints -->
  <g fill="#2E2A24" opacity="0.55">
    <circle cx="335" cy="220" r="4"/>
    <circle cx="345" cy="195" r="3"/>
    <circle cx="325" cy="170" r="2.5"/>
    <circle cx="515" cy="215" r="3.5"/>
    <circle cx="525" cy="185" r="3"/>
    <circle cx="500" cy="160" r="2.5"/>
    <circle cx="700" cy="222" r="4"/>
    <circle cx="710" cy="190" r="3"/>
    <circle cx="695" cy="165" r="2.5"/>
    <circle cx="880" cy="218" r="3.5"/>
    <circle cx="895" cy="192" r="3"/>
    <circle cx="875" cy="160" r="2.5"/>
  </g>

  <!-- curved wispy air leak lines -->
  <g stroke="#D9A441" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M330 225 q-8 -20 6 -40"/>
    <path d="M525 220 q10 -22 -4 -44"/>
    <path d="M700 225 q-8 -20 8 -40"/>
    <path d="M885 222 q10 -22 -6 -42"/>
  </g>

  <!-- floating dust motes across attic space -->
  <g fill="#B85C38" opacity="0.4">
    <circle cx="150" cy="100" r="3"/>
    <circle cx="260" cy="70" r="2"/>
    <circle cx="950" cy="90" r="3"/>
    <circle cx="1040" cy="60" r="2.5"/>
    <circle cx="450" cy="60" r="2"/>
    <circle cx="780" cy="50" r="2.5"/>
  </g>

  <!-- small decorative vent grille on left -->
  <g transform="translate(80,420)">
    <rect x="0" y="0" width="70" height="90" rx="8" fill="#E4C7B2"/>
    <g stroke="#2E2A24" stroke-width="3" opacity="0.5">
      <line x1="10" y1="15" x2="60" y2="15"/>
      <line x1="10" y1="30" x2="60" y2="30"/>
      <line x1="10" y1="45" x2="60" y2="45"/>
      <line x1="10" y1="60" x2="60" y2="60"/>
      <line x1="10" y1="75" x2="60" y2="75"/>
    </g>
  </g>

  <!-- decorative vent grille on right -->
  <g transform="translate(1050,420)">
    <rect x="0" y="0" width="70" height="90" rx="8" fill="#E4C7B2"/>
    <g stroke="#2E2A24" stroke-width="3" opacity="0.5">
      <line x1="10" y1="15" x2="60" y2="15"/>
      <line x1="10" y1="30" x2="60" y2="30"/>
      <line x1="10" y1="45" x2="60" y2="45"/>
      <line x1="10" y1="60" x2="60" y2="60"/>
      <line x1="10" y1="75" x2="60" y2="75"/>
    </g>
  </g>

  <!-- ground/floor line -->
  <rect x="0" y="600" width="1200" height="30" fill="#5C6E58" opacity="0.3"/>
</svg>