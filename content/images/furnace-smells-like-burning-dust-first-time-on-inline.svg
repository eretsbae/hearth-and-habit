<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="78" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">First-run furnace smell: which way is it going?</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<rect x="60" y="120" width="520" height="210" rx="16" fill="#5C6E58"/>
<text x="320" y="190" font-size="32" font-weight="bold" fill="#F6EFE6" text-anchor="middle">Dusty smell, fading</text>
<text x="320" y="245" font-size="28" fill="#F6EFE6" text-anchor="middle">Normal dust burn-off</text>
<text x="320" y="290" font-size="28" fill="#F6EFE6" text-anchor="middle">Let it run and watch</text>
<rect x="620" y="120" width="520" height="210" rx="16" fill="#D9A441"/>
<text x="880" y="190" font-size="32" font-weight="bold" text-anchor="middle">Getting stronger</text>
<text x="880" y="245" font-size="28" text-anchor="middle">Turn the unit off</text>
<text x="880" y="290" font-size="28" text-anchor="middle">Call an HVAC pro</text>
<rect x="60" y="360" width="520" height="210" rx="16" fill="#B85C38"/>
<text x="320" y="430" font-size="32" font-weight="bold" fill="#F6EFE6" text-anchor="middle">Electrical or wiring</text>
<text x="320" y="485" font-size="28" fill="#F6EFE6" text-anchor="middle">Turn system off</text>
<text x="320" y="530" font-size="28" fill="#F6EFE6" text-anchor="middle">Call a technician</text>
<rect x="620" y="360" width="520" height="210" rx="16" fill="#2E2A24"/>
<text x="880" y="430" font-size="32" font-weight="bold" fill="#F6EFE6" text-anchor="middle">Rotten eggs</text>
<text x="880" y="485" font-size="28" fill="#F6EFE6" text-anchor="middle">Leave the house now</text>
<text x="880" y="530" font-size="28" fill="#F6EFE6" text-anchor="middle">Call from outside</text>
</g>
</svg>
