<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- sky snowflakes -->
  <g fill="#5C6E58" opacity="0.5">
    <circle cx="90" cy="80" r="5"/>
    <circle cx="150" cy="150" r="4"/>
    <circle cx="1050" cy="90" r="5"/>
    <circle cx="1100" cy="170" r="4"/>
    <circle cx="980" cy="60" r="4"/>
    <circle cx="60" cy="300" r="4"/>
    <circle cx="1130" cy="300" r="5"/>
    <circle cx="200" cy="50" r="3"/>
    <circle cx="1000" cy="250" r="3"/>
    <circle cx="40" cy="200" r="3"/>
  </g>

  <!-- ground snow -->
  <rect x="0" y="560" width="1200" height="70" fill="#E4C7B2"/>
  <ellipse cx="150" cy="565" rx="90" ry="14" fill="#F6EFE6"/>
  <ellipse cx="1020" cy="568" rx="110" ry="16" fill="#F6EFE6"/>

  <!-- house cutaway outer frame -->
  <g>
    <!-- roof -->
    <polygon points="250,250 600,100 950,250" fill="#B85C38"/>
    <polygon points="280,250 600,130 920,250" fill="#E4C7B2"/>

    <!-- chimney -->
    <rect x="800" y="140" width="50" height="80" fill="#5C6E58"/>
    <rect x="795" y="130" width="60" height="18" fill="#2E2A24"/>

    <!-- house walls -->
    <rect x="280" y="250" width="640" height="310" fill="#F6EFE6" stroke="#2E2A24" stroke-width="3"/>

    <!-- interior floor divider -->
    <rect x="280" y="410" width="640" height="6" fill="#2E2A24"/>

    <!-- upstairs room -->
    <rect x="300" y="270" width="280" height="130" fill="#E4C7B2" opacity="0.4"/>
    <!-- window upstairs with heat escaping -->
    <rect x="340" y="290" width="90" height="90" fill="#D9A441" opacity="0.5" stroke="#2E2A24" stroke-width="3"/>
    <line x1="385" y1="290" x2="385" y2="380" stroke="#2E2A24" stroke-width="2"/>
    <line x1="340" y1="335" x2="430" y2="335" stroke="#2E2A24" stroke-width="2"/>

    <!-- heat waves from upstairs window -->
    <g stroke="#B85C38" stroke-width="4" fill="none" opacity="0.6">
      <path d="M440 300 Q460 290 440 275 Q420 260 440 245"/>
      <path d="M460 320 Q480 310 460 295 Q440 280 460 265"/>
    </g>

    <!-- bedroom bed shape -->
    <rect x="470" y="340" width="90" height="40" fill="#B85C38" opacity="0.5"/>
    <rect x="470" y="330" width="90" height="12" fill="#5C6E58" opacity="0.6"/>

    <!-- downstairs living room -->
    <rect x="300" y="420" width="600" height="140" fill="#E4C7B2" opacity="0.3"/>

    <!-- downstairs window -->
    <rect x="700" y="440" width="90" height="90" fill="#D9A441" opacity="0.5" stroke="#2E2A24" stroke-width="3"/>
    <line x1="745" y1="440" x2="745" y2="530" stroke="#2E2A24" stroke-width="2"/>
    <line x1="700" y1="485" x2="790" y2="485" stroke="#2E2A24" stroke-width="2"/>

    <!-- heat waves downstairs window -->
    <g stroke="#B85C38" stroke-width="4" fill="none" opacity="0.5">
      <path d="M800 460 Q820 450 800 435 Q780 420 800 405"/>
    </g>

    <!-- furnace -->
    <g>
      <rect x="350" y="460" width="100" height="100" fill="#5C6E58" rx="6"/>
      <rect x="370" y="480" width="60" height="18" fill="#D9A441" opacity="0.8"/>
      <circle cx="400" cy="520" r="14" fill="#B85C38"/>
      <circle cx="400" cy="520" r="7" fill="#D9A441"/>
      <!-- furnace heat flames -->
      <path d="M395 455 Q400 440 405 455 Q410 445 400 430 Q390 445 395 455" fill="#B85C38"/>
    </g>

    <!-- duct to roof showing heat loss -->
    <rect x="390" y="400" width="20" height="60" fill="#2E2A24" opacity="0.4"/>

    <!-- heat escaping from chimney/roof -->
    <g stroke="#B85C38" stroke-width="5" fill="none" opacity="0.6">
      <path d="M820 130 Q840 100 820 75 Q800 50 820 25"/>
      <path d="M850 130 Q870 105 850 80 Q830 55 850 30"/>
    </g>
    <g stroke="#D9A441" stroke-width="4" fill="none" opacity="0.5">
      <path d="M600 110 Q615 85 600 60 Q585 35 600 10"/>
    </g>

    <!-- door -->
    <rect x="600" y="470" width="70" height="90" fill="#B85C38" opacity="0.7"/>
    <circle cx="660" cy="515" r="4" fill="#D9A441"/>
  </g>

  <!-- utility bill paper -->
  <g transform="translate(940,420) rotate(8)">
    <rect x="0" y="0" width="150" height="190" fill="#F6EFE6" stroke="#2E2A24" stroke-width="3"/>
    <rect x="15" y="20" width="90" height="14" fill="#5C6E58"/>
    <rect x="15" y="50" width="120" height="8" fill="#E4C7B2"/>
    <rect x="15" y="68" width="120" height="8" fill="#E4C7B2"/>
    <rect x="15" y="86" width="90" height="8" fill="#E4C7B2"/>
    <rect x="15" y="115" width="120" height="2" fill="#2E2A24" opacity="0.4"/>
    <rect x="15" y="135" width="60" height="22" fill="#B85C38"/>
    <circle cx="125" cy="146" r="14" fill="#D9A441"/>
    <rect x="15" y="165" width="120" height="8" fill="#E4C7B2"/>
  </g>

  <!-- snowflakes near bill -->
  <g fill="#5C6E58" opacity="0.5">
    <circle cx="900" cy="380" r="4"/>
    <circle cx="1120" cy="460" r="4"/>
    <circle cx="1080" cy="560" r="3"/>
  </g>

  <!-- bushes -->
  <ellipse cx="260" cy="560" rx="45" ry="30" fill="#5C6E58"/>
  <ellipse cx="950" cy="565" rx="50" ry="32" fill="#5C6E58"/>
</svg>