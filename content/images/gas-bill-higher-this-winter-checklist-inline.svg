<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <text x="600" y="62" font-size="38" fill="#2E2A24" text-anchor="middle" font-weight="bold">Why Your Gas Bill Went Up</text>

  <!-- top node -->
  <rect x="460" y="100" width="280" height="80" rx="14" fill="#B85C38"/>
  <text x="600" y="148" font-size="28" fill="#F6EFE6" text-anchor="middle">Higher Gas Bill</text>

  <!-- vertical stem -->
  <line x1="600" y1="180" x2="600" y2="222" stroke="#2E2A24" stroke-width="3"/>
  <!-- horizontal branch line -->
  <line x1="190" y1="222" x2="1010" y2="222" stroke="#2E2A24" stroke-width="3"/>

  <!-- four drop lines -->
  <line x1="190" y1="222" x2="190" y2="270" stroke="#2E2A24" stroke-width="3"/>
  <line x1="460" y1="222" x2="460" y2="270" stroke="#2E2A24" stroke-width="3"/>
  <line x1="740" y1="222" x2="740" y2="270" stroke="#2E2A24" stroke-width="3"/>
  <line x1="1010" y1="222" x2="1010" y2="270" stroke="#2E2A24" stroke-width="3"/>

  <!-- Box 1 -->
  <rect x="60" y="270" width="260" height="150" rx="14" fill="#D9A441"/>
  <circle cx="100" cy="310" r="22" fill="#2E2A24"/>
  <text x="100" y="319" font-size="24" fill="#F6EFE6" text-anchor="middle">1</text>
  <text x="190" y="355" font-size="26" fill="#2E2A24" text-anchor="middle">Colder</text>
  <text x="190" y="388" font-size="26" fill="#2E2A24" text-anchor="middle">Weather</text>

  <!-- Box 2 -->
  <rect x="330" y="270" width="260" height="150" rx="14" fill="#5C6E58"/>
  <circle cx="370" cy="310" r="22" fill="#2E2A24"/>
  <text x="370" y="319" font-size="24" fill="#F6EFE6" text-anchor="middle">2</text>
  <text x="460" y="348" font-size="25" fill="#F6EFE6" text-anchor="middle">Rate or Fee</text>
  <text x="460" y="381" font-size="25" fill="#F6EFE6" text-anchor="middle">Change</text>

  <!-- Box 3 -->
  <rect x="610" y="270" width="260" height="150" rx="14" fill="#E4C7B2"/>
  <circle cx="650" cy="310" r="22" fill="#2E2A24"/>
  <text x="650" y="319" font-size="24" fill="#F6EFE6" text-anchor="middle">3</text>
  <text x="740" y="348" font-size="24" fill="#2E2A24" text-anchor="middle">Heat Escaping</text>
  <text x="740" y="381" font-size="24" fill="#2E2A24" text-anchor="middle">the House</text>

  <!-- Box 4 -->
  <rect x="880" y="270" width="260" height="150" rx="14" fill="#B85C38"/>
  <circle cx="920" cy="310" r="22" fill="#2E2A24"/>
  <text x="920" y="319" font-size="24" fill="#F6EFE6" text-anchor="middle">4</text>
  <text x="1010" y="348" font-size="24" fill="#F6EFE6" text-anchor="middle">Appliance</text>
  <text x="1010" y="381" font-size="24" fill="#F6EFE6" text-anchor="middle">Running Longer</text>

  <!-- base line decoration -->
  <rect x="60" y="470" width="1080" height="4" fill="#2E2A24" opacity="0.15"/>
</svg>