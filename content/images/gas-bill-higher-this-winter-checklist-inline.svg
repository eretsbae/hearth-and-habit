<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">Check in this order</text>

  <rect x="50" y="200" width="230" height="230" rx="18" fill="#E4C7B2"/>
  <circle cx="165" cy="200" r="34" fill="#B85C38"/>
  <text x="165" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F6EFE6">1</text>
  <text x="165" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Billing days</text>
  <text x="165" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">and reading</text>

  <rect x="340" y="200" width="230" height="230" rx="18" fill="#E4C7B2"/>
  <circle cx="455" cy="200" r="34" fill="#D9A441"/>
  <text x="455" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24">2</text>
  <text x="455" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Price</text>
  <text x="455" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">per therm</text>

  <rect x="630" y="200" width="230" height="230" rx="18" fill="#E4C7B2"/>
  <circle cx="745" cy="200" r="34" fill="#5C6E58"/>
  <text x="745" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F6EFE6">3</text>
  <text x="745" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Therms per</text>
  <text x="745" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">degree day</text>

  <rect x="920" y="200" width="230" height="230" rx="18" fill="#5C6E58"/>
  <circle cx="1035" cy="200" r="34" fill="#B85C38"/>
  <text x="1035" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F6EFE6">4</text>
  <text x="1035" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6">House and</text>
  <text x="1035" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6">furnace</text>

  <g fill="#2E2A24">
    <rect x="286" y="311" width="30" height="8"/><polygon points="314,301 334,315 314,329"/>
    <rect x="576" y="311" width="30" height="8"/><polygon points="604,301 624,315 604,329"/>
    <rect x="866" y="311" width="30" height="8"/><polygon points="894,301 914,315 894,329"/>
  </g>

  <text x="600" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Compare with the same month last year</text>
</svg>
