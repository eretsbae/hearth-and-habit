<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- soft spotlight glow -->
  <ellipse cx="600" cy="330" rx="480" ry="340" fill="#F1E4D3" opacity="0.6"/>
  <ellipse cx="600" cy="330" rx="330" ry="240" fill="#EAD9C2" opacity="0.5"/>

  <!-- closet frame -->
  <rect x="180" y="90" width="840" height="480" fill="#E4C7B2" opacity="0.35"/>
  <rect x="180" y="90" width="840" height="40" fill="#5C6E58"/>
  <rect x="180" y="90" width="18" height="480" fill="#2E2A24" opacity="0.6"/>
  <rect x="1002" y="90" width="18" height="480" fill="#2E2A24" opacity="0.6"/>

  <!-- closet interior back panel -->
  <rect x="198" y="130" width="804" height="440" fill="#EFE2D2"/>

  <!-- shelf -->
  <rect x="198" y="230" width="804" height="14" fill="#D9A441" opacity="0.7"/>
  <!-- shelf shadow -->
  <rect x="198" y="244" width="804" height="6" fill="#2E2A24" opacity="0.08"/>

  <!-- hanging rod -->
  <rect x="198" y="150" width="804" height="8" fill="#5C6E58"/>
  <circle cx="198" cy="154" r="8" fill="#5C6E58"/>
  <circle cx="1002" cy="154" r="8" fill="#5C6E58"/>

  <!-- hanging clothes with tags -->
  <g>
    <!-- shirt 1 -->
    <path d="M300 158 L340 158 L352 190 L340 300 L300 300 L288 190 Z" fill="#B85C38"/>
    <circle cx="320" cy="158" r="8" fill="#EFE2D2"/>
    <line x1="320" y1="158" x2="320" y2="150" stroke="#2E2A24" stroke-width="3"/>
    <!-- tag -->
    <rect x="335" y="200" width="18" height="24" rx="2" fill="#F6EFE6" stroke="#2E2A24" stroke-width="1.5"/>
    <circle cx="344" cy="207" r="2" fill="#2E2A24"/>
  </g>

  <g>
    <!-- shirt 2 -->
    <path d="M400 158 L440 158 L450 190 L440 300 L400 300 L390 190 Z" fill="#5C6E58"/>
    <circle cx="420" cy="158" r="8" fill="#EFE2D2"/>
    <line x1="420" y1="158" x2="420" y2="150" stroke="#2E2A24" stroke-width="3"/>
    <rect x="433" y="205" width="18" height="24" rx="2" fill="#F6EFE6" stroke="#2E2A24" stroke-width="1.5"/>
    <circle cx="442" cy="212" r="2" fill="#2E2A24"/>
  </g>

  <g>
    <!-- dress -->
    <path d="M500 158 L540 158 L560 300 L480 300 Z" fill="#D9A441"/>
    <circle cx="520" cy="158" r="8" fill="#EFE2D2"/>
    <line x1="520" y1="158" x2="520" y2="150" stroke="#2E2A24" stroke-width="3"/>
    <rect x="540" y="210" width="18" height="24" rx="2" fill="#F6EFE6" stroke="#2E2A24" stroke-width="1.5"/>
    <circle cx="549" cy="217" r="2" fill="#2E2A24"/>
  </g>

  <g>
    <!-- coat -->
    <path d="M610 158 L660 158 L672 200 L660 300 L610 300 L598 200 Z" fill="#B85C38" opacity="0.85"/>
    <circle cx="635" cy="158" r="8" fill="#EFE2D2"/>
    <line x1="635" y1="158" x2="635" y2="150" stroke="#2E2A24" stroke-width="3"/>
    <rect x="655" y="215" width="18" height="24" rx="2" fill="#F6EFE6" stroke="#2E2A24" stroke-width="1.5"/>
    <circle cx="664" cy="222" r="2" fill="#2E2A24"/>
  </g>

  <!-- unused kitchen gadget on shelf (stand mixer) -->
  <g transform="translate(760,150)">
    <rect x="0" y="50" width="70" height="18" rx="4" fill="#5C6E58"/>
    <path d="M10 50 C10 10 60 10 60 50 L52 50 C52 22 18 22 18 50 Z" fill="#B85C38"/>
    <rect x="45" y="0" width="14" height="26" rx="4" fill="#B85C38"/>
    <circle cx="52" cy="4" r="4" fill="#D9A441"/>
    <ellipse cx="35" cy="70" rx="30" ry="6" fill="#2E2A24" opacity="0.1"/>
  </g>

  <!-- box on shelf -->
  <g transform="translate(870,158)">
    <rect x="0" y="0" width="70" height="46" fill="#E4C7B2"/>
    <rect x="0" y="0" width="70" height="10" fill="#D9A441"/>
    <line x1="0" y1="10" x2="70" y2="10" stroke="#2E2A24" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- folded sweaters stack -->
  <g transform="translate(220,160)">
    <rect x="0" y="0" width="60" height="16" rx="3" fill="#D9A441"/>
    <rect x="2" y="18" width="56" height="16" rx="3" fill="#5C6E58"/>
    <rect x="0" y="36" width="60" height="16" rx="3" fill="#B85C38"/>
  </g>

  <!-- treadmill on closet floor -->
  <g transform="translate(640,340)">
    <!-- base -->
    <rect x="0" y="120" width="260" height="20" rx="6" fill="#2E2A24" opacity="0.85"/>
    <ellipse cx="20" cy="145" rx="14" ry="6" fill="#2E2A24" opacity="0.2"/>
    <ellipse cx="240" cy="145" rx="14" ry="6" fill="#2E2A24" opacity="0.2"/>
    <!-- belt -->
    <rect x="10" y="95" width="240" height="30" rx="10" fill="#5C6E58"/>
    <rect x="20" y="102" width="220" height="4" fill="#EFE2D2" opacity="0.5"/>
    <rect x="20" y="112" width="220" height="4" fill="#EFE2D2" opacity="0.5"/>
    <!-- upright arms -->
    <path d="M20 100 L60 0" stroke="#B85C38" stroke-width="14" stroke-linecap="round"/>
    <path d="M240 100 L200 0" stroke="#B85C38" stroke-width="14" stroke-linecap="round"/>
    <!-- console -->
    <rect x="40" y="-25" width="180" height="35" rx="8" fill="#D9A441"/>
    <rect x="60" y="-16" width="50" height="16" rx="3" fill="#F6EFE6" opacity="0.8"/>
    <circle cx="150" cy="-8" r="6" fill="#F6EFE6" opacity="0.8"/>
    <circle cx="170" cy="-8" r="6" fill="#F6EFE6" opacity="0.8"/>
  </g>

  <!-- floor shadow under closet items -->
  <ellipse cx="770" cy="510" rx="220" ry="18" fill="#2E2A24" opacity="0.12"/>

  <!-- shoes on floor -->
  <g transform="translate(300,485)">
    <path d="M0 20 Q10 0 40 5 L70 15 Q75 25 60 26 L5 26 Z" fill="#5C6E58"/>
  </g>
  <g transform="translate(360,485)">
    <path d="M0 20 Q10 0 40 5 L70 15 Q75 25 60 26 L5 26 Z" fill="#5C6E58"/>
  </g>

  <!-- basket with clutter -->
  <g transform="translate(430,470)">
    <path d="M0 20 L80 20 L70 55 L10 55 Z" fill="#E4C7B2"/>
    <rect x="-4" y="10" width="88" height="12" rx="4" fill="#B85C38"/>
    <circle cx="20" cy="8" r="10" fill="#D9A441"/>
    <rect x="45" y="-6" width="18" height="20" rx="3" fill="#5C6E58"/>
  </g>

  <!-- subtle vignette corners -->
  <rect x="0" y="0" width="1200" height="630" fill="none"/>
</svg>