<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- decorative background circles -->
  <circle cx="120" cy="90" r="70" fill="#E4C7B2" opacity="0.4"/>
  <circle cx="1100" cy="540" r="90" fill="#5C6E58" opacity="0.15"/>
  <circle cx="1050" cy="80" r="40" fill="#D9A441" opacity="0.25"/>

  <!-- central path line -->
  <line x1="250" y1="330" x2="950" y2="330" stroke="#2E2A24" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Arrow 1 -->
  <g transform="translate(455,330)">
    <path d="M0,-10 L25,0 L0,10 Z" fill="#B85C38"/>
  </g>
  <!-- Arrow 2 -->
  <g transform="translate(745,330)">
    <path d="M0,-10 L25,0 L0,10 Z" fill="#B85C38"/>
  </g>

  <!-- ICON 1: Price Tag -->
  <g transform="translate(300,330)">
    <circle cx="0" cy="0" r="95" fill="#F6EFE6" stroke="#5C6E58" stroke-width="2"/>
    <g transform="translate(-35,-30) rotate(-20)">
      <path d="M0,20 L45,0 L70,25 L25,70 Z" fill="#B85C38"/>
      <circle cx="10" cy="20" r="7" fill="#F6EFE6"/>
      <rect x="55" y="15" width="18" height="6" fill="#D9A441" transform="rotate(45 55 15)"/>
    </g>
  </g>

  <!-- ICON 2: Donation Box -->
  <g transform="translate(600,330)">
    <circle cx="0" cy="0" r="95" fill="#F6EFE6" stroke="#5C6E58" stroke-width="2"/>
    <g transform="translate(-45,-35)">
      <rect x="0" y="35" width="90" height="55" rx="4" fill="#5C6E58"/>
      <rect x="0" y="35" width="90" height="14" fill="#D9A441"/>
      <path d="M35,0 L55,0 L55,35 L35,35 Z" fill="#D9A441"/>
      <path d="M20,0 L70,0 L70,10 L20,10 Z" fill="#D9A441"/>
      <path d="M45,-10 a12,12 0 1,1 -0.1,0 Z" fill="none" stroke="#D9A441" stroke-width="6"/>
    </g>
  </g>

  <!-- ICON 3: Resale App on Phone -->
  <g transform="translate(900,330)">
    <circle cx="0" cy="0" r="95" fill="#F6EFE6" stroke="#5C6E58" stroke-width="2"/>
    <g transform="translate(-30,-55)">
      <rect x="0" y="0" width="60" height="110" rx="10" fill="#2E2A24"/>
      <rect x="5" y="8" width="50" height="88" rx="3" fill="#E4C7B2"/>
      <circle cx="30" cy="102" r="4" fill="#F6EFE6"/>
      <circle cx="30" cy="35" r="14" fill="#B85C38"/>
      <path d="M23,35 l5,5 l10,-12" stroke="#F6EFE6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="12" y="58" width="36" height="6" rx="3" fill="#D9A441"/>
      <rect x="12" y="70" width="24" height="6" rx="3" fill="#5C6E58"/>
    </g>
  </g>

  <!-- small ground accents -->
  <rect x="250" y="470" width="700" height="4" fill="#E4C7B2" opacity="0.5"/>
  <circle cx="200" cy="560" r="14" fill="#D9A441" opacity="0.5"/>
  <circle cx="1000" cy="570" r="10" fill="#B85C38" opacity="0.4"/>
</svg>