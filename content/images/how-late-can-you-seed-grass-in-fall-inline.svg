<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Decorative background circle -->
  <circle cx="1050" cy="90" r="140" fill="#E4C7B2" opacity="0.35"/>
  <circle cx="90" cy="560" r="110" fill="#5C6E58" opacity="0.12"/>

  <!-- Calendar card -->
  <g>
    <rect x="260" y="90" width="680" height="460" rx="18" fill="#FFFFFF" opacity="0.55"/>
    <rect x="260" y="90" width="680" height="460" rx="18" fill="none" stroke="#2E2A24" stroke-width="2"/>

    <!-- Calendar header -->
    <rect x="260" y="90" width="680" height="80" rx="18" fill="#B85C38"/>
    <rect x="260" y="140" width="680" height="30" fill="#B85C38"/>
    <!-- Binder rings -->
    <rect x="330" y="65" width="22" height="60" rx="10" fill="#2E2A24"/>
    <rect x="848" y="65" width="22" height="60" rx="10" fill="#2E2A24"/>

    <!-- Weekday row -->
    <g fill="#D9A441">
      <rect x="290" y="190" width="60" height="14" rx="6"/>
      <rect x="390" y="190" width="60" height="14" rx="6"/>
      <rect x="490" y="190" width="60" height="14" rx="6"/>
      <rect x="590" y="190" width="60" height="14" rx="6"/>
      <rect x="690" y="190" width="60" height="14" rx="6"/>
      <rect x="790" y="190" width="60" height="14" rx="6"/>
      <rect x="880" y="190" width="30" height="14" rx="6"/>
    </g>

    <!-- Grid of date cells -->
    <g>
      <!-- Row 1 -->
      <rect x="285" y="230" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="385" y="230" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="485" y="230" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="585" y="230" width="90" height="70" rx="8" fill="#E4C7B2" stroke="#B85C38" stroke-width="3"/>
      <rect x="685" y="230" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="785" y="230" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>

      <!-- Row 2 -->
      <rect x="285" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="385" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="485" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="585" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="685" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="785" y="310" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>

      <!-- Row 3 - safe zone -->
      <rect x="285" y="390" width="90" height="70" rx="8" fill="#DDE6D6" stroke="#5C6E58" stroke-width="2"/>
      <rect x="385" y="390" width="90" height="70" rx="8" fill="#DDE6D6" stroke="#5C6E58" stroke-width="2"/>
      <rect x="485" y="390" width="90" height="70" rx="8" fill="#DDE6D6" stroke="#5C6E58" stroke-width="2"/>
      <rect x="585" y="390" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="685" y="390" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="785" y="390" width="90" height="70" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>

      <!-- Row 4 -->
      <rect x="285" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="385" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="485" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="585" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="685" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
      <rect x="785" y="470" width="90" height="60" rx="8" fill="#F6EFE6" stroke="#E4C7B2" stroke-width="2"/>
    </g>

    <!-- Frost/snowflake icon marking cutoff at row1, col with terracotta highlight -->
    <g transform="translate(630,265)" stroke="#5C6E58" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-19" y1="-11" x2="19" y2="11"/>
      <line x1="-19" y1="11" x2="19" y2="-11"/>
      <line x1="-8" y1="-18" x2="-14" y2="-24"/>
      <line x1="8" y1="-18" x2="14" y2="-24"/>
      <line x1="-8" y1="18" x2="-14" y2="24"/>
      <line x1="8" y1="18" x2="14" y2="24"/>
    </g>

    <!-- Grass sprout icons marking the safe zone -->
    <g stroke="#5C6E58" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M330 445 C330 425, 315 415, 315 400"/>
      <path d="M330 445 C330 425, 345 415, 345 400"/>
      <path d="M330 445 C330 430, 330 415, 330 405"/>

      <path d="M430 445 C430 425, 415 415, 415 400"/>
      <path d="M430 445 C430 425, 445 415, 445 400"/>
      <path d="M430 445 C430 430, 430 415, 430 405"/>

      <path d="M530 445 C530 425, 515 415, 515 400"/>
      <path d="M530 445 C530 425, 545 415, 545 400"/>
      <path d="M530 445 C530 430, 530 415, 530 405"/>
    </g>
    <ellipse cx="330" cy="450" rx="10" ry="5" fill="#D9A441" opacity="0.5"/>
    <ellipse cx="430" cy="450" rx="10" ry="5" fill="#D9A441" opacity="0.5"/>
    <ellipse cx="530" cy="450" rx="10" ry="5" fill="#D9A441" opacity="0.5"/>
  </g>

  <!-- Small decorative leaves floating -->
  <g fill="#D9A441">
    <ellipse cx="150" cy="140" rx="20" ry="12" transform="rotate(25 150 140)"/>
    <ellipse cx="1090" cy="480" rx="20" ry="12" transform="rotate(-15 1090 480)"/>
  </g>
  <g fill="#B85C38">
    <ellipse cx="190" cy="200" rx="16" ry="10" transform="rotate(-30 190 200)"/>
    <ellipse cx="1040" cy="540" rx="16" ry="10" transform="rotate(40 1040 540)"/>
  </g>
</svg>