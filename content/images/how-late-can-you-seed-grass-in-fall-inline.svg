<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Check the soil, not the calendar</text>
<rect x="120" y="120" width="60" height="400" rx="30" fill="#E4C7B2"/>
<rect x="132" y="300" width="36" height="210" rx="18" fill="#B85C38"/>
<circle cx="150" cy="545" r="45" fill="#B85C38"/>
<line x1="180" y1="160" x2="250" y2="160" stroke="#2E2A24" stroke-width="3"/>
<line x1="180" y1="265" x2="250" y2="265" stroke="#2E2A24" stroke-width="3"/>
<line x1="180" y1="370" x2="250" y2="370" stroke="#2E2A24" stroke-width="3"/>
<line x1="180" y1="475" x2="250" y2="475" stroke="#2E2A24" stroke-width="3"/>
<rect x="270" y="130" width="860" height="60" rx="10" fill="#D9A441"/>
<rect x="270" y="235" width="860" height="60" rx="10" fill="#5C6E58"/>
<rect x="270" y="340" width="860" height="60" rx="10" fill="#E4C7B2"/>
<rect x="270" y="445" width="860" height="60" rx="10" fill="#B85C38"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="30">
<text x="295" y="171" fill="#2E2A24">65–70°F: warm-season grass, late spring</text>
<text x="295" y="276" fill="#F6EFE6">Above 50°F: seed fescue or bluegrass</text>
<text x="295" y="381" fill="#2E2A24">Below 50°F: don't seed, wait</text>
<text x="295" y="486" fill="#F6EFE6">40°F or below: dormant seed</text>
</g>
</svg>
