<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">When the party food clock runs out</text>
  <!-- timeline axis -->
  <line x1="120" y1="330" x2="1080" y2="330" stroke="#2E2A24" stroke-width="6" stroke-linecap="round"/>
  <!-- segments: 5:30 at x=160, 6:30 at x=460, 7:00 at x=610, 7:30 at x=760 (150px per 30 min) -->
  <rect x="160" y="300" width="300" height="60" fill="#B85C38" opacity="0.85"/>
  <rect x="460" y="300" width="150" height="60" fill="#D9A441" opacity="0.85"/>
  <rect x="610" y="300" width="150" height="60" fill="#5C6E58" opacity="0.85"/>
  <!-- markers -->
  <circle cx="160" cy="330" r="18" fill="#2E2A24"/>
  <circle cx="460" cy="330" r="16" fill="#B85C38" stroke="#2E2A24" stroke-width="4"/>
  <circle cx="610" cy="330" r="16" fill="#D9A441" stroke="#2E2A24" stroke-width="4"/>
  <circle cx="760" cy="330" r="16" fill="#5C6E58" stroke="#2E2A24" stroke-width="4"/>
  <!-- labels above -->
  <line x1="160" y1="300" x2="160" y2="220" stroke="#2E2A24" stroke-width="3"/>
  <text x="70" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Food set out 5:30</text>
  <line x1="610" y1="300" x2="610" y2="220" stroke="#2E2A24" stroke-width="3"/>
  <text x="610" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Guest dish, 30-min drive: 7:00</text>
  <!-- labels below -->
  <line x1="460" y1="360" x2="460" y2="440" stroke="#2E2A24" stroke-width="3"/>
  <text x="440" y="476" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Above 90°F: 6:30</text>
  <line x1="760" y1="360" x2="760" y2="440" stroke="#2E2A24" stroke-width="3"/>
  <text x="800" y="476" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Room temperature: 7:30</text>
  <!-- held hot/cold note -->
  <rect x="200" y="530" width="800" height="56" rx="12" fill="#E4C7B2"/>
  <text x="600" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Held 140°F+ or 40°F or below: check temp</text>
</svg>
