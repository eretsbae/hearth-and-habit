    <ellipse cx="4" cy="-20" rx="10" ry="18" fill="#5C6E58" transform="rotate(30 4 -20)"/>
    <ellipse cx="-6" cy="-45" rx="9" ry="16" fill="#5C6E58" transform="rotate(-25 -6 -45)"/>
    <ellipse cx="4" cy="-68" rx="8" ry="14" fill="#5C6E58" transform="rotate(20 4 -68)"/>
