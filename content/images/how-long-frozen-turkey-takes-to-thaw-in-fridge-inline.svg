<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <text x="600" y="60" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2E2A24" text-anchor="middle" font-weight="bold">Fridge-Thawing Time by Turkey Weight</text>

  <!-- Chart baseline -->
  <line x1="180" y1="520" x2="1050" y2="520" stroke="#2E2A24" stroke-width="2"/>

  <!-- Bar 1: 8-12 lbs = 1-3 days -->
  <rect x="230" y="440" width="140" height="80" fill="#D9A441"/>
  <text x="300" y="400" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">1–3 days</text>
  <text x="300" y="560" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24" text-anchor="middle">8–12 lbs</text>

  <!-- Bar 2: 12-16 lbs = 3-4 days -->
  <rect x="420" y="400" width="140" height="120" fill="#B85C38"/>
  <text x="490" y="360" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">3–4 days</text>
  <text x="490" y="560" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24" text-anchor="middle">12–16 lbs</text>

  <!-- Bar 3: 16-20 lbs = 4-5 days -->
  <rect x="610" y="350" width="140" height="170" fill="#5C6E58"/>
  <text x="680" y="310" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">4–5 days</text>
  <text x="680" y="560" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24" text-anchor="middle">16–20 lbs</text>

  <!-- Bar 4: 20-24 lbs = 5-6 days -->
  <rect x="800" y="300" width="140" height="220" fill="#E4C7B2" stroke="#B85C38" stroke-width="2"/>
  <text x="870" y="260" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">5–6 days</text>
  <text x="870" y="560" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24" text-anchor="middle">20–24 lbs</text>

  <!-- Note box -->
  <rect x="150" y="585" width="900" height="2" fill="none"/>
  <rect x="120" y="585" width="960" height="0" fill="none"/>

  <rect x="150" y="578" width="900" height="2" fill="#2E2A24" opacity="0"/>

  <!-- note callout -->
  <rect x="150" y="575" width="900" height="2" fill="none"/>

  <rect x="150" y="560" width="900" height="0" fill="none"/>

  <!-- actual note text with background -->
  <rect x="140" y="565" width="920" height="2" fill="none"/>

</svg>