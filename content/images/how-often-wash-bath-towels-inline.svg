<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Divider -->
  <rect x="596" y="90" width="4" height="450" fill="#E4C7B2"/>

  <!-- LEFT SCENE: towel spread on bar -->
  <!-- wall accent -->
  <rect x="90" y="70" width="440" height="480" fill="#EFE3D3" opacity="0.5"/>

  <!-- bar bracket left -->
  <rect x="140" y="185" width="18" height="60" rx="4" fill="#2E2A24"/>
  <rect x="452" y="185" width="18" height="60" rx="4" fill="#2E2A24"/>
  <!-- bar rod -->
  <rect x="130" y="190" width="350" height="14" rx="7" fill="#5C6E58"/>

  <!-- spread towel -->
  <path d="M150 204 
           Q150 200 154 200 
           L446 200 
           Q450 200 450 204 
           L450 440 
           Q450 460 430 462 
           L170 462 
           Q150 460 150 440 
           Z" fill="#B85C38"/>
  <!-- towel fold shading -->
  <rect x="150" y="204" width="300" height="14" fill="#a04f30"/>
  <!-- towel texture stripes -->
  <rect x="185" y="230" width="230" height="10" rx="4" fill="#D9A441" opacity="0.6"/>
  <rect x="185" y="410" width="230" height="10" rx="4" fill="#D9A441" opacity="0.6"/>

  <!-- gentle wave lines suggesting flat drying / airflow -->
  <path d="M170 480 Q200 490 230 480 Q260 470 290 480 Q320 490 350 480 Q380 470 410 480" 
        stroke="#5C6E58" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M180 500 Q210 510 240 500 Q270 490 300 500 Q330 510 360 500" 
        stroke="#5C6E58" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- small sun/fresh icon top left -->
  <circle cx="200" cy="130" r="26" fill="#D9A441" opacity="0.85"/>
  <g stroke="#D9A441" stroke-width="4" opacity="0.7">
    <line x1="200" y1="90" x2="200" y2="78"/>
    <line x1="200" y1="182" x2="200" y2="170"/>
    <line x1="160" y1="130" x2="148" y2="130"/>
    <line x1="252" y1="130" x2="240" y2="130"/>
    <line x1="172" y1="102" x2="164" y2="94"/>
    <line x1="228" y1="158" x2="236" y2="166"/>
    <line x1="228" y1="102" x2="236" y2="94"/>
    <line x1="172" y1="158" x2="164" y2="166"/>
  </g>

  <!-- RIGHT SCENE: bunched towel on hook -->
  <rect x="670" y="70" width="440" height="480" fill="#EFE3D3" opacity="0.5"/>

  <!-- hook plate -->
  <rect x="860" y="140" width="80" height="20" rx="6" fill="#2E2A24"/>
  <!-- hook peg -->
  <path d="M900 160 
           Q900 200 870 210 
           Q850 216 855 195" 
        stroke="#2E2A24" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- bunched towel body -->
  <path d="M790 205 
           Q770 230 780 270 
           Q760 310 790 350 
           Q765 390 800 430 
           Q780 470 820 495 
           Q860 515 900 495 
           Q935 475 915 440 
           Q940 400 910 365 
           Q935 325 900 290 
           Q925 250 895 215 
           Q905 195 875 195 
           Q850 190 830 200
           Q810 190 790 205 Z" 
        fill="#B85C38"/>

  <!-- crumple shading folds -->
  <path d="M800 230 Q815 250 800 275" stroke="#8f4a2c" stroke-width="6" fill="none" opacity="0.5"/>
  <path d="M790 300 Q810 320 795 345" stroke="#8f4a2c" stroke-width="6" fill="none" opacity="0.5"/>
  <path d="M805 370 Q825 390 810 415" stroke="#8f4a2c" stroke-width="6" fill="none" opacity="0.5"/>
  <path d="M880 250 Q895 270 878 290" stroke="#8f4a2c" stroke-width="5" fill="none" opacity="0.4"/>
  <path d="M885 335 Q905 355 888 380" stroke="#8f4a2c" stroke-width="5" fill="none" opacity="0.4"/>

  <!-- drip drops indicating dampness trapped -->
  <ellipse cx="800" cy="510" rx="6" ry="10" fill="#5C6E58" opacity="0.6"/>
  <ellipse cx="830" cy="520" rx="5" ry="8" fill="#5C6E58" opacity="0.5"/>
  <ellipse cx="870" cy="512" rx="6" ry="9" fill="#5C6E58" opacity="0.6"/>

  <!-- small worried squiggle / smell lines top right of bunch -->
  <g stroke="#5C6E58" stroke-width="4" fill="none" opacity="0.6">
    <path d="M900 190 Q908 178 900 168 Q892 158 900 148"/>
    <path d="M925 195 Q933 183 925 173 Q917 163 925 153"/>
  </g>

  <!-- base shadows under both scenes -->
  <ellipse cx="300" cy="560" rx="160" ry="16" fill="#2E2A24" opacity="0.08"/>
  <ellipse cx="860" cy="560" rx="160" ry="16" fill="#2E2A24" opacity="0.08"/>
</svg>