<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="84" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Where a bigleaf hydrangea loses its buds</text>
<rect x="160" y="318" width="180" height="24" rx="12" fill="#5C6E58"/>
<rect x="340" y="318" width="700" height="24" rx="12" fill="#B85C38"/>
<g fill="#F6EFE6" stroke="#2E2A24" stroke-width="4">
<circle cx="160" cy="330" r="18"/>
<circle cx="340" cy="330" r="18"/>
<circle cx="520" cy="330" r="18"/>
<circle cx="700" cy="330" r="18"/>
<circle cx="880" cy="330" r="18"/>
<circle cx="1040" cy="330" r="18"/>
</g>
<g stroke="#2E2A24" stroke-width="2">
<line x1="160" y1="270" x2="160" y2="310"/>
<line x1="520" y1="270" x2="520" y2="310"/>
<line x1="880" y1="270" x2="880" y2="310"/>
<line x1="340" y1="350" x2="340" y2="390"/>
<line x1="700" y1="350" x2="700" y2="390"/>
<line x1="1040" y1="350" x2="1040" y2="390"/>
</g>
<g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">
<text x="160" y="220">Flowers fade:</text>
<text x="160" y="254">prune now</text>
<text x="520" y="220">Late summer:</text>
<text x="520" y="254">buds form</text>
<text x="880" y="220">Winter</text>
<text x="880" y="254">cold</text>
<text x="340" y="424">Aug 1:</text>
<text x="340" y="458">stop pruning</text>
<text x="700" y="424">Early-fall</text>
<text x="700" y="458">freeze</text>
<text x="1040" y="424">Spring frost</text>
<text x="1040" y="458">after leaf-out</text>
</g>
<path d="M340 512 L340 530 L1040 530 L1040 512" fill="none" stroke="#B85C38" stroke-width="3"/>
<text x="690" y="572" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#B85C38" text-anchor="middle">Buds exposed until they open</text>
</svg>
