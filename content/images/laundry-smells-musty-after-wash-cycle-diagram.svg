<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">When does the laundry smell?</text>
<rect x="60" y="130" width="500" height="90" rx="45" fill="#5C6E58"/>
<text x="310" y="186" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">Right out of the washer</text>
<line x1="310" y1="222" x2="310" y2="300" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="60" y="312" width="500" height="100" rx="12" fill="#E4C7B2"/>
<text x="310" y="372" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">The washer is the source</text>
<rect x="60" y="450" width="500" height="110" rx="12" fill="#F6EFE6" stroke="#5C6E58" stroke-width="4"/>
<text x="310" y="515" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Seal, drawer, drain filter</text>
<rect x="640" y="130" width="500" height="90" rx="45" fill="#B85C38"/>
<text x="890" y="186" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">Sour after drying or use</text>
<line x1="890" y1="222" x2="890" y2="300" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="640" y="312" width="500" height="100" rx="12" fill="#D9A441"/>
<text x="890" y="372" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">Bacteria in the fabric</text>
<rect x="640" y="450" width="500" height="110" rx="12" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<text x="890" y="515" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Wash warmer, dry fast</text>
</svg>
