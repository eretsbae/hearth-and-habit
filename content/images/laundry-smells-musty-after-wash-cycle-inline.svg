<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- background soft shapes -->
  <circle cx="150" cy="120" r="90" fill="#E4C7B2" opacity="0.4"/>
  <circle cx="1100" cy="540" r="130" fill="#5C6E58" opacity="0.12"/>
  <circle cx="1050" cy="90" r="60" fill="#D9A441" opacity="0.2"/>

  <!-- washing machine door circle (outer drum) -->
  <circle cx="430" cy="320" r="260" fill="#E4C7B2" opacity="0.5"/>
  <circle cx="430" cy="320" r="230" fill="#F6EFE6"/>
  <circle cx="430" cy="320" r="230" fill="none" stroke="#2E2A24" stroke-width="6"/>

  <!-- rubber gasket ring, cutaway style -->
  <circle cx="430" cy="320" r="195" fill="none" stroke="#2E2A24" stroke-width="4"/>
  <path d="M430 130 a190 190 0 0 1 0 380 a190 190 0 0 1 0 -380" fill="#5C6E58"/>
  <circle cx="430" cy="320" r="150" fill="#F6EFE6"/>
  <circle cx="430" cy="320" r="150" fill="none" stroke="#2E2A24" stroke-width="4"/>

  <!-- gasket fold shading -->
  <path d="M430 170 a150 150 0 0 1 106 44 l-20 18 a125 125 0 0 0 -86 -36 z" fill="#4A5A46"/>
  <path d="M430 470 a150 150 0 0 1 -106 -44 l20 -18 a125 125 0 0 0 86 36 z" fill="#4A5A46"/>

  <!-- inner drum dark hole -->
  <circle cx="430" cy="320" r="100" fill="#2E2A24"/>
  <circle cx="430" cy="320" r="100" fill="#2E2A24" opacity="0.9"/>
  <ellipse cx="400" cy="290" rx="40" ry="25" fill="#3a352c" opacity="0.6"/>

  <!-- lint clumps trapped in gasket fold -->
  <ellipse cx="330" cy="230" rx="22" ry="14" fill="#D9A441" opacity="0.85" transform="rotate(-20 330 230)"/>
  <ellipse cx="345" cy="245" rx="16" ry="10" fill="#E4C7B2" transform="rotate(10 345 245)"/>
  <ellipse cx="540" cy="220" rx="18" ry="11" fill="#B85C38" opacity="0.7" transform="rotate(25 540 220)"/>
  <ellipse cx="300" cy="410" rx="20" ry="12" fill="#D9A441" opacity="0.8" transform="rotate(15 300 410)"/>
  <ellipse cx="560" cy="420" rx="16" ry="10" fill="#E4C7B2" transform="rotate(-15 560 420)"/>
  <ellipse cx="330" cy="235" rx="8" ry="5" fill="#B85C38" opacity="0.5"/>

  <!-- water droplets -->
  <path d="M250 300 q10 -18 20 0 q0 12 -10 12 q-10 0 -10 -12 z" fill="#5C6E58" opacity="0.6"/>
  <path d="M610 300 q10 -18 20 0 q0 12 -10 12 q-10 0 -10 -12 z" fill="#5C6E58" opacity="0.6"/>
  <path d="M280 190 q8 -14 16 0 q0 10 -8 10 q-8 0 -8 -10 z" fill="#5C6E58" opacity="0.5"/>
  <path d="M580 460 q8 -14 16 0 q0 10 -8 10 q-8 0 -8 -10 z" fill="#5C6E58" opacity="0.5"/>
  <circle cx="410" cy="470" r="6" fill="#5C6E58" opacity="0.5"/>
  <circle cx="450" cy="180" r="6" fill="#5C6E58" opacity="0.5"/>

  <!-- oxygen cleaner bottle -->
  <g transform="translate(830,190)">
    <!-- bottle shadow -->
    <ellipse cx="90" cy="410" rx="120" ry="24" fill="#2E2A24" opacity="0.08"/>

    <!-- bottle body -->
    <rect x="20" y="90" width="140" height="300" rx="18" fill="#B85C38"/>
    <rect x="20" y="90" width="140" height="300" rx="18" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- label -->
    <rect x="38" y="180" width="104" height="130" rx="8" fill="#F6EFE6"/>
    <rect x="38" y="180" width="104" height="130" rx="8" fill="none" stroke="#2E2A24" stroke-width="3"/>

    <!-- label design: simple circle burst representing oxy-clean -->
    <circle cx="90" cy="225" r="22" fill="#D9A441"/>
    <circle cx="90" cy="225" r="22" fill="none" stroke="#2E2A24" stroke-width="3"/>
    <path d="M90 205 v-14 M90 245 v14 M70 225 h-14 M110 225 h14 M76 211 l-10 -10 M104 211 l10 -10 M76 239 l-10 10 M104 239 l10 10" stroke="#5C6E58" stroke-width="4" stroke-linecap="round"/>

    <!-- label lines suggesting text block (non-text) -->
    <rect x="55" y="265" width="70" height="6" rx="3" fill="#E4C7B2"/>
    <rect x="55" y="280" width="50" height="6" rx="3" fill="#E4C7B2"/>

    <!-- bottle neck -->
    <rect x="60" y="50" width="60" height="45" rx="8" fill="#B85C38"/>
    <rect x="60" y="50" width="60" height="45" rx="8" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- cap -->
    <rect x="52" y="10" width="76" height="45" rx="10" fill="#5C6E58"/>
    <rect x="52" y="10" width="76" height="45" rx="10" fill="none" stroke="#2E2A24" stroke-width="4"/>
    <rect x="52" y="28" width="76" height="6" fill="#2E2A24" opacity="0.3"/>

    <!-- bottle highlight -->
    <rect x="34" y="110" width="14" height="260" rx="6" fill="#F6EFE6" opacity="0.25"/>
  </g>

  <!-- small bubbles rising from bottle cap suggesting fizz/oxy action -->
  <circle cx="905" cy="150" r="8" fill="#D9A441" opacity="0.7"/>
  <circle cx="930" cy="120" r="5" fill="#D9A441" opacity="0.6"/>
  <circle cx="880" cy="115" r="4" fill="#D9A441" opacity="0.5"/>

  <!-- decorative ground line -->
  <rect x="0" y="560" width="1200" height="70" fill="#5C6E58" opacity="0.08"/>
</svg>