<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2E2A24"/></marker></defs>
<text x="600" y="70" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Four checks for a flickering LED</text>
<g stroke="#2E2A24" stroke-width="3" fill="none" marker-end="url(#a)">
<path d="M350 180 L350 222"/>
<path d="M350 300 L350 342"/>
<path d="M350 420 L350 462"/>
<path d="M640 145 L756 145"/>
<path d="M640 265 L756 265"/>
<path d="M640 385 L756 385"/>
</g>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<rect x="60" y="110" width="580" height="70" rx="10" fill="#E4C7B2"/>
<text x="90" y="155">1  Bulb says dimmable?</text>
<rect x="60" y="230" width="580" height="70" rx="10" fill="#E4C7B2"/>
<text x="90" y="275">2  Dimmer LED-rated, SSL 7A?</text>
<rect x="60" y="350" width="580" height="70" rx="10" fill="#E4C7B2"/>
<text x="90" y="395">3  Bulb on its compatibility list?</text>
<rect x="60" y="470" width="580" height="70" rx="10" fill="#5C6E58"/>
<text x="90" y="515" fill="#F6EFE6">4  Raise the low-end trim</text>
<rect x="760" y="110" width="380" height="70" rx="10" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<text x="950" y="155" text-anchor="middle">No: swap the bulb</text>
<rect x="760" y="230" width="380" height="70" rx="10" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<text x="950" y="275" text-anchor="middle">No: replace dimmer</text>
<rect x="760" y="350" width="380" height="70" rx="10" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<text x="950" y="395" text-anchor="middle">No: use a listed bulb</text>
</g>
</svg>
