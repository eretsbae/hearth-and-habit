<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="84" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">The cooling clock for cooked rice</text>
<rect x="160" y="300" width="300" height="28" rx="14" fill="#B85C38"/>
<rect x="460" y="300" width="580" height="28" rx="14" fill="#D9A441"/>
<g fill="#F6EFE6" stroke="#2E2A24" stroke-width="4">
<circle cx="160" cy="314" r="20"/>
<circle cx="310" cy="314" r="20"/>
<circle cx="460" cy="314" r="20"/>
<circle cx="1040" cy="314" r="20"/>
</g>
<circle cx="1040" cy="314" r="12" fill="#5C6E58"/>
<g stroke="#2E2A24" stroke-width="2">
<line x1="160" y1="250" x2="160" y2="292"/>
<line x1="460" y1="250" x2="460" y2="292"/>
<line x1="310" y1="336" x2="310" y2="380"/>
<line x1="1040" y1="336" x2="1040" y2="380"/>
</g>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">
<text x="170" y="198" font-weight="bold">6:30 p.m.</text>
<text x="170" y="234">Off the heat</text>
<text x="460" y="198" font-weight="bold">8:30 p.m.</text>
<text x="460" y="234">Below 70°F</text>
<text x="310" y="420" font-weight="bold">7:30 p.m.</text>
<text x="310" y="456">In the fridge</text>
<text x="1020" y="420" font-weight="bold">12:30 a.m.</text>
<text x="1020" y="456">Below 41°F</text>
</g>
<text x="600" y="560" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#B85C38" text-anchor="middle" font-weight="bold">Missed 70°F at 2 hours? Throw it out.</text>
</svg>
