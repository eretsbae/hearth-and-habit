<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Wall cutaway background -->
  <rect x="120" y="80" width="960" height="470" fill="#E4C7B2" opacity="0.35"/>
  <rect x="120" y="80" width="960" height="470" fill="none" stroke="#2E2A24" stroke-width="3"/>

  <!-- cutaway hatch edges -->
  <g stroke="#2E2A24" stroke-width="2" opacity="0.4">
    <line x1="120" y1="80" x2="150" y2="60"/>
    <line x1="220" y1="80" x2="250" y2="60"/>
    <line x1="320" y1="80" x2="350" y2="60"/>
    <line x1="420" y1="80" x2="450" y2="60"/>
    <line x1="520" y1="80" x2="550" y2="60"/>
    <line x1="620" y1="80" x2="650" y2="60"/>
    <line x1="720" y1="80" x2="750" y2="60"/>
    <line x1="820" y1="80" x2="850" y2="60"/>
    <line x1="920" y1="80" x2="950" y2="60"/>
    <line x1="1020" y1="80" x2="1050" y2="60"/>
  </g>

  <!-- interior wall cavity -->
  <rect x="170" y="120" width="860" height="390" fill="#F6EFE6"/>
  <rect x="170" y="120" width="860" height="390" fill="none" stroke="#2E2A24" stroke-width="2" opacity="0.5"/>

  <!-- vertical stud framing -->
  <rect x="230" y="120" width="24" height="390" fill="#D9A441" opacity="0.25"/>
  <rect x="946" y="120" width="24" height="390" fill="#D9A441" opacity="0.25"/>

  <!-- Copper pipe vertical run -->
  <rect x="560" y="120" width="34" height="260" fill="#B85C38"/>
  <rect x="560" y="120" width="10" height="260" fill="#E4C7B2" opacity="0.6"/>

  <!-- pipe elbow -->
  <path d="M560 380 Q560 415 595 415 L680 415" fill="none" stroke="#B85C38" stroke-width="34" stroke-linecap="round"/>
  <path d="M560 380 Q560 415 595 415 L680 415" fill="none" stroke="#E4C7B2" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- horizontal pipe to faucet -->
  <rect x="680" y="398" width="140" height="34" fill="#B85C38"/>
  <rect x="680" y="398" width="140" height="10" fill="#E4C7B2" opacity="0.6"/>

  <!-- pipe joint/valve body -->
  <rect x="808" y="380" width="46" height="70" rx="8" fill="#5C6E58"/>
  <circle cx="831" cy="415" r="6" fill="#D9A441"/>

  <!-- faucet stem -->
  <rect x="822" y="330" width="18" height="50" fill="#2E2A24"/>

  <!-- faucet handle (shut-off, cross style) -->
  <g transform="translate(831,300)">
    <circle r="34" fill="#D9A441"/>
    <circle r="34" fill="none" stroke="#2E2A24" stroke-width="2"/>
    <rect x="-6" y="-30" width="12" height="60" fill="#B85C38"/>
    <rect x="-30" y="-6" width="60" height="12" fill="#B85C38"/>
    <circle r="8" fill="#F6EFE6"/>
  </g>

  <!-- shockwave / vibration rings around joint -->
  <g stroke="#5C6E58" fill="none" stroke-width="3" opacity="0.7">
    <circle cx="831" cy="415" r="55"/>
    <circle cx="831" cy="415" r="80"/>
    <circle cx="831" cy="415" r="105"/>
  </g>

  <!-- jagged vibration lines emanating -->
  <g stroke="#B85C38" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M900 340 L925 315 L915 300 L935 280"/>
    <path d="M900 490 L925 510 L915 525 L935 545"/>
    <path d="M760 340 L740 315 L750 300 L730 280"/>
    <path d="M760 490 L740 510 L750 525 L730 545"/>
  </g>

  <!-- small impact burst near valve -->
  <g fill="#D9A441">
    <polygon points="831,415 845,390 855,405 875,385 862,415 880,425 855,432 862,455 840,438 831,460 822,438 800,455 807,432 782,425 800,415 787,385 807,405 817,390"/>
  </g>
  <circle cx="831" cy="415" r="10" fill="#2E2A24" opacity="0.6"/>

  <!-- decorative pipe supports/brackets -->
  <rect x="548" y="200" width="58" height="10" fill="#2E2A24" opacity="0.5"/>
  <rect x="548" y="300" width="58" height="10" fill="#2E2A24" opacity="0.5"/>

  <!-- baseboard -->
  <rect x="170" y="480" width="860" height="30" fill="#5C6E58" opacity="0.3"/>

  <!-- small decorative dots representing drips/settled calm elsewhere -->
  <g fill="#5C6E58" opacity="0.4">
    <circle cx="300" cy="480" r="4"/>
    <circle cx="330" cy="480" r="4"/>
    <circle cx="360" cy="480" r="4"/>
  </g>
</svg>