<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Decorative background arcs -->
  <circle cx="1080" cy="90" r="120" fill="#E4C7B2" opacity="0.35"/>
  <circle cx="90" cy="560" r="150" fill="#5C6E58" opacity="0.12"/>

  <!-- Sink cabinet frame -->
  <rect x="140" y="120" width="920" height="60" fill="#E4C7B2"/>
  <rect x="140" y="120" width="920" height="14" fill="#D9A441"/>

  <!-- Cabinet side walls -->
  <rect x="180" y="180" width="20" height="360" fill="#E4C7B2" opacity="0.5"/>
  <rect x="1000" y="180" width="20" height="360" fill="#E4C7B2" opacity="0.5"/>

  <!-- Faucet body above counter (simplified, small) -->
  <rect x="560" y="70" width="16" height="50" rx="6" fill="#5C6E58"/>
  <path d="M568 70 Q568 40 600 40 Q632 40 632 70" stroke="#5C6E58" stroke-width="14" fill="none" stroke-linecap="round"/>
  <rect x="624" y="70" width="16" height="35" rx="6" fill="#5C6E58"/>

  <!-- Main vertical supply pipe from faucet down through counter -->
  <rect x="592" y="120" width="18" height="90" fill="#B85C38"/>

  <!-- Horizontal branch pipe under sink -->
  <rect x="330" y="330" width="540" height="20" fill="#B85C38"/>

  <!-- Vertical connector from counter to horizontal pipe -->
  <rect x="592" y="210" width="18" height="120" fill="#B85C38"/>

  <!-- Elbow joint circle at junction -->
  <circle cx="601" cy="330" r="16" fill="#B85C38"/>

  <!-- Shut-off valve on the horizontal line -->
  <rect x="420" y="322" width="36" height="36" rx="6" fill="#5C6E58"/>
  <circle cx="438" cy="340" r="9" fill="#F6EFE6"/>
  <rect x="410" y="336" width="56" height="8" fill="#2E2A24" opacity="0.15"/>

  <!-- Pipe continuing to wall (left) -->
  <rect x="330" y="330" width="20" height="20" fill="#B85C38"/>
  <rect x="200" y="330" width="140" height="20" fill="#B85C38" opacity="0.85"/>

  <!-- Tee fitting where arrestor connects -->
  <circle cx="800" cy="340" r="20" fill="#B85C38"/>

  <!-- Water hammer arrestor: vertical capped cylinder rising from tee -->
  <rect x="786" y="200" width="28" height="140" rx="14" fill="#D9A441"/>
  <rect x="786" y="200" width="28" height="30" rx="14" fill="#B85C38"/>
  <circle cx="800" cy="200" r="14" fill="#B85C38"/>

  <!-- Label plate on arrestor (decorative, no text) -->
  <rect x="790" y="250" width="20" height="40" rx="4" fill="#F6EFE6" opacity="0.6"/>

  <!-- Bracket holding arrestor to cabinet wall -->
  <rect x="812" y="230" width="40" height="10" fill="#5C6E58"/>
  <rect x="848" y="200" width="10" height="60" fill="#5C6E58"/>

  <!-- Small directional arrows indicating water flow -->
  <path d="M700 340 l14 -8 v16 z" fill="#2E2A24" opacity="0.4"/>
  <path d="M760 340 l14 -8 v16 z" fill="#2E2A24" opacity="0.4"/>

  <!-- P-trap curve continuing to drain, purely decorative context -->
  <path d="M601 346 v40 q0 30 30 30 h60" stroke="#5C6E58" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Floor line of cabinet -->
  <rect x="180" y="540" width="840" height="14" fill="#2E2A24" opacity="0.12"/>

  <!-- Cabinet doors suggestion (subtle, editorial) -->
  <rect x="230" y="380" width="280" height="150" rx="8" fill="#E4C7B2" opacity="0.25"/>
  <rect x="690" y="380" width="280" height="150" rx="8" fill="#E4C7B2" opacity="0.25"/>
  <circle cx="480" cy="455" r="6" fill="#5C6E58" opacity="0.4"/>
  <circle cx="720" cy="455" r="6" fill="#5C6E58" opacity="0.4"/>

  <!-- Small decorative droplet motif top right -->
  <path d="M1090 220 q14 24 0 36 q-14 -12 0 -36 z" fill="#5C6E58" opacity="0.3"/>

  <!-- Subtle sound-wave arcs near faucet to hint at banging noise -->
  <path d="M650 60 q20 10 0 30" stroke="#B85C38" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M665 50 q35 20 0 55" stroke="#B85C38" stroke-width="4" fill="none" opacity="0.3"/>
</svg>