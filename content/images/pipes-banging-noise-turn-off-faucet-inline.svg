<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Give the surge somewhere to go</text>
<!-- pipe -->
<rect x="60" y="440" width="860" height="40" fill="#B85C38"/>
<!-- flow arrows -->
<path d="M110 460 L190 460" stroke="#F6EFE6" stroke-width="6"/>
<path d="M200 460 L182 448 L182 472 Z" fill="#F6EFE6"/>
<path d="M260 460 L340 460" stroke="#F6EFE6" stroke-width="6"/>
<path d="M350 460 L332 448 L332 472 Z" fill="#F6EFE6"/>
<!-- tee and arrestor -->
<rect x="560" y="400" width="60" height="40" fill="#B85C38"/>
<rect x="550" y="190" width="80" height="210" rx="14" fill="#E4C7B2" stroke="#5C6E58" stroke-width="5"/>
<rect x="556" y="196" width="68" height="104" rx="10" fill="#F6EFE6"/>
<rect x="556" y="300" width="68" height="18" fill="#2E2A24"/>
<rect x="556" y="318" width="68" height="76" fill="#D9A441"/>
<!-- valve -->
<rect x="860" y="410" width="70" height="100" rx="8" fill="#5C6E58"/>
<rect x="878" y="370" width="34" height="40" fill="#5C6E58"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<text x="660" y="240">Sealed air cushion</text>
<text x="660" y="320">Piston keeps water out</text>
<text x="100" y="260">AA arrestor, ASSE 1010</text>
<text x="100" y="300">on hot and cold lines</text>
<text x="830" y="560">Quick-closing valve</text>
<text x="80" y="540">Aim for 45–60 psi</text>
<text x="80" y="580">Over 80 psi: PRV required</text>
</g>
</svg>
