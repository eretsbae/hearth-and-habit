<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <text x="600" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2E2A24" font-weight="bold">Rake or Leave the Leaves?</text>

  <!-- Start node -->
  <rect x="490" y="95" width="220" height="70" rx="12" fill="#5C6E58"/>
  <text x="600" y="137" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#F6EFE6">Check Your Lawn</text>

  <!-- connectors from start to 4 branches -->
  <path d="M 490 150 Q 300 190 175 225" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <path d="M 545 165 Q 470 195 420 225" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <path d="M 655 165 Q 730 195 780 225" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <path d="M 710 150 Q 900 190 1025 225" fill="none" stroke="#2E2A24" stroke-width="3"/>

  <!-- Arrowhead markers as small triangles -->
  <polygon points="175,225 165,210 185,215" fill="#2E2A24"/>
  <polygon points="420,225 410,210 430,215" fill="#2E2A24"/>
  <polygon points="780,225 770,210 790,215" fill="#2E2A24"/>
  <polygon points="1025,225 1015,210 1035,215" fill="#2E2A24"/>

  <!-- Branch 1: Leaf Depth Under 2 Inches -->
  <circle cx="175" cy="255" r="26" fill="#D9A441"/>
  <text x="175" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" font-weight="bold">1</text>
  <rect x="55" y="300" width="240" height="90" rx="12" fill="#E4C7B2"/>
  <text x="175" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">Leaf Depth Under</text>
  <text x="175" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">2 Inches</text>

  <path d="M 175 390 L 175 440" stroke="#2E2A24" stroke-width="3"/>
  <polygon points="175,450 166,432 184,432" fill="#2E2A24"/>
  <rect x="55" y="455" width="240" height="80" rx="12" fill="#5C6E58"/>
  <text x="175" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Mulch in</text>
  <text x="175" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Place</text>

  <!-- Branch 2: Over 3 Inches -->
  <circle cx="420" cy="255" r="26" fill="#D9A441"/>
  <text x="420" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" font-weight="bold">2</text>
  <rect x="300" y="300" width="240" height="90" rx="12" fill="#E4C7B2"/>
  <text x="420" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">Leaf Depth Over</text>
  <text x="420" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">3 Inches</text>

  <path d="M 420 390 L 420 440" stroke="#2E2A24" stroke-width="3"/>
  <polygon points="420,450 411,432 429,432" fill="#2E2A24"/>
  <rect x="300" y="455" width="240" height="80" rx="12" fill="#B85C38"/>
  <text x="420" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F6EFE6">Rake or Mulch-Mow</text>
  <text x="420" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F6EFE6">Twice</text>

  <!-- Branch 3: Matted or Wet -->
  <circle cx="780" cy="255" r="26" fill="#D9A441"/>
  <text x="780" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" font-weight="bold">3</text>
  <rect x="660" y="300" width="240" height="90" rx="12" fill="#E4C7B2"/>
  <text x="780" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">Matted or Wet</text>
  <text x="780" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">Leaves</text>

  <path d="M 780 390 L 780 440" stroke="#2E2A24" stroke-width="3"/>
  <polygon points="780,450 771,432 789,432" fill="#2E2A24"/>
  <rect x="660" y="455" width="240" height="80" rx="12" fill="#B85C38"/>
  <text x="780" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Remove</text>
  <text x="780" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Entirely</text>

  <!-- Branch 4: Grass Still Visible -->
  <circle cx="1025" cy="255" r="26" fill="#D9A441"/>
  <text x="1025" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" font-weight="bold">4</text>
  <rect x="905" y="300" width="240" height="90" rx="12" fill="#E4C7B2"/>
  <text x="1025" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2E2A24">Grass Still Visible</text>
  <text x="1025" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2E2A24">Through Leaves</text>

  <path d="M 1025 390 L 1025 440" stroke="#2E2A24" stroke-width="3"/>
  <polygon points="1025,450 1016,432 1034,432" fill="#2E2A24"/>
  <rect x="905" y="455" width="240" height="80" rx="12" fill="#5C6E58"/>
  <text x="1025" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Safe to</text>
  <text x="1025" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#F6EFE6">Leave</text>

</svg>