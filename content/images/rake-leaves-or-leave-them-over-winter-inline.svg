<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">Can You See the Grass?</text>

  <!-- Column 1: light cover -->
  <rect x="60" y="120" width="330" height="230" rx="16" fill="#E4C7B2"/>
  <rect x="60" y="270" width="330" height="80" rx="0" fill="#5C6E58"/>
  <g fill="#5C6E58">
    <rect x="80" y="230" width="6" height="40"/><rect x="100" y="222" width="6" height="48"/><rect x="120" y="230" width="6" height="40"/>
    <rect x="140" y="224" width="6" height="46"/><rect x="160" y="230" width="6" height="40"/><rect x="180" y="222" width="6" height="48"/>
    <rect x="200" y="230" width="6" height="40"/><rect x="220" y="224" width="6" height="46"/><rect x="240" y="230" width="6" height="40"/>
    <rect x="260" y="222" width="6" height="48"/><rect x="280" y="230" width="6" height="40"/><rect x="300" y="224" width="6" height="46"/>
    <rect x="320" y="230" width="6" height="40"/><rect x="340" y="222" width="6" height="48"/><rect x="360" y="230" width="6" height="40"/>
  </g>
  <ellipse cx="150" cy="262" rx="22" ry="9" fill="#B85C38"/>
  <ellipse cx="290" cy="264" rx="22" ry="9" fill="#D9A441"/>
  <text x="225" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">10–20% covered</text>

  <!-- Column 2: moderate cover -->
  <rect x="435" y="120" width="330" height="230" rx="16" fill="#E4C7B2"/>
  <rect x="435" y="270" width="330" height="80" fill="#5C6E58"/>
  <g fill="#5C6E58">
    <rect x="465" y="222" width="6" height="48"/><rect x="505" y="224" width="6" height="46"/><rect x="545" y="222" width="6" height="48"/>
    <rect x="585" y="224" width="6" height="46"/><rect x="625" y="222" width="6" height="48"/><rect x="665" y="224" width="6" height="46"/>
    <rect x="705" y="222" width="6" height="48"/><rect x="740" y="224" width="6" height="46"/>
  </g>
  <ellipse cx="490" cy="262" rx="22" ry="9" fill="#B85C38"/>
  <ellipse cx="530" cy="258" rx="22" ry="9" fill="#D9A441"/>
  <ellipse cx="610" cy="262" rx="22" ry="9" fill="#B85C38"/>
  <ellipse cx="650" cy="256" rx="22" ry="9" fill="#D9A441"/>
  <ellipse cx="725" cy="262" rx="22" ry="9" fill="#B85C38"/>
  <text x="600" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Grass still visible</text>

  <!-- Column 3: covered -->
  <rect x="810" y="120" width="330" height="230" rx="16" fill="#E4C7B2"/>
  <rect x="810" y="270" width="330" height="80" fill="#5C6E58"/>
  <rect x="810" y="226" width="330" height="48" fill="#B85C38"/>
  <ellipse cx="870" cy="228" rx="34" ry="12" fill="#D9A441"/>
  <ellipse cx="960" cy="224" rx="34" ry="12" fill="#B85C38"/>
  <ellipse cx="1050" cy="228" rx="34" ry="12" fill="#D9A441"/>
  <ellipse cx="1110" cy="230" rx="24" ry="10" fill="#B85C38"/>
  <text x="975" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Can't see the grass</text>

  <!-- Arrows -->
  <g fill="#2E2A24">
    <rect x="221" y="365" width="8" height="45"/><polygon points="205,408 245,408 225,438"/>
    <rect x="596" y="365" width="8" height="45"/><polygon points="580,408 620,408 600,438"/>
    <rect x="971" y="365" width="8" height="45"/><polygon points="955,408 995,408 975,438"/>
  </g>

  <!-- Actions -->
  <rect x="60" y="455" width="330" height="100" rx="16" fill="#5C6E58"/>
  <text x="225" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#F6EFE6">Leave them</text>
  <rect x="435" y="455" width="330" height="100" rx="16" fill="#D9A441"/>
  <text x="600" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2E2A24">Mow them in</text>
  <rect x="810" y="455" width="330" height="100" rx="16" fill="#B85C38"/>
  <text x="975" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#F6EFE6">Shred or move them</text>
</svg>
