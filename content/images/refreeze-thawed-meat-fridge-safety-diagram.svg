<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="68" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">How did the meat thaw?</text>
<rect x="60" y="110" width="340" height="110" rx="14" fill="#5C6E58"/>
<text x="230" y="158" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F6EFE6" text-anchor="middle">In a fridge</text>
<text x="230" y="195" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F6EFE6" text-anchor="middle">at 40°F or below</text>
<rect x="430" y="110" width="340" height="110" rx="14" fill="#D9A441"/>
<text x="600" y="158" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E2A24" text-anchor="middle">In cold water</text>
<text x="600" y="195" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E2A24" text-anchor="middle">or the microwave</text>
<rect x="800" y="110" width="340" height="110" rx="14" fill="#B85C38"/>
<text x="970" y="158" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F6EFE6" text-anchor="middle">On the counter</text>
<text x="970" y="195" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F6EFE6" text-anchor="middle">over 2 hours</text>
<line x1="230" y1="222" x2="230" y2="280" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="600" y1="222" x2="600" y2="280" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="970" y1="222" x2="970" y2="280" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="290" width="340" height="240" rx="14" fill="#E4C7B2"/>
<text x="230" y="345" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E2A24" text-anchor="middle">Refreeze raw</text>
<text x="230" y="400" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Ground meat, poultry:</text>
<text x="230" y="435" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">within 1–2 days</text>
<text x="230" y="475" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Steaks, roasts:</text>
<text x="230" y="510" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">within 3–5 days</text>
<rect x="430" y="290" width="340" height="240" rx="14" fill="#E4C7B2"/>
<text x="600" y="400" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E2A24" text-anchor="middle">Cook it first,</text>
<text x="600" y="440" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E2A24" text-anchor="middle">then freeze</text>
<rect x="800" y="290" width="340" height="240" rx="14" fill="#E4C7B2"/>
<text x="970" y="400" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#B85C38" text-anchor="middle">Throw it out</text>
<text x="970" y="440" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">(1 hour above 90°F)</text>
<text x="600" y="585" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Still icy, or 40°F or below? Safe to refreeze or cook.</text>
</svg>
