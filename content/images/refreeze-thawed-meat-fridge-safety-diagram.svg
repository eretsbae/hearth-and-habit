<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- question -->
  <rect x="440" y="102" width="320" height="62" rx="16" fill="#2E2A24"/>

  <!-- branch lines -->
  <g stroke="#2E2A24" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M600 164 V188 M220 188 H980 M220 188 V200 M600 188 V200 M980 188 V200"/>
    <line x1="220" y1="276" x2="220" y2="298"/>
    <line x1="600" y1="276" x2="600" y2="298"/>
    <line x1="980" y1="276" x2="980" y2="298"/>
  </g>
  <g fill="#2E2A24">
    <polygon points="220,214 211,199 229,199"/>
    <polygon points="600,214 591,199 609,199"/>
    <polygon points="980,214 971,199 989,199"/>
    <polygon points="220,312 211,297 229,297"/>
    <polygon points="600,312 591,297 609,297"/>
    <polygon points="980,312 971,297 989,297"/>
  </g>

  <!-- how it thawed -->
  <g fill="#FFFDF9" stroke="#2E2A24" stroke-width="3">
    <rect x="50" y="216" width="340" height="60" rx="14"/>
    <rect x="430" y="216" width="340" height="60" rx="14"/>
    <rect x="810" y="216" width="340" height="60" rx="14"/>
  </g>

  <!-- outcomes -->
  <rect x="50" y="314" width="340" height="226" rx="18" fill="#D6DDD5"/>
  <rect x="430" y="314" width="340" height="226" rx="18" fill="#F0DBB3"/>
  <rect x="810" y="314" width="340" height="226" rx="18" fill="#E3BEAF"/>

  <!-- outcome icons: check / flame / X -->
  <circle cx="220" cy="356" r="26" fill="#5C6E58"/>
  <path d="M207 357 L216 367 L234 346" fill="none" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="356" r="26" fill="#D9A441"/>
  <path d="M600 374 C586 371 584 358 591 348 C594 355 598 355 598 351 C598 343 602 337 608 333 C607 343 618 350 614 362 C612 369 607 374 600 374 Z" fill="#FFFDF9"/>
  <circle cx="980" cy="356" r="26" fill="#B85C38"/>
  <path d="M969 345 L991 367 M991 345 L969 367" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="143" font-size="30" font-weight="bold" fill="#FFFDF9">How did it thaw?</text>
    <g fill="#2E2A24">
      <text x="600" y="72" font-size="38" font-weight="bold">Can you refreeze thawed meat?</text>

      <text x="220" y="255" font-size="26" font-weight="bold">In the fridge</text>
      <text x="600" y="255" font-size="26" font-weight="bold">Cold water or microwave</text>
      <text x="980" y="255" font-size="26" font-weight="bold">Counter, over 2 hours</text>

      <text x="220" y="416" font-size="30" font-weight="bold">Refreeze raw</text>
      <text x="220" y="450" font-size="24">within its fridge window:</text>
      <text x="220" y="484" font-size="24">Ground meat: 1–2 days</text>
      <text x="220" y="516" font-size="24">Steaks, chops: 3–5 days</text>

      <text x="600" y="416" font-size="30" font-weight="bold">Cook it first</text>
      <text x="600" y="450" font-size="24">then freeze the</text>
      <text x="600" y="482" font-size="24">cooked meat</text>

      <text x="980" y="416" font-size="30" font-weight="bold">Throw it out</text>
      <text x="980" y="450" font-size="24">not safe to cook</text>
      <text x="980" y="482" font-size="24">or refreeze</text>

      <text x="600" y="582" font-size="24">Freezing pauses bacteria; it doesn't kill them.</text>
    </g>
  </g>
</svg>
