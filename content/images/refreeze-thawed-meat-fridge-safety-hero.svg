<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- fridge interior background panel -->
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <rect x="150" y="90" width="900" height="440" rx="18" fill="#EFE4D6"/>

  <!-- top shelf shadow -->
  <rect x="180" y="400" width="840" height="14" rx="6" fill="#D9A441" opacity="0.25"/>

  <!-- back wall subtle shelves lines -->
  <line x1="200" y1="180" x2="1000" y2="180" stroke="#E4C7B2" stroke-width="4"/>
  <line x1="200" y1="270" x2="1000" y2="270" stroke="#E4C7B2" stroke-width="4"/>

  <!-- main shelf -->
  <rect x="180" y="410" width="840" height="24" rx="6" fill="#D9A441"/>
  <rect x="180" y="434" width="840" height="10" fill="#B85C38" opacity="0.3"/>
  <!-- shelf supports -->
  <rect x="200" y="444" width="14" height="60" fill="#5C6E58" opacity="0.4"/>
  <rect x="980" y="444" width="14" height="60" fill="#5C6E58" opacity="0.4"/>

  <!-- meat package tray -->
  <g>
    <rect x="360" y="330" width="280" height="80" rx="10" fill="#E4C7B2"/>
    <!-- raw meat shape -->
    <ellipse cx="500" cy="355" rx="115" ry="42" fill="#B85C38"/>
    <ellipse cx="500" cy="350" rx="95" ry="30" fill="#C96B45"/>
    <!-- fat marbling streaks -->
    <path d="M430 340 q20 -10 40 0" stroke="#F6EFE6" stroke-width="5" fill="none" opacity="0.5"/>
    <path d="M470 360 q25 -12 50 0" stroke="#F6EFE6" stroke-width="5" fill="none" opacity="0.5"/>
    <path d="M520 335 q20 -8 35 2" stroke="#F6EFE6" stroke-width="5" fill="none" opacity="0.4"/>
    <!-- plastic wrap shine -->
    <rect x="365" y="332" width="270" height="76" rx="10" fill="#F6EFE6" opacity="0.12"/>
    <ellipse cx="450" cy="335" rx="60" ry="14" fill="#F6EFE6" opacity="0.25"/>
  </g>

  <!-- second shelf item: small jar -->
  <g>
    <rect x="700" y="350" width="70" height="60" rx="8" fill="#5C6E58"/>
    <rect x="710" y="336" width="50" height="18" rx="6" fill="#D9A441"/>
  </g>

  <!-- thermometer icon standing on shelf -->
  <g>
    <rect x="820" y="230" width="18" height="180" rx="9" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
    <circle cx="829" cy="410" r="26" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
    <rect x="823" y="260" width="12" height="130" rx="6" fill="#B85C38"/>
    <circle cx="829" cy="410" r="15" fill="#B85C38"/>
    <!-- tick marks -->
    <line x1="838" y1="250" x2="846" y2="250" stroke="#2E2A24" stroke-width="3"/>
    <line x1="838" y1="280" x2="846" y2="280" stroke="#2E2A24" stroke-width="3"/>
    <line x1="838" y1="310" x2="846" y2="310" stroke="#2E2A24" stroke-width="3"/>
    <line x1="838" y1="340" x2="846" y2="340" stroke="#2E2A24" stroke-width="3"/>
  </g>

  <!-- fridge door frame accents -->
  <rect x="150" y="90" width="900" height="440" rx="18" fill="none" stroke="#2E2A24" stroke-width="3" opacity="0.15"/>

  <!-- decorative sprig -->
  <g stroke="#5C6E58" stroke-width="4" fill="none" opacity="0.6">
    <path d="M300 250 q10 -30 0 -60"/>
    <path d="M300 230 q-15 -8 -25 -20"/>
    <path d="M300 220 q15 -10 25 -22"/>
  </g>
  <circle cx="300" cy="190" r="6" fill="#5C6E58" opacity="0.6"/>

  <!-- small clay bowl decoration on lower left -->
  <g>
    <path d="M220 470 q60 40 120 0 l-10 20 q-50 30 -100 0 z" fill="#E4C7B2"/>
    <ellipse cx="280" cy="468" rx="60" ry="14" fill="#D9A441" opacity="0.5"/>
  </g>

  <!-- soft vignette shadow at bottom -->
  <rect x="150" y="500" width="900" height="30" fill="#2E2A24" opacity="0.05"/>
</svg>