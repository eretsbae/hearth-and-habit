<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">What each surface can't take</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">
<rect x="80" y="130" width="1040" height="76" rx="10" fill="#E4C7B2"/>
<circle cx="130" cy="168" r="22" fill="#B85C38"/>
<text x="180" y="179">Marble: no acids, even sealed</text>
<rect x="80" y="222" width="1040" height="76" rx="10" fill="#E4C7B2"/>
<circle cx="130" cy="260" r="22" fill="#5C6E58"/>
<text x="180" y="271">Wood floor: no steam mop</text>
<rect x="80" y="314" width="1040" height="76" rx="10" fill="#E4C7B2"/>
<circle cx="130" cy="352" r="22" fill="#D9A441"/>
<text x="180" y="363">Glass cooktop: no ammonia</text>
<rect x="80" y="406" width="1040" height="76" rx="10" fill="#E4C7B2"/>
<circle cx="130" cy="444" r="22" fill="#B85C38"/>
<text x="180" y="455">Stainless: no bleach or disinfectant</text>
<rect x="80" y="498" width="1040" height="76" rx="10" fill="#E4C7B2"/>
<circle cx="130" cy="536" r="22" fill="#5C6E58"/>
<text x="180" y="547">Leather: no saddle soap</text>
</g>
</svg>
