<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24">Why grout stains come back</text>
  <!-- left column: causes -->
  <rect x="60" y="130" width="460" height="110" rx="18" fill="#E4C7B2"/>
  <circle cx="110" cy="185" r="26" fill="#B85C38"/>
  <text x="152" y="194" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Soap film feeds bacteria</text>
  <rect x="60" y="270" width="460" height="110" rx="18" fill="#E4C7B2"/>
  <circle cx="110" cy="325" r="26" fill="#D9A441"/>
  <text x="148" y="334" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">Standing water loses chlorine</text>
  <rect x="60" y="410" width="460" height="110" rx="18" fill="#E4C7B2"/>
  <circle cx="110" cy="465" r="26" fill="#2E2A24"/>
  <text x="152" y="474" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Damp grout grows mold</text>
  <!-- arrows -->
  <path d="M 560 325 L 680 325" stroke="#5C6E58" stroke-width="10" fill="none"/>
  <polygon points="680,300 730,325 680,350" fill="#5C6E58"/>
  <!-- right column: fixes -->
  <rect x="760" y="160" width="380" height="120" rx="18" fill="#5C6E58"/>
  <text x="950" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6">Scrub off, then dry</text>
  <rect x="760" y="370" width="380" height="120" rx="18" fill="#5C6E58"/>
  <text x="950" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6">Fan vented outdoors</text>
  <path d="M 950 290 L 950 360" stroke="#D9A441" stroke-width="6" stroke-dasharray="12 10" fill="none"/>
</svg>
