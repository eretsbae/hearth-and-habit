<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- wall panel accent -->
  <rect x="0" y="0" width="1200" height="440" fill="#F6EFE6"/>
  <rect x="150" y="0" width="900" height="440" fill="#E4C7B2" opacity="0.35"/>

  <!-- floor -->
  <rect x="0" y="440" width="1200" height="190" fill="#5C6E58" opacity="0.18"/>
  <rect x="0" y="455" width="1200" height="8" fill="#5C6E58" opacity="0.3"/>

  <!-- door frame suggestion, right side -->
  <rect x="920" y="60" width="220" height="500" fill="#E4C7B2" opacity="0.4"/>
  <rect x="920" y="60" width="12" height="500" fill="#B85C38" opacity="0.5"/>
  <circle cx="1090" cy="330" r="9" fill="#D9A441"/>

  <!-- hook area, left -->
  <circle cx="260" cy="150" r="10" fill="#2E2A24"/>
  <rect x="255" y="150" width="10" height="20" rx="4" fill="#2E2A24"/>

  <!-- bag hanging from hook -->
  <g>
    <path d="M240 210 Q260 175 280 210 L280 210 L285 300 Q260 320 235 300 Z" fill="#B85C38"/>
    <path d="M245 210 Q260 185 275 210" stroke="#2E2A24" stroke-width="5" fill="none"/>
    <rect x="235" y="230" width="50" height="10" fill="#D9A441" opacity="0.6"/>
  </g>

  <!-- shelf -->
  <rect x="430" y="230" width="380" height="18" rx="4" fill="#B85C38"/>
  <rect x="430" y="248" width="380" height="6" fill="#2E2A24" opacity="0.25"/>
  <!-- shelf brackets -->
  <path d="M450 248 L450 270 L470 248 Z" fill="#5C6E58"/>
  <path d="M770 248 L770 270 L790 248 Z" fill="#5C6E58"/>

  <!-- keys on shelf -->
  <g transform="translate(480,205)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#D9A441" stroke-width="5"/>
    <rect x="12" y="-4" width="34" height="8" fill="#D9A441"/>
    <rect x="42" y="-4" width="6" height="14" fill="#D9A441"/>
    <rect x="34" y="-4" width="6" height="10" fill="#D9A441"/>
  </g>

  <!-- sunglasses on shelf -->
  <g transform="translate(580,215)">
    <ellipse cx="-16" cy="8" rx="16" ry="12" fill="#2E2A24"/>
    <ellipse cx="16" cy="8" rx="16" ry="12" fill="#2E2A24"/>
    <rect x="-4" y="4" width="8" height="6" fill="#2E2A24"/>
    <path d="M-32 4 L-46 -4" stroke="#2E2A24" stroke-width="4" fill="none"/>
    <path d="M32 4 L46 -4" stroke="#2E2A24" stroke-width="4" fill="none"/>
  </g>

  <!-- wallet on shelf -->
  <g transform="translate(690,206)">
    <rect x="0" y="0" width="60" height="40" rx="6" fill="#5C6E58"/>
    <rect x="0" y="16" width="60" height="6" fill="#2E2A24" opacity="0.3"/>
    <rect x="44" y="10" width="14" height="10" rx="2" fill="#D9A441"/>
  </g>

  <!-- small bowl by the door on floor -->
  <g transform="translate(870,470)">
    <ellipse cx="0" cy="20" rx="70" ry="20" fill="#B85C38"/>
    <ellipse cx="0" cy="10" rx="70" ry="22" fill="#E4C7B2"/>
    <ellipse cx="0" cy="10" rx="55" ry="14" fill="#F6EFE6"/>
    <!-- items in bowl -->
    <circle cx="-15" cy="6" r="7" fill="#D9A441"/>
    <rect x="0" y="0" width="20" height="10" rx="3" fill="#2E2A24"/>
    <circle cx="20" cy="4" r="5" fill="#B85C38"/>
  </g>

  <!-- small potted plant accent, left corner -->
  <g transform="translate(70,470)">
    <path d="M-30 60 L30 60 L20 0 L-20 0 Z" fill="#E4C7B2"/>
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="#B85C38" opacity="0.4"/>
    <path d="M0 0 C -20 -40 -10 -70 0 -90 C 10 -70 20 -40 0 0" fill="#5C6E58"/>
    <path d="M-5 -10 C -25 -45 -15 -70 -5 -85" fill="none" stroke="#5C6E58" stroke-width="0"/>
    <path d="M0 -10 C 15 -50 5 -75 0 -95" fill="#5C6E58"/>
    <path d="M0 -5 C -10 -35 5 -60 15 -80" fill="#5C6E58" opacity="0.85"/>
  </g>

  <!-- subtle baseboard line -->
  <rect x="0" y="455" width="1200" height="4" fill="#2E2A24" opacity="0.15"/>

  <!-- soft shadow under shelf items -->
  <ellipse cx="620" cy="255" rx="200" ry="6" fill="#2E2A24" opacity="0.08"/>
</svg>