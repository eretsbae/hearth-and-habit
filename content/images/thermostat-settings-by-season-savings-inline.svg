<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="72" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Winter setback: how deep, by system</text>
<!-- axes -->
<line x1="100" y1="130" x2="100" y2="520" stroke="#2E2A24" stroke-width="3"/>
<line x1="400" y1="520" x2="700" y2="520" stroke="#5C6E58" stroke-width="5"/>
<line x1="100" y1="520" x2="1110" y2="520" stroke="#2E2A24" stroke-width="3"/>
<!-- 55 floor -->
<line x1="100" y1="470" x2="1110" y2="470" stroke="#B85C38" stroke-width="3" stroke-dasharray="10 8"/>
<!-- furnace line: comfort y=170, setback y=330 for 8 h -->
<polyline points="100,170 380,170 400,330 700,330 720,170 1110,170" fill="none" stroke="#5C6E58" stroke-width="7" stroke-linejoin="round"/>
<!-- heat pump line: small dip -->
<polyline points="100,200 380,200 400,250 700,250 720,200 1110,200" fill="none" stroke="#D9A441" stroke-width="7" stroke-linejoin="round"/>
<rect x="400" y="330" width="300" height="140" fill="#5C6E58" fill-opacity="0.12"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24">
<text x="730" y="290">Furnace: 7–10°F for 8 hours</text>
<text x="730" y="245">Heat pump: 2°C (3.6°F) max</text>
<text x="420" y="410">Up to ~10% a year</text>
<text x="730" y="455">Away: never below 55°F</text>
<text x="550" y="565" text-anchor="middle">Asleep or out: about 8 hours</text>
</g>
</svg>
