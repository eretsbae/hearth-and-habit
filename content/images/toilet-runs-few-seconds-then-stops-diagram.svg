<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- tank body (cutaway) -->
  <rect x="400" y="120" width="380" height="370" rx="26" fill="#E4C7B2"/>
  <rect x="420" y="140" width="340" height="330" rx="14" fill="#FFFDF9"/>
  <!-- water, drained down to just above the flapper -->
  <rect x="420" y="400" width="340" height="70" fill="#D6DDD5"/>
  <line x1="420" y1="400" x2="760" y2="400" stroke="#5C6E58" stroke-width="3"/>
  <!-- original full level: pencil mark -->
  <line x1="420" y1="230" x2="760" y2="230" stroke="#B85C38" stroke-width="4" stroke-dasharray="14 10"/>
  <!-- drop arrow -->
  <line x1="545" y1="245" x2="545" y2="378" stroke="#2E2A24" stroke-width="4"/>
  <polygon points="533,378 545,398 557,378" fill="#2E2A24"/>

  <!-- fill valve -->
  <rect x="451" y="205" width="26" height="265" fill="#5C6E58"/>
  <rect x="436" y="182" width="56" height="28" rx="8" fill="#D9A441"/>

  <!-- overflow pipe -->
  <rect x="618" y="200" width="26" height="250" rx="4" fill="#5C6E58"/>
  <ellipse cx="631" cy="201" rx="13" ry="4" fill="#2E2A24"/>

  <!-- refill tube clipped on the outside, above the rim -->
  <path d="M492 194 C540 140 600 140 622 186" fill="none" stroke="#2E2A24" stroke-width="6" stroke-linecap="round"/>

  <!-- flapper on seat, with leak drops -->
  <rect x="655" y="460" width="90" height="10" rx="3" fill="#2E2A24"/>
  <ellipse cx="700" cy="451" rx="48" ry="14" fill="#B85C38"/>
  <path d="M700 478 C706 486 706 492 700 494 C694 492 694 486 700 478 Z" fill="#5C6E58"/>
  <path d="M700 498 C706 506 706 512 700 514 C694 512 694 506 700 498 Z" fill="#5C6E58"/>

  <!-- tank bolts -->
  <rect x="470" y="490" width="14" height="40" rx="3" fill="#2E2A24"/>
  <rect x="696" y="520" width="14" height="10" rx="3" fill="#2E2A24"/>

  <!-- callout lines -->
  <g stroke="#2E2A24" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="380" y1="150" x2="510" y2="168"/>
    <line x1="380" y1="300" x2="420" y2="232"/>
    <line x1="820" y1="300" x2="760" y2="400"/>
    <line x1="820" y1="455" x2="752" y2="452"/>
    <line x1="380" y1="520" x2="468" y2="512"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
    <text x="600" y="72" font-size="38" font-weight="bold" text-anchor="middle">Find where the tank water goes</text>
    <text x="370" y="140" font-size="26" text-anchor="end">Refill tube: clip</text>
    <text x="370" y="172" font-size="26" text-anchor="end">outside overflow</text>
    <text x="370" y="300" font-size="26" text-anchor="end">Pencil mark,</text>
    <text x="370" y="332" font-size="26" text-anchor="end">water shut off</text>
    <text x="830" y="290" font-size="26">Level stops just</text>
    <text x="830" y="322" font-size="26">below flapper</text>
    <text x="830" y="450" font-size="26">Flapper and seat:</text>
    <text x="830" y="482" font-size="26">usual leak</text>
    <text x="370" y="530" font-size="26" text-anchor="end">Wet bolts: gasket</text>
  </g>
</svg>
