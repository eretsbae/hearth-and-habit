<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- tank body (cutaway) -->
  <rect x="380" y="120" width="400" height="370" rx="26" fill="#E4C7B2"/>
  <rect x="400" y="140" width="360" height="330" rx="14" fill="#FFFDF9"/>
  <!-- water -->
  <rect x="400" y="235" width="360" height="215" fill="#D6DDD5"/>
  <rect x="400" y="430" width="360" height="40" rx="14" fill="#D6DDD5"/>
  <line x1="400" y1="235" x2="760" y2="235" stroke="#5C6E58" stroke-width="3"/>

  <!-- supply line + drain pipe under the tank -->
  <rect x="446" y="488" width="16" height="44" rx="4" fill="#5C6E58"/>
  <rect x="665" y="486" width="50" height="46" rx="6" fill="#E4C7B2"/>
  <path d="M682 496 C688 504 688 510 682 512 C676 510 676 504 682 496 Z" fill="#B85C38"/>
  <path d="M698 510 C704 518 704 524 698 526 C692 524 692 518 698 510 Z" fill="#B85C38"/>

  <!-- fill valve (left) -->
  <rect x="441" y="205" width="26" height="265" fill="#5C6E58"/>
  <rect x="426" y="182" width="56" height="28" rx="8" fill="#D9A441"/>
  <rect x="424" y="292" width="60" height="46" rx="10" fill="#D9A441"/>

  <!-- overflow tube -->
  <rect x="608" y="200" width="26" height="258" rx="4" fill="#5C6E58"/>
  <ellipse cx="621" cy="201" rx="13" ry="4" fill="#2E2A24"/>

  <!-- refill tube: ends ABOVE the overflow opening -->
  <path d="M482 194 C530 140 590 140 621 180" fill="none" stroke="#2E2A24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="621" cy="191" r="4" fill="#5C6E58"/>

  <!-- flapper on the flush-valve seat -->
  <rect x="645" y="460" width="90" height="10" rx="3" fill="#2E2A24"/>
  <rect x="632" y="445" width="18" height="10" rx="3" fill="#B85C38"/>
  <ellipse cx="690" cy="451" rx="50" ry="14" fill="#B85C38"/>

  <!-- callout lines -->
  <g stroke="#2E2A24" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="362" y1="178" x2="505" y2="169"/>
    <line x1="362" y1="314" x2="420" y2="314"/>
    <line x1="840" y1="222" x2="640" y2="214"/>
    <line x1="840" y1="442" x2="744" y2="450"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
    <text x="600" y="76" font-size="38" font-weight="bold" text-anchor="middle">Why a toilet runs a few seconds, then stops</text>

    <text x="352" y="164" font-size="28" font-weight="bold" text-anchor="end">Refill tube</text>
    <text x="352" y="194" font-size="24" text-anchor="end">clipped above overflow rim,</text>
    <text x="352" y="222" font-size="24" text-anchor="end">not pushed down inside</text>

    <text x="352" y="304" font-size="28" font-weight="bold" text-anchor="end">Fill valve</text>
    <text x="352" y="334" font-size="24" text-anchor="end">refills for a few seconds</text>

    <text x="850" y="214" font-size="28" font-weight="bold">Overflow tube</text>
    <text x="850" y="244" font-size="24">water sits below its rim</text>

    <text x="850" y="434" font-size="28" font-weight="bold">Flapper</text>
    <text x="850" y="464" font-size="24">slow leak into the bowl</text>

    <text x="600" y="580" font-size="26" text-anchor="middle">Water slowly leaks past the flapper → tank refills briefly</text>
  </g>
</svg>
