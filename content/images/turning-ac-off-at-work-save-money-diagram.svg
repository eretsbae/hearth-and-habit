<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="70" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Leaving for Work: Off or Setback?</text>
<rect x="60" y="120" width="560" height="76" rx="14" fill="#E4C7B2"/>
<text x="340" y="168" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Humid house?</text>
<rect x="60" y="246" width="560" height="76" rx="14" fill="#E4C7B2"/>
<text x="340" y="294" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Pets or people home?</text>
