<text x="340" y="420" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">5 to 8 p.m. peak rate?</text>
<line x1="620" y1="158" x2="730" y2="158" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="620" y1="284" x2="730" y2="284" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<line x1="620" y1="410" x2="730" y2="410" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="740" y="120" width="400" height="76" rx="14" fill="#5C6E58"/>
<text x="940" y="168" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6" text-anchor="middle">Set back 7–10°F</text>
<rect x="740" y="246" width="400" height="76" rx="14" fill="#5C6E58"/>
<text x="940" y="294" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6" text-anchor="middle">Moderate setting</text>
<rect x="740" y="372" width="400" height="76" rx="14" fill="#5C6E58"/>
<text x="940" y="420" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F6EFE6" text-anchor="middle">Cool down before 5</text>
<rect x="60" y="500" width="1080" height="80" rx="14" fill="#D9A441"/>
<text x="600" y="551" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">None of these? Off or setback: up to about 10%</text>
