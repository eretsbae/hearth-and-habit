<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- sun rays outside -->
  <g stroke="#D9A441" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="960" y1="90" x2="960" y2="40"/>
    <line x1="1020" y1="110" x2="1060" y2="70"/>
    <line x1="1045" y1="160" x2="1095" y2="150"/>
    <line x1="900" y1="110" x2="860" y2="70"/>
    <line x1="875" y1="160" x2="825" y2="150"/>
  </g>
  <circle cx="960" cy="160" r="55" fill="#D9A441"/>
  <circle cx="960" cy="160" r="55" fill="#E4C7B2" opacity="0.25"/>

  <!-- outside sky negative space, house sits on ground line -->
  <rect x="0" y="560" width="1200" height="70" fill="#E4C7B2" opacity="0.4"/>

  <!-- house outer shape (cross-section, roof triangle + box, open front) -->
  <polygon points="180,260 600,60 1020,260" fill="#B85C38"/>
  <rect x="230" y="260" width="740" height="330" fill="#5C6E58" opacity="0.15"/>

  <!-- wall cross-section box -->
  <rect x="230" y="260" width="740" height="330" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>

  <!-- interior floor divider -->
  <rect x="230" y="430" width="740" height="10" fill="#E4C7B2"/>

  <!-- room walls (interior partitions) -->
  <rect x="590" y="260" width="10" height="330" fill="#E4C7B2"/>

  <!-- upstairs room furniture-ish shapes -->
  <rect x="270" y="360" width="120" height="70" fill="#E4C7B2"/>
  <rect x="650" y="330" width="90" height="100" fill="#5C6E58" opacity="0.5"/>

  <!-- downstairs room shapes -->
  <rect x="270" y="500" width="140" height="90" fill="#5C6E58" opacity="0.4"/>
  <circle cx="850" cy="520" r="45" fill="#D9A441" opacity="0.4"/>

  <!-- thermostat on wall -->
  <g transform="translate(430,340)">
    <circle cx="0" cy="0" r="55" fill="#F6EFE6" stroke="#2E2A24" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="#E4C7B2"/>
    <circle cx="0" cy="0" r="6" fill="#2E2A24"/>
    <!-- dial indicator -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#B85C38" stroke-width="5" stroke-linecap="round"/>
    <!-- tick marks -->
    <line x1="0" y1="-48" x2="0" y2="-42" stroke="#2E2A24" stroke-width="3"/>
    <line x1="34" y1="-34" x2="30" y2="-30" stroke="#2E2A24" stroke-width="3"/>
    <line x1="-34" y1="-34" x2="-30" y2="-30" stroke="#2E2A24" stroke-width="3"/>
    <line x1="34" y1="34" x2="30" y2="30" stroke="#2E2A24" stroke-width="3"/>
    <line x1="-34" y1="34" x2="-30" y2="30" stroke="#2E2A24" stroke-width="3"/>
  </g>

  <!-- energy flow dollar sign icon floating above thermostat, flowing outward -->
  <g transform="translate(500,230)">
    <circle cx="0" cy="0" r="42" fill="#D9A441"/>
    <path d="M0,-24 L0,24 M-12,-16 
             C -12,-22 -4,-26 4,-24 
             C 12,-22 12,-14 4,-12 
             L -4,-8 
             C -12,-6 -12,2 -4,4 
             C 4,6 12,2 12,-4" 
          fill="none" stroke="#F6EFE6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- flow arrows from thermostat to dollar sign representing energy/money flow -->
  <g stroke="#B85C38" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M415,300 C430,280 450,265 470,255" marker-end="url()"/>
    <path d="M445,310 C460,290 470,275 485,262"/>
  </g>
  <polygon points="470,255 480,255 476,266" fill="#B85C38"/>
  <polygon points="485,262 495,264 488,273" fill="#B85C38"/>

  <!-- small chimney -->
  <rect x="820" y="120" width="45" height="90" fill="#5C6E58"/>

  <!-- door -->
  <rect x="560" y="500" width="70" height="90" fill="#2E2A24" opacity="0.7"/>

  <!-- windows on outer wall -->
  <rect x="290" y="300" width="60" height="60" fill="#5C6E58" opacity="0.3"/>
  <rect x="900" y="330" width="60" height="60" fill="#5C6E58" opacity="0.3"/>
</svg>