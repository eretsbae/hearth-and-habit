<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2E2A24">Exposure that can cause burns (CPSC)</text>
  <line x1="120" y1="500" x2="1080" y2="500" stroke="#2E2A24" stroke-width="3"/>
  <!-- 120F: long bar -->
  <rect x="190" y="150" width="200" height="350" rx="10" fill="#E4C7B2"/>
  <!-- 130F: medium bar -->
  <rect x="500" y="330" width="200" height="170" rx="10" fill="#D9A441"/>
  <!-- 140F: short bar -->
  <rect x="810" y="440" width="200" height="60" rx="10" fill="#B85C38"/>
  <text x="290" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">About 5 minutes</text>
  <text x="600" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">30 seconds</text>
  <text x="910" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">6 seconds</text>
  <text x="290" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#2E2A24">120°F</text>
  <text x="600" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#2E2A24">130°F</text>
  <text x="910" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#2E2A24">140°F</text>
  <text x="600" y="595" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24">Bars not to scale</text>
</svg>
