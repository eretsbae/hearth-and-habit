<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Night sky outside -->
  <rect x="0" y="0" width="420" height="630" fill="#2E2A24"/>
  <circle cx="90" cy="80" r="3" fill="#F6EFE6"/>
  <circle cx="150" cy="150" r="2" fill="#F6EFE6"/>
  <circle cx="60" cy="220" r="2.5" fill="#F6EFE6"/>
  <circle cx="200" cy="60" r="2" fill="#F6EFE6"/>
  <circle cx="250" cy="200" r="2.5" fill="#F6EFE6"/>
  <circle cx="330" cy="100" r="2" fill="#F6EFE6"/>
  <circle cx="110" cy="330" r="2" fill="#F6EFE6"/>
  <circle cx="300" cy="300" r="2.5" fill="#F6EFE6"/>
  <circle cx="350" cy="400" r="2" fill="#F6EFE6"/>
  <circle cx="60" cy="430" r="2" fill="#F6EFE6"/>

  <!-- moon -->
  <circle cx="340" cy="90" r="36" fill="#D9A441" opacity="0.85"/>

  <!-- snow ground outside -->
  <path d="M0 520 Q 100 490 210 515 Q 310 540 420 510 L420 630 L0 630 Z" fill="#F6EFE6" opacity="0.92"/>
  <circle cx="60" cy="560" r="6" fill="#F6EFE6"/>
  <circle cx="140" cy="580" r="5" fill="#F6EFE6"/>
  <circle cx="250" cy="555" r="7" fill="#F6EFE6"/>
  <circle cx="330" cy="590" r="5" fill="#F6EFE6"/>

  <!-- falling snow -->
  <circle cx="40" cy="120" r="3" fill="#F6EFE6"/>
  <circle cx="130" cy="250" r="3" fill="#F6EFE6"/>
  <circle cx="220" cy="340" r="3" fill="#F6EFE6"/>
  <circle cx="300" cy="180" r="2.5" fill="#F6EFE6"/>
  <circle cx="370" cy="260" r="3" fill="#F6EFE6"/>
  <circle cx="180" cy="420" r="2.5" fill="#F6EFE6"/>

  <!-- Exterior wall cutaway (brick terracotta) -->
  <rect x="420" y="0" width="90" height="630" fill="#B85C38"/>
  <rect x="430" y="20" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="20" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="60" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="60" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="100" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="100" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="140" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="140" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="440" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="440" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="480" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="480" width="30" height="16" fill="#9c4c2d"/>
  <rect x="430" y="520" width="30" height="16" fill="#9c4c2d"/>
  <rect x="470" y="520" width="30" height="16" fill="#9c4c2d"/>

  <!-- insulation cavity -->
  <rect x="510" y="0" width="40" height="630" fill="#E4C7B2"/>

  <!-- Interior wall warm -->
  <rect x="550" y="0" width="650" height="630" fill="#F6EFE6"/>

  <!-- interior warm wash near window -->
  <rect x="550" y="0" width="650" height="630" fill="#D9A441" opacity="0.08"/>

  <!-- Pipe running vertically through cavity -->
  <rect x="520" y="60" width="20" height="500" rx="10" fill="#5C6E58"/>
  <rect x="524" y="60" width="4" height="500" fill="#4a5a46"/>

  <!-- Pipe joints -->
  <rect x="512" y="150" width="36" height="18" rx="6" fill="#4a5a46"/>
  <rect x="512" y="380" width="36" height="18" rx="6" fill="#4a5a46"/>

  <!-- Ice crystals forming on pipe -->
  <g fill="#F6EFE6" opacity="0.95">
    <path d="M530 190 l6 10 l-12 0 Z"/>
    <path d="M530 210 l8 12 l-16 0 Z"/>
    <path d="M530 235 l10 14 l-20 0 Z"/>
    <path d="M530 260 l8 12 l-16 0 Z"/>
    <path d="M530 285 l6 9 l-12 0 Z"/>
  </g>
  <!-- crystal sparkle lines -->
  <g stroke="#F6EFE6" stroke-width="2" opacity="0.9">
    <line x1="505" y1="200" x2="555" y2="200"/>
    <line x1="530" y1="175" x2="530" y2="225"/>
    <line x1="510" y1="230" x2="550" y2="265"/>
    <line x1="550" y1="230" x2="510" y2="265"/>
    <line x1="505" y1="255" x2="555" y2="255"/>
  </g>

  <!-- frost patches on cavity near pipe -->
  <circle cx="520" cy="210" r="26" fill="#F6EFE6" opacity="0.35"/>
  <circle cx="540" cy="250" r="30" fill="#F6EFE6" opacity="0.3"/>
  <circle cx="515" cy="270" r="20" fill="#F6EFE6" opacity="0.3"/>

  <!-- Drip from pipe lower joint -->
  <circle cx="530" cy="420" r="5" fill="#5C6E58" opacity="0.7"/>
  <circle cx="530" cy="440" r="4" fill="#5C6E58" opacity="0.5"/>

  <!-- Interior room elements: warm lamp -->
  <rect x="650" y="430" width="14" height="90" fill="#2E2A24"/>
  <path d="M600 430 L700 430 L680 380 L620 380 Z" fill="#D9A441"/>
  <ellipse cx="657" cy="520" rx="40" ry="8" fill="#E4C7B2" opacity="0.5"/>
  <circle cx="657" cy="400" r="60" fill="#D9A441" opacity="0.15"/>

  <!-- small side table -->
  <rect x="610" y="520" width="90" height="10" fill="#5C6E58"/>
  <rect x="620" y="530" width="8" height="40" fill="#5C6E58"/>
  <rect x="682" y="530" width="8" height="40" fill="#5C6E58"/>

  <!-- Rug -->
  <ellipse cx="800" cy="580" rx="180" ry="24" fill="#E4C7B2" opacity="0.6"/>
  <ellipse cx="800" cy="580" rx="140" ry="16" fill="#B85C38" opacity="0.3"/>

  <!-- Armchair -->
  <rect x="850" y="440" width="120" height="100" rx="16" fill="#B85C38"/>
  <rect x="840" y="400" width="140" height="50" rx="20" fill="#B85C38"/>
  <rect x="830" y="440" width="24" height="90" rx="10" fill="#9c4c2d"/>
  <rect x="966" y="440" width="24" height="90" rx="10" fill="#9c4c2d"/>
  <rect x="856" y="520" width="18" height="40" fill="#2E2A24"/>
  <rect x="946" y="520" width="18" height="40" fill="#2E2A24"/>

  <!-- Throw pillow -->
  <circle cx="900" cy="440" r="26" fill="#5C6E58"/>

  <!-- hanging plant -->
  <line x1="1080" y1="0" x2="1080" y2="60" stroke="#2E2A24" stroke-width="3"/>
  <circle cx="1080" cy="90" r="26" fill="#5C6E58"/>
  <path d="M1080 70 q -20 20 -30 50" stroke="#5C6E58" stroke-width="5" fill="none"/>
  <path d="M1080 70 q 20 20 30 50" stroke="#5C6E58" stroke-width="5" fill="none"/>
  <rect x="1065" y="90" width="30" height="34" rx="6" fill="#E4C7B2"/>

  <!-- subtle floor baseboard line -->
  <line x1="550" y1="560" x2="1200" y2="560" stroke="#2E2A24" stroke-width="2" opacity="0.2"/>

  <!-- small frame on wall -->
  <rect x="1050" y="200" width="90" height="110" rx="4" fill="#5C6E58" opacity="0.15"/>
  <rect x="1065" y="215" width="60" height="80" rx="2" fill="#B85C38" opacity="0.25"/>
</svg>