<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="68" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">No Water at the Faucet?</text>
<rect x="290" y="98" width="620" height="56" rx="12" fill="#E4C7B2"/>
<circle cx="322" cy="126" r="18" fill="#B85C38"/><text x="322" y="134" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F6EFE6" text-anchor="middle">1</text>
<text x="620" y="135" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">One faucet trickles or is dry</text>
<line x1="600" y1="154" x2="600" y2="178" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="290" y="188" width="620" height="56" rx="12" fill="#E4C7B2"/>
<circle cx="322" cy="216" r="18" fill="#B85C38"/><text x="322" y="224" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F6EFE6" text-anchor="middle">2</text>
<text x="620" y="225" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Check the other faucets</text>
<line x1="600" y1="244" x2="600" y2="268" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="190" y="278" width="820" height="56" rx="12" fill="#E4C7B2"/>
<circle cx="222" cy="306" r="18" fill="#B85C38"/><text x="222" y="314" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F6EFE6" text-anchor="middle">3</text>
<text x="620" y="315" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#2E2A24" text-anchor="middle">Keep faucet open; shut main if a leak is possible</text>
<line x1="600" y1="334" x2="600" y2="358" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="230" y="368" width="740" height="56" rx="12" fill="#5C6E58"/>
<circle cx="262" cy="396" r="18" fill="#D9A441"/><text x="262" y="404" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2E2A24" text-anchor="middle">4</text>
<text x="620" y="405" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#F6EFE6" text-anchor="middle">Thaw from the faucet end toward the cold spot</text>
<line x1="380" y1="424" x2="300" y2="478" stroke="#B85C38" stroke-width="3" marker-end="url(#a)"/>
<line x1="820" y1="424" x2="900" y2="478" stroke="#2E2A24" stroke-width="3" marker-end="url(#a)"/>
<rect x="70" y="488" width="460" height="64" rx="12" fill="#F6EFE6" stroke="#B85C38" stroke-width="4"/>
<circle cx="108" cy="520" r="18" fill="#B85C38"/><path d="M98,510 L118,530 M118,510 L98,530" stroke="#F6EFE6" stroke-width="4"/>
<text x="318" y="529" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">No flame, no boiling water</text>
<rect x="590" y="488" width="540" height="64" rx="12" fill="#D9A441"/>
<text x="860" y="529" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#2E2A24" text-anchor="middle">Can't find or reach it? Call a plumber</text>
</svg>