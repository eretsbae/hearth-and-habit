<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- ground line -->
  <rect x="0" y="560" width="1200" height="70" fill="#E4C7B2" opacity="0.4"/>

  <!-- cool basement wall block -->
  <rect x="120" y="140" width="260" height="420" fill="#5C6E58"/>
  <rect x="120" y="140" width="260" height="420" fill="#2E2A24" opacity="0.08"/>

  <!-- wall bricks pattern -->
  <g fill="#2E2A24" opacity="0.12">
    <rect x="130" y="170" width="100" height="20"/>
    <rect x="250" y="170" width="100" height="20"/>
    <rect x="180" y="210" width="100" height="20"/>
    <rect x="130" y="250" width="100" height="20"/>
    <rect x="250" y="250" width="100" height="20"/>
    <rect x="180" y="290" width="100" height="20"/>
    <rect x="130" y="330" width="100" height="20"/>
    <rect x="250" y="330" width="100" height="20"/>
    <rect x="180" y="370" width="100" height="20"/>
    <rect x="130" y="410" width="100" height="20"/>
    <rect x="250" y="410" width="100" height="20"/>
    <rect x="180" y="450" width="100" height="20"/>
    <rect x="130" y="490" width="100" height="20"/>
    <rect x="250" y="490" width="100" height="20"/>
  </g>

  <!-- cool label icon: snowflake-ish simple sage circle with lines -->
  <g transform="translate(250,110)">
    <circle cx="0" cy="0" r="26" fill="#5C6E58"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#F6EFE6" stroke-width="4"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#F6EFE6" stroke-width="4"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#F6EFE6" stroke-width="4"/>
    <line x1="-11" y1="11" x2="11" y2="-11" stroke="#F6EFE6" stroke-width="4"/>
  </g>

  <!-- warm humid air cloud on right -->
  <g transform="translate(760,220)">
    <circle cx="0" cy="0" r="55" fill="#D9A441" opacity="0.85"/>
    <circle cx="70" cy="20" r="70" fill="#D9A441" opacity="0.85"/>
    <circle cx="150" cy="0" r="50" fill="#D9A441" opacity="0.85"/>
    <circle cx="40" cy="-40" r="45" fill="#D9A441" opacity="0.85"/>
  </g>

  <!-- sun icon: warm label -->
  <g transform="translate(880,110)">
    <circle cx="0" cy="0" r="26" fill="#B85C38"/>
    <g stroke="#B85C38" stroke-width="5">
      <line x1="0" y1="-38" x2="0" y2="-46"/>
      <line x1="0" y1="38" x2="0" y2="46"/>
      <line x1="-38" y1="0" x2="-46" y2="0"/>
      <line x1="38" y1="0" x2="46" y2="0"/>
      <line x1="-27" y1="-27" x2="-33" y2="-33"/>
      <line x1="27" y1="27" x2="33" y2="33"/>
      <line x1="-27" y1="27" x2="-33" y2="33"/>
      <line x1="27" y1="-27" x2="33" y2="-33"/>
    </g>
  </g>

  <!-- arrows showing airflow from warm humid air toward wall -->
  <g fill="none" stroke="#B85C38" stroke-width="6" stroke-linecap="round">
    <path d="M 760 300 Q 620 320 460 320" marker-end="url(#arrow1)"/>
    <path d="M 800 380 Q 640 400 460 390" marker-end="url(#arrow1)"/>
    <path d="M 780 460 Q 620 470 460 450" marker-end="url(#arrow1)"/>
  </g>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B85C38"/>
    </marker>
  </defs>

  <!-- condensation droplets forming on wall surface -->
  <g fill="#5C6E58">
    <path d="M400 250 C 400 235, 415 235, 415 250 C 415 260, 405 262, 400 250 Z" fill="#D9A441" opacity="0.9"/>
  </g>
  <g fill="#D9A441" opacity="0.85">
    <path d="M395 320 C 395 305, 410 305, 410 320 C 410 331, 398 332, 395 320 Z"/>
    <path d="M400 400 C 400 385, 415 385, 415 400 C 415 411, 403 412, 400 400 Z"/>
    <path d="M390 470 C 390 455, 405 455, 405 470 C 405 481, 393 482, 390 470 Z"/>
    <path d="M405 200 C 405 188, 417 188, 417 200 C 417 209, 407 210, 405 200 Z"/>
    <path d="M395 350 C 395 340, 404 340, 404 350 C 404 358, 397 359, 395 350 Z"/>
    <path d="M400 430 C 400 420, 409 420, 409 430 C 409 438, 402 439, 400 430 Z"/>
  </g>

  <!-- small droplets trailing down (running condensation) -->
  <g fill="#5C6E58" opacity="0.6">
    <circle cx="404" cy="275" r="5"/>
    <circle cx="408" cy="345" r="4"/>
    <circle cx="398" cy="420" r="5"/>
    <circle cx="402" cy="495" r="4"/>
  </g>

  <!-- floor puddle hint -->
  <ellipse cx="230" cy="565" rx="90" ry="10" fill="#5C6E58" opacity="0.25"/>

  <!-- musty smell squiggles rising near floor -->
  <g fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M270 540 Q 280 520 270 500 Q 260 480 270 460"/>
    <path d="M310 550 Q 320 530 310 510 Q 300 490 310 470"/>
  </g>

  <!-- vertical divider suggestion (subtle) -->
  <line x1="450" y1="140" x2="450" y2="560" stroke="#2E2A24" stroke-width="2" opacity="0.08"/>

</svg>