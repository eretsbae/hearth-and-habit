<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Window on right side -->
  <g>
    <rect x="760" y="60" width="360" height="470" rx="12" fill="#E4C7B2"/>
    <rect x="785" y="90" width="310" height="410" rx="6" fill="#D9A441" opacity="0.25"/>
    <!-- window panes -->
    <rect x="790" y="95" width="145" height="195" fill="#B85C38" opacity="0.15"/>
    <rect x="945" y="95" width="145" height="195" fill="#B85C38" opacity="0.15"/>
    <rect x="790" y="300" width="145" height="195" fill="#B85C38" opacity="0.15"/>
    <rect x="945" y="300" width="145" height="195" fill="#B85C38" opacity="0.15"/>
    <rect x="925" y="90" width="10" height="410" fill="#E4C7B2"/>
    <rect x="785" y="285" width="310" height="10" fill="#E4C7B2"/>

    <!-- humidity droplets on glass -->
    <ellipse cx="830" cy="150" rx="8" ry="12" fill="#5C6E58" opacity="0.35"/>
    <ellipse cx="880" cy="220" rx="6" ry="9" fill="#5C6E58" opacity="0.3"/>
    <ellipse cx="1000" cy="180" rx="7" ry="10" fill="#5C6E58" opacity="0.3"/>
    <ellipse cx="1040" cy="260" rx="5" ry="8" fill="#5C6E58" opacity="0.25"/>
    <ellipse cx="820" cy="360" rx="6" ry="9" fill="#5C6E58" opacity="0.3"/>
    <ellipse cx="990" cy="400" rx="8" ry="11" fill="#5C6E58" opacity="0.3"/>
    <ellipse cx="1050" cy="440" rx="6" ry="9" fill="#5C6E58" opacity="0.25"/>

    <!-- steamy haze at bottom of window -->
    <rect x="785" y="450" width="310" height="50" fill="#F6EFE6" opacity="0.35"/>
  </g>

  <!-- Bread box -->
  <g>
    <path d="M60 380 h430 a20 20 0 0 1 20 20 v150 a10 10 0 0 1 -10 10 h-450 a10 10 0 0 1 -10 -10 v-150 a20 20 0 0 1 20 -20 z" fill="#5C6E58"/>
    <path d="M60 380 h430 a20 20 0 0 1 20 20 v20 h-470 v-20 a20 20 0 0 1 20 -20 z" fill="#4A5A46"/>
    <!-- box lid curve highlight -->
    <path d="M100 380 q150 -70 310 0 z" fill="#4A5A46"/>
    <!-- handle -->
    <rect x="255" y="392" width="60" height="12" rx="6" fill="#D9A441"/>
    <!-- feet -->
    <rect x="90" y="558" width="18" height="16" rx="4" fill="#2E2A24"/>
    <rect x="462" y="558" width="18" height="16" rx="4" fill="#2E2A24"/>
  </g>

  <!-- Loaf of bread sitting beside box -->
  <g>
    <path d="M540 470 q0 -70 90 -70 h60 q90 0 90 70 v70 a10 10 0 0 1 -10 10 h-220 a10 10 0 0 1 -10 -10 z" fill="#D9A441"/>
    <path d="M540 470 q0 -70 90 -70 h60 q90 0 90 70" fill="none" stroke="#B85C38" stroke-width="4" opacity="0.4"/>
    <!-- bread slashes -->
    <path d="M580 405 q10 -20 20 0" stroke="#B85C38" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M620 400 q10 -22 20 0" stroke="#B85C38" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M660 405 q10 -20 20 0" stroke="#B85C38" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- little mold spots directly on loaf, subtle -->
    <circle cx="600" cy="460" r="5" fill="#5C6E58" opacity="0.6"/>
    <circle cx="612" cy="468" r="3" fill="#5C6E58" opacity="0.5"/>
    <circle cx="590" cy="470" r="2.5" fill="#2E2A24" opacity="0.4"/>
  </g>

  <!-- Magnifying glass over mold patch -->
  <g>
    <circle cx="640" cy="440" r="95" fill="#F6EFE6" stroke="#2E2A24" stroke-width="8"/>
    <!-- handle -->
    <rect x="705" y="505" width="28" height="120" rx="14" fill="#2E2A24" transform="rotate(40 705 505)"/>

    <!-- zoomed bread crumb texture inside lens -->
    <circle cx="640" cy="440" r="88" fill="#E4C7B2"/>
    <circle cx="600" cy="410" r="10" fill="#D9A441" opacity="0.5"/>
    <circle cx="670" cy="400" r="8" fill="#D9A441" opacity="0.5"/>
    <circle cx="690" cy="460" r="9" fill="#D9A441" opacity="0.5"/>
    <circle cx="610" cy="470" r="7" fill="#D9A441" opacity="0.4"/>

    <!-- mold spots magnified -->
    <circle cx="625" cy="425" r="16" fill="#5C6E58"/>
    <circle cx="625" cy="425" r="16" fill="#5C6E58" opacity="0.6"/>
    <circle cx="618" cy="418" r="4" fill="#2E2A24" opacity="0.7"/>
    <circle cx="632" cy="430" r="3" fill="#2E2A24" opacity="0.7"/>
    <circle cx="622" cy="432" r="3" fill="#2E2A24" opacity="0.6"/>

    <circle cx="665" cy="450" r="12" fill="#5C6E58" opacity="0.7"/>
    <circle cx="670" cy="455" r="3" fill="#2E2A24" opacity="0.7"/>
    <circle cx="660" cy="446" r="2.5" fill="#2E2A24" opacity="0.6"/>

    <circle cx="655" cy="410" r="7" fill="#5C6E58" opacity="0.55"/>
    <circle cx="600" cy="465" r="6" fill="#5C6E58" opacity="0.5"/>

    <!-- lens shine -->
    <path d="M570 380 a80 80 0 0 1 40 -40" stroke="#F6EFE6" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- floor line -->
  <rect x="0" y="574" width="1200" height="6" fill="#2E2A24" opacity="0.08"/>
</svg>