<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Decorative arch backdrop for each scene -->
  <g>
    <!-- Left arch (countertop, best) -->
    <path d="M80 480 L80 260 Q80 140 200 140 Q320 140 320 260 L320 480 Z" fill="#E4C7B2"/>
    <!-- Middle arch (fridge, ok) -->
    <path d="M440 480 L440 260 Q440 140 560 140 Q680 140 680 260 L680 480 Z" fill="#E4C7B2" opacity="0.7"/>
    <!-- Right arch (freezer, ok long-term) -->
    <path d="M800 480 L800 260 Q800 140 920 140 Q1040 140 1040 260 L1040 480 Z" fill="#E4C7B2" opacity="0.5"/>
  </g>

  <!-- Ground line -->
  <rect x="60" y="480" width="1080" height="8" fill="#5C6E58" opacity="0.3"/>

  <!-- ================= COUNTERTOP SCENE ================= -->
  <g>
    <!-- Sun -->
    <circle cx="200" cy="185" r="34" fill="#D9A441"/>
    <g stroke="#D9A441" stroke-width="6" stroke-linecap="round">
      <line x1="200" y1="130" x2="200" y2="115"/>
      <line x1="200" y1="255" x2="200" y2="240"/>
      <line x1="245" y1="185" x2="260" y2="185"/>
      <line x1="140" y1="185" x2="155" y2="185"/>
      <line x1="232" y1="153" x2="243" y2="142"/>
      <line x1="157" y1="228" x2="168" y2="217"/>
      <line x1="232" y1="217" x2="243" y2="228"/>
      <line x1="157" y1="142" x2="168" y2="153"/>
    </g>

    <!-- Bread box -->
    <g>
      <rect x="130" y="360" width="140" height="90" rx="14" fill="#B85C38"/>
      <path d="M130 360 Q200 320 270 360 L270 380 Q200 350 130 380 Z" fill="#B85C38"/>
      <rect x="185" y="330" width="30" height="14" rx="6" fill="#B85C38"/>
      <circle cx="200" cy="400" r="6" fill="#F6EFE6"/>
    </g>

    <!-- Bread loaf peeking -->
    <g>
      <ellipse cx="200" cy="330" rx="46" ry="26" fill="#D9A441"/>
      <path d="M164 330 Q200 300 236 330" fill="none" stroke="#2E2A24" stroke-width="3" stroke-linecap="round"/>
      <path d="M172 322 Q200 300 228 322" fill="none" stroke="#2E2A24" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= FRIDGE SCENE ================= -->
  <g>
    <!-- Humidity droplets -->
    <g fill="#5C6E58">
      <path d="M540 175 Q550 195 540 205 Q530 195 540 175 Z"/>
      <path d="M580 160 Q590 180 580 190 Q570 180 580 160 Z"/>
      <path d="M615 185 Q625 205 615 215 Q605 205 615 185 Z"/>
    </g>

    <!-- Fridge body -->
    <g>
      <rect x="500" y="290" width="120" height="170" rx="10" fill="#5C6E58"/>
      <rect x="500" y="290" width="120" height="60" rx="10" fill="#5C6E58"/>
      <line x1="500" y1="350" x2="620" y2="350" stroke="#2E2A24" stroke-width="3"/>
      <rect x="510" y="305" width="8" height="24" rx="3" fill="#F6EFE6"/>
      <rect x="510" y="365" width="8" height="60" rx="3" fill="#F6EFE6"/>
    </g>

    <!-- Bread loaf wrapped -->
    <g>
      <ellipse cx="560" cy="270" rx="40" ry="22" fill="#E4C7B2"/>
      <path d="M528 270 Q560 250 592 270" fill="none" stroke="#2E2A24" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M535 262 Q560 248 585 262" fill="none" stroke="#2E2A24" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= FREEZER SCENE ================= -->
  <g>
    <!-- Snowflake -->
    <g stroke="#5C6E58" stroke-width="5" stroke-linecap="round">
      <line x1="920" y1="150" x2="920" y2="200"/>
      <line x1="896" y1="175" x2="944" y2="175"/>
      <line x1="903" y1="158" x2="937" y2="192"/>
      <line x1="937" y1="158" x2="903" y2="192"/>
    </g>

    <!-- Freezer body -->
    <g>
      <rect x="860" y="290" width="120" height="170" rx="10" fill="#2E2A24" opacity="0.85"/>
      <rect x="860" y="290" width="120" height="170" rx="10" fill="#5C6E58" opacity="0.3"/>
      <rect x="880" y="330" width="80" height="8" rx="4" fill="#F6EFE6" opacity="0.7"/>
      <rect x="880" y="360" width="80" height="8" rx="4" fill="#F6EFE6" opacity="0.7"/>
      <circle cx="960" cy="400" r="6" fill="#F6EFE6"/>
    </g>

    <!-- Bread loaf frosty -->
    <g>
      <ellipse cx="920" cy="270" rx="40" ry="22" fill="#F6EFE6"/>
      <path d="M888 270 Q920 250 952 270" fill="none" stroke="#2E2A24" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M895 262 Q920 248 945 262" fill="none" stroke="#2E2A24" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="900" cy="258" r="3" fill="#5C6E58"/>
      <circle cx="940" cy="260" r="3" fill="#5C6E58"/>
      <circle cx="920" cy="250" r="3" fill="#5C6E58"/>
    </g>
  </g>

  <!-- Small mold spots hint on countertop loaf leftover crumbs (subtle storytelling) -->
  <g>
    <circle cx="360" cy="500" r="5" fill="#5C6E58" opacity="0.4"/>
    <circle cx="378" cy="510" r="4" fill="#5C6E58" opacity="0.3"/>
  </g>

  <!-- Decorative bottom row icons repeating theme softly -->
  <g opacity="0.5">
    <circle cx="200" cy="560" r="10" fill="#D9A441"/>
    <path d="M545 555 Q555 575 545 585 Q535 575 545 555 Z" fill="#5C6E58"/>
    <g stroke="#5C6E58" stroke-width="3" stroke-linecap="round">
      <line x1="920" y1="545" x2="920" y2="575"/>
      <line x1="905" y1="560" x2="935" y2="560"/>
    </g>
  </g>
</svg>