<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>
  <text x="600" y="70" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2E2A24" text-anchor="middle">Why the glass fogs by morning</text>
  <!-- outdoor side -->
  <rect x="60" y="110" width="300" height="430" rx="10" fill="#5C6E58" opacity="0.25"/>
  <text x="210" y="160" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">Cold night outside</text>
  <!-- window frame and panes -->
  <rect x="380" y="110" width="110" height="430" fill="#E4C7B2" stroke="#2E2A24" stroke-width="4"/>
  <rect x="398" y="125" width="22" height="400" fill="#FFFFFF" opacity="0.7"/>
  <rect x="450" y="125" width="22" height="400" fill="#FFFFFF" opacity="0.7"/>
  <!-- droplets concentrated at bottom -->
  <circle cx="482" cy="470" r="6" fill="#5C6E58"/>
  <circle cx="482" cy="492" r="7" fill="#5C6E58"/>
  <circle cx="482" cy="512" r="8" fill="#5C6E58"/>
  <circle cx="482" cy="440" r="5" fill="#5C6E58"/>
  <!-- sill -->
  <rect x="370" y="540" width="200" height="22" fill="#B85C38"/>
  <!-- blind -->
  <rect x="520" y="110" width="16" height="400" fill="#D9A441"/>
  <!-- warm moist air arrows -->
  <path d="M 900 300 L 600 300" stroke="#B85C38" stroke-width="8" fill="none"/>
  <polygon points="590,300 615,286 615,314" fill="#B85C38"/>
  <path d="M 900 400 L 600 400" stroke="#B85C38" stroke-width="8" fill="none"/>
  <polygon points="590,400 615,386 615,414" fill="#B85C38"/>
  <text x="900" y="250" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24" text-anchor="middle">Warm, moist room air</text>
  <!-- callouts -->
  <line x1="490" y1="500" x2="640" y2="500" stroke="#2E2A24" stroke-width="2"/>
  <text x="650" y="510" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Bottom edge is coldest</text>
  <text x="650" y="200" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">Coverings change air flow</text>
  <line x1="545" y1="190" x2="640" y2="190" stroke="#2E2A24" stroke-width="2"/>
  <text x="600" y="600" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Glass below dew point = condensation</text>
</svg>
