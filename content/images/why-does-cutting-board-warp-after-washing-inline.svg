<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Divider line -->
  <line x1="600" y1="90" x2="600" y2="540" stroke="#E4C7B2" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- LEFT SCENE: cutting board upright in dish rack -->
  <g>
    <!-- shadow -->
    <ellipse cx="300" cy="500" rx="180" ry="20" fill="#E4C7B2" opacity="0.5"/>

    <!-- dish rack base -->
    <rect x="150" y="470" width="300" height="14" rx="7" fill="#5C6E58"/>
    <g stroke="#5C6E58" stroke-width="8" stroke-linecap="round">
      <line x1="175" y1="470" x2="175" y2="430"/>
      <line x1="215" y1="470" x2="215" y2="415"/>
      <line x1="255" y1="470" x2="255" y2="400"/>
      <line x1="300" y1="470" x2="300" y2="390"/>
      <line x1="345" y1="470" x2="345" y2="400"/>
      <line x1="385" y1="470" x2="385" y2="415"/>
      <line x1="425" y1="470" x2="425" y2="430"/>
    </g>
    <rect x="140" y="484" width="320" height="10" rx="5" fill="#2E2A24" opacity="0.15"/>

    <!-- cutting board upright, leaning slightly -->
    <g transform="translate(300,265) rotate(-4)">
      <rect x="-45" y="-165" width="90" height="255" rx="14" fill="#D9A441"/>
      <rect x="-45" y="-165" width="90" height="255" rx="14" fill="none" stroke="#B85C38" stroke-width="3" opacity="0.4"/>
      <circle cx="0" cy="-135" r="8" fill="#F6EFE6"/>
      <!-- wood grain lines -->
      <line x1="-30" y1="-100" x2="30" y2="-100" stroke="#B85C38" stroke-width="3" opacity="0.35"/>
      <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#B85C38" stroke-width="3" opacity="0.35"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#B85C38" stroke-width="3" opacity="0.35"/>
      <line x1="-30" y1="50" x2="30" y2="50" stroke="#B85C38" stroke-width="3" opacity="0.3"/>
    </g>

    <!-- droplets falling evenly from both edges -->
    <g fill="#5C6E58" opacity="0.6">
      <ellipse cx="255" cy="440" rx="4" ry="6"/>
      <ellipse cx="345" cy="445" rx="4" ry="6"/>
      <ellipse cx="270" cy="460" rx="3" ry="5"/>
      <ellipse cx="335" cy="463" rx="3" ry="5"/>
    </g>

    <!-- small sun/checkmark motif suggesting even drying -->
    <g transform="translate(300,120)">
      <circle r="26" fill="#D9A441" opacity="0.25"/>
      <path d="M-10,0 L-3,8 L12,-10" stroke="#5C6E58" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- RIGHT SCENE: cutting board flat with pooled water -->
  <g>
    <!-- shadow -->
    <ellipse cx="900" cy="500" rx="200" ry="22" fill="#E4C7B2" opacity="0.5"/>

    <!-- counter surface -->
    <rect x="720" y="470" width="360" height="16" rx="6" fill="#E4C7B2"/>

    <!-- pooled water underneath -->
    <ellipse cx="900" cy="462" rx="150" ry="18" fill="#A9C2B8" opacity="0.55"/>
    <ellipse cx="900" cy="458" rx="120" ry="12" fill="#A9C2B8" opacity="0.5"/>

    <!-- cutting board lying flat, slightly warped -->
    <g transform="translate(900,440)">
      <path d="M-160,10 
               Q -100,-18 0,-6 
               Q 100,4 160,-8 
               L 160,14 
               Q 100,26 0,16 
               Q -100,4 -160,30 
               Z" 
            fill="#D9A441"/>
      <path d="M-160,10 
               Q -100,-18 0,-6 
               Q 100,4 160,-8" 
            fill="none" stroke="#B85C38" stroke-width="3" opacity="0.4"/>
      <circle cx="120" cy="-2" r="7" fill="#F6EFE6"/>
      <!-- grain lines curved to match warp -->
      <path d="M-130,4 Q0,-6 130,-2" stroke="#B85C38" stroke-width="3" fill="none" opacity="0.3"/>
      <path d="M-130,18 Q0,8 130,12" stroke="#B85C38" stroke-width="3" fill="none" opacity="0.3"/>
    </g>

    <!-- warning motif: warped wave icon -->
    <g transform="translate(900,130)">
      <circle r="26" fill="#B85C38" opacity="0.2"/>
      <path d="M-14,4 Q-7,-8 0,4 Q7,16 14,4" stroke="#B85C38" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- subtle ground line -->
  <line x1="60" y1="530" x2="1140" y2="530" stroke="#E4C7B2" stroke-width="2" opacity="0.6"/>
</svg>