<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="80" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Same wash, different drying</text>
<rect x="60" y="120" width="500" height="460" rx="16" fill="#5C6E58" opacity="0.15"/>
<rect x="640" y="120" width="500" height="460" rx="16" fill="#B85C38" opacity="0.15"/>
<rect x="290" y="170" width="40" height="250" rx="6" fill="#D9A441"/>
<rect x="240" y="420" width="140" height="16" rx="4" fill="#5C6E58"/>
<path d="M200 230 L270 230 M200 300 L270 300 M350 230 L420 230 M350 300 L420 300" stroke="#5C6E58" stroke-width="6" stroke-linecap="round"/>
<path d="M262 222 L272 230 L262 238 M262 292 L272 300 L262 308 M358 222 L348 230 L358 238 M358 292 L348 300 L358 308" stroke="#5C6E58" stroke-width="5" fill="none"/>
<rect x="700" y="380" width="380" height="50" rx="4" fill="#E4C7B2" stroke="#2E2A24" stroke-width="2"/>
<path d="M740 380 Q890 320 1040 380 L1040 362 Q890 302 740 362 Z" fill="#D9A441"/>
<rect x="770" y="372" width="240" height="8" rx="3" fill="#B85C38"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24" text-anchor="middle">
<text x="310" y="500" font-size="30">On edge:</text>
<text x="310" y="540" font-size="30">both faces dry</text>
<text x="890" y="500" font-size="30">Flat on stone:</text>
<text x="890" y="540" font-size="30">bottom stays damp</text>
<text x="890" y="230" font-size="26">One face swells,</text>
<text x="890" y="266" font-size="26">board bows</text>
</g>
</svg>
