<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- ground shadow -->
  <ellipse cx="600" cy="560" rx="480" ry="30" fill="#E4C7B2" opacity="0.4"/>

  <!-- dishwasher body -->
  <rect x="330" y="80" width="360" height="440" rx="10" fill="#5C6E58"/>
  <rect x="345" y="95" width="330" height="60" rx="6" fill="#E4C7B2"/>
  <circle cx="360" cy="125" r="8" fill="#2E2A24"/>

  <!-- open door -->
  <g>
    <rect x="330" y="440" width="360" height="150" rx="8" fill="#B85C38"/>
    <rect x="350" y="460" width="320" height="110" rx="4" fill="#E4C7B2"/>
    <rect x="480" y="470" width="60" height="10" rx="4" fill="#2E2A24"/>
  </g>

  <!-- bottom rack -->
  <g stroke="#D9A441" stroke-width="4">
    <line x1="360" y1="510" x2="660" y2="510"/>
    <line x1="360" y1="530" x2="660" y2="530"/>
    <line x1="360" y1="550" x2="660" y2="550"/>
    <line x1="380" y1="500" x2="380" y2="560"/>
    <line x1="430" y1="500" x2="430" y2="560"/>
    <line x1="480" y1="500" x2="480" y2="560"/>
    <line x1="530" y1="500" x2="530" y2="560"/>
    <line x1="580" y1="500" x2="580" y2="560"/>
    <line x1="630" y1="500" x2="630" y2="560"/>
  </g>

  <!-- interior dark space above rack -->
  <rect x="350" y="180" width="320" height="250" fill="#2E2A24" opacity="0.08"/>

  <!-- wavy odor lines rising -->
  <g fill="none" stroke="#5C6E58" stroke-width="8" stroke-linecap="round" opacity="0.75">
    <path d="M470 480 Q450 430 480 400 Q510 370 480 330 Q450 290 480 250"/>
    <path d="M540 480 Q560 430 530 400 Q500 370 530 330 Q560 290 530 250"/>
    <path d="M600 480 Q580 430 610 400 Q640 370 610 330 Q580 290 610 250"/>
  </g>

  <!-- scrub brush left of dishwasher -->
  <g transform="translate(150,380)">
    <rect x="0" y="0" width="26" height="140" rx="12" fill="#D9A441"/>
    <rect x="-20" y="130" width="66" height="46" rx="10" fill="#B85C38"/>
    <g stroke="#2E2A24" stroke-width="4">
      <line x1="-14" y1="145" x2="-14" y2="170"/>
      <line x1="-2" y1="145" x2="-2" y2="170"/>
      <line x1="10" y1="145" x2="10" y2="170"/>
      <line x1="22" y1="145" x2="22" y2="170"/>
      <line x1="34" y1="145" x2="34" y2="170"/>
    </g>
  </g>

  <!-- vinegar bottle -->
  <g transform="translate(830,330)">
    <rect x="0" y="60" width="90" height="190" rx="14" fill="#D9A441"/>
    <rect x="25" y="20" width="40" height="50" fill="#D9A441"/>
    <rect x="15" y="0" width="60" height="25" rx="6" fill="#5C6E58"/>
    <rect x="10" y="140" width="70" height="70" rx="6" fill="#F6EFE6" opacity="0.85"/>
    <ellipse cx="45" cy="175" rx="22" ry="14" fill="#B85C38" opacity="0.6"/>
  </g>

  <!-- small bowl of baking soda -->
  <g transform="translate(970,470)">
    <path d="M0 0 Q60 60 120 0 L120 20 Q60 90 0 20 Z" fill="#5C6E58"/>
    <ellipse cx="60" cy="-4" rx="60" ry="18" fill="#F6EFE6"/>
    <ellipse cx="60" cy="-8" rx="42" ry="10" fill="#E4C7B2"/>
  </g>

  <!-- small decorative dots -->
  <circle cx="250" cy="150" r="6" fill="#D9A441"/>
  <circle cx="280" cy="120" r="4" fill="#B85C38"/>
  <circle cx="1050" cy="150" r="6" fill="#B85C38"/>
  <circle cx="1010" cy="120" r="4" fill="#D9A441"/>
</svg>