<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Outer dishwasher cutaway frame -->
  <rect x="120" y="90" width="960" height="460" rx="18" fill="#E4C7B2"/>
  <rect x="150" y="118" width="900" height="404" rx="14" fill="#F6EFE6"/>

  <!-- Door gasket zone: rubber seal ring around inner perimeter -->
  <rect x="160" y="128" width="880" height="384" rx="12" fill="none" stroke="#5C6E58" stroke-width="14"/>
  <rect x="160" y="128" width="880" height="384" rx="12" fill="none" stroke="#3E4A3B" stroke-width="4" stroke-dasharray="2 22"/>

  <!-- inner floor of tub -->
  <rect x="185" y="150" width="830" height="345" rx="8" fill="#F1E7DA"/>

  <!-- subtle floor panel lines for depth -->
  <line x1="185" y1="230" x2="1015" y2="230" stroke="#E4C7B2" stroke-width="3"/>
  <line x1="185" y1="310" x2="1015" y2="310" stroke="#E4C7B2" stroke-width="3"/>

  <!-- Drain area zone: circular recessed basin lower right -->
  <g>
    <circle cx="800" cy="420" r="95" fill="#E4C7B2"/>
    <circle cx="800" cy="420" r="75" fill="#D9A441" opacity="0.35"/>
    <circle cx="800" cy="420" r="55" fill="#2E2A24"/>
    <circle cx="800" cy="420" r="55" fill="none" stroke="#B85C38" stroke-width="4"/>
    <!-- drain grate lines -->
    <line x1="800" y1="375" x2="800" y2="465" stroke="#5C6E58" stroke-width="5"/>
    <line x1="765" y1="390" x2="835" y2="450" stroke="#5C6E58" stroke-width="5"/>
    <line x1="765" y1="450" x2="835" y2="390" stroke="#5C6E58" stroke-width="5"/>
    <circle cx="800" cy="420" r="8" fill="#5C6E58"/>
  </g>

  <!-- soft grime/smell suggestion swirl near drain, subtle -->
  <g opacity="0.5">
    <circle cx="855" cy="470" r="6" fill="#B85C38"/>
    <circle cx="875" cy="450" r="4" fill="#B85C38"/>
    <circle cx="890" cy="480" r="5" fill="#B85C38"/>
  </g>

  <!-- Filter basket zone: circular mesh basket lower center-left -->
  <g>
    <circle cx="470" cy="400" r="120" fill="#E4C7B2"/>
    <circle cx="470" cy="400" r="100" fill="#F6EFE6"/>
    <circle cx="470" cy="400" r="100" fill="none" stroke="#B85C38" stroke-width="6"/>

    <!-- mesh grid pattern -->
    <g stroke="#5C6E58" stroke-width="3">
      <line x1="390" y1="330" x2="550" y2="470"/>
      <line x1="410" y1="315" x2="530" y2="485"/>
      <line x1="430" y1="305" x2="510" y2="495"/>
      <line x1="450" y1="300" x2="490" y2="500"/>
      <line x1="550" y1="330" x2="390" y2="470"/>
      <line x1="530" y1="315" x2="410" y2="485"/>
      <line x1="510" y1="305" x2="430" y2="495"/>
      <line x1="490" y1="300" x2="450" y2="500"/>
    </g>

    <!-- basket rim handle -->
    <rect x="440" y="290" width="60" height="16" rx="8" fill="#5C6E58"/>
    <circle cx="470" cy="400" r="100" fill="none" stroke="#2E2A24" stroke-width="2" opacity="0.3"/>

    <!-- food debris flecks trapped in filter, subtle -->
    <circle cx="440" cy="380" r="5" fill="#D9A441" opacity="0.7"/>
    <circle cx="500" cy="420" r="4" fill="#B85C38" opacity="0.6"/>
    <circle cx="480" cy="360" r="3" fill="#5C6E58" opacity="0.6"/>
    <circle cx="450" cy="440" r="4" fill="#D9A441" opacity="0.6"/>
  </g>

  <!-- Spray arm suggestion top area, minimal geometric -->
  <g opacity="0.9">
    <circle cx="600" cy="185" r="14" fill="#5C6E58"/>
    <rect x="596" y="185" width="8" height="170" fill="#5C6E58" opacity="0.5"/>
    <rect x="470" y="181" width="260" height="8" rx="4" fill="#5C6E58" opacity="0.5"/>
    <circle cx="470" cy="185" r="7" fill="#5C6E58"/>
    <circle cx="730" cy="185" r="7" fill="#5C6E58"/>
  </g>

  <!-- gasket corner accents to emphasize "zone" feeling -->
  <circle cx="160" cy="128" r="10" fill="#5C6E58"/>
  <circle cx="1040" cy="128" r="10" fill="#5C6E58"/>
  <circle cx="160" cy="512" r="10" fill="#5C6E58"/>
  <circle cx="1040" cy="512" r="10" fill="#5C6E58"/>

  <!-- small decorative dividing marks to imply distinct labeled zones -->
  <circle cx="470" cy="290" r="6" fill="#B85C38"/>
  <circle cx="800" cy="335" r="6" fill="#D9A441"/>
  <circle cx="600" cy="140" r="6" fill="#5C6E58"/>
</svg>