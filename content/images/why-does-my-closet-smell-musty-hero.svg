<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Closet frame -->
  <rect x="220" y="70" width="760" height="500" fill="#E4C7B2" opacity="0.4"/>
  <rect x="220" y="70" width="760" height="60" fill="#5C6E58"/>
  <rect x="220" y="70" width="760" height="500" fill="none" stroke="#2E2A24" stroke-width="6"/>

  <!-- Interior back wall -->
  <rect x="226" y="130" width="748" height="434" fill="#F6EFE6"/>

  <!-- Closet rod -->
  <rect x="260" y="180" width="680" height="10" rx="5" fill="#2E2A24"/>
  <circle cx="260" cy="185" r="10" fill="#2E2A24"/>
  <circle cx="940" cy="185" r="10" fill="#2E2A24"/>

  <!-- Hangers and clothes -->
  <g>
    <!-- shirt 1 -->
    <path d="M320 190 v10 l-40 20 v130 h80 v-130 l-40 -20" fill="#B85C38"/>
    <circle cx="320" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- dress -->
    <path d="M430 190 v10 l-45 25 40 150 h10 l40 -150 -45 -25" fill="#D9A441"/>
    <circle cx="430" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- shirt 2 -->
    <path d="M560 190 v10 l-38 18 v120 h76 v-120 l-38 -18" fill="#5C6E58"/>
    <circle cx="560" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- sweater -->
    <path d="M680 190 v10 l-42 22 v140 h84 v-140 l-42 -22" fill="#E4C7B2"/>
    <circle cx="680" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- coat -->
    <path d="M810 190 v10 l-48 26 v160 h96 v-160 l-48 -26" fill="#B85C38"/>
    <circle cx="810" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- shirt 3 -->
    <path d="M900 190 v10 l-36 18 v110 h72 v-110 l-36 -18" fill="#D9A441"/>
    <circle cx="900" cy="192" r="7" fill="none" stroke="#2E2A24" stroke-width="4"/>
  </g>

  <!-- Shelf below clothes -->
  <rect x="240" y="470" width="720" height="14" fill="#5C6E58"/>

  <!-- Dehumidifier box -->
  <g>
    <rect x="700" y="484" width="90" height="70" rx="6" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
    <rect x="712" y="498" width="66" height="14" rx="3" fill="#5C6E58"/>
    <circle cx="722" cy="530" r="6" fill="#B85C38"/>
    <circle cx="745" cy="530" r="6" fill="#D9A441"/>
    <rect x="730" y="478" width="30" height="8" rx="2" fill="#2E2A24"/>
  </g>

  <!-- Airflow lines -->
  <g stroke="#5C6E58" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M260 250 q40 -20 80 0 q40 20 80 0"/>
    <path d="M260 300 q40 -20 80 0 q40 20 80 0"/>
    <path d="M600 240 q40 -20 80 0 q40 20 80 0"/>
    <path d="M600 300 q40 -20 80 0 q40 20 80 0"/>
    <path d="M780 400 q30 -18 60 0 q30 18 60 0"/>
    <path d="M780 440 q30 -18 60 0 q30 18 60 0"/>
  </g>

  <!-- small floating dust/fresh air dots -->
  <g fill="#D9A441" opacity="0.8">
    <circle cx="360" cy="220" r="4"/>
    <circle cx="700" cy="260" r="4"/>
    <circle cx="840" cy="380" r="4"/>
    <circle cx="300" cy="330" r="3"/>
    <circle cx="900" cy="420" r="3"/>
  </g>

  <!-- Floor shadow -->
  <rect x="220" y="570" width="760" height="16" fill="#2E2A24" opacity="0.15"/>
</svg>