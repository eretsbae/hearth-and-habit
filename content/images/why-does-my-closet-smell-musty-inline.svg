<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Wall panel -->
  <rect x="100" y="70" width="1000" height="430" fill="#F1E4D3"/>
  <rect x="100" y="70" width="1000" height="430" fill="none" stroke="#2E2A24" stroke-width="3"/>

  <!-- Closet rod and hanging clothes suggestion (upper area) -->
  <rect x="150" y="110" width="900" height="8" fill="#5C6E58"/>
  <circle cx="150" cy="114" r="10" fill="#5C6E58"/>
  <circle cx="1050" cy="114" r="10" fill="#5C6E58"/>

  <!-- Hangers -->
  <g stroke="#2E2A24" stroke-width="3" fill="none">
    <path d="M230 118 v18 M230 136 q0 -12 20 -12 q20 0 20 12"/>
    <path d="M420 118 v18 M420 136 q0 -12 20 -12 q20 0 20 12"/>
    <path d="M620 118 v18 M620 136 q0 -12 20 -12 q20 0 20 12"/>
    <path d="M820 118 v18 M820 136 q0 -12 20 -12 q20 0 20 12"/>
  </g>

  <!-- Clothes shapes hanging -->
  <path d="M215 148 q35 -8 70 0 l-6 90 q-29 8 -58 0 z" fill="#B85C38"/>
  <path d="M405 148 q35 -8 70 0 l-8 100 q-27 8 -54 0 z" fill="#D9A441"/>
  <path d="M605 148 q35 -8 70 0 l-6 85 q-29 8 -58 0 z" fill="#5C6E58"/>
  <path d="M805 148 q35 -8 70 0 l-8 95 q-27 8 -54 0 z" fill="#E4C7B2"/>

  <!-- Floor line -->
  <rect x="100" y="430" width="1000" height="70" fill="#E4C7B2" opacity="0.5"/>

  <!-- Baseboard -->
  <rect x="100" y="430" width="1000" height="35" fill="#F6EFE6" stroke="#2E2A24" stroke-width="3"/>

  <!-- Baseboard cutaway section revealing damp spot -->
  <g>
    <!-- cut section removed to show inside wall -->
    <rect x="470" y="430" width="220" height="35" fill="#E9DCC9" stroke="#2E2A24" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- inside wall cavity -->
    <rect x="480" y="390" width="200" height="75" fill="#DDD0BC"/>
    <!-- damp/mold stain -->
    <ellipse cx="560" cy="440" rx="55" ry="30" fill="#5C6E58" opacity="0.55"/>
    <ellipse cx="600" cy="420" rx="35" ry="20" fill="#2E2A24" opacity="0.25"/>
    <ellipse cx="530" cy="450" rx="30" ry="16" fill="#2E2A24" opacity="0.2"/>
    <!-- water droplet marks -->
    <path d="M545 400 q4 10 0 16 q-4 -3 -4 -8 q0 -5 4 -8z" fill="#5C6E58" opacity="0.6"/>
    <path d="M610 400 q4 10 0 16 q-4 -3 -4 -8 q0 -5 4 -8z" fill="#5C6E58" opacity="0.6"/>
  </g>

  <!-- Skirting shadow under wall -->
  <rect x="100" y="465" width="1000" height="10" fill="#2E2A24" opacity="0.08"/>

  <!-- Floor -->
  <rect x="100" y="465" width="1000" height="35" fill="#D9C3A8"/>

  <!-- Moisture meter held near baseboard -->
  <g transform="translate(760,340) rotate(8)">
    <!-- hand suggestion (simplified glove/sleeve shape) -->
    <path d="M-40 130 q-10 -60 20 -90 q20 -20 45 -10 l10 90 q-5 20 -30 25 q-30 5 -45 -15z" fill="#E4C7B2"/>

    <!-- meter body -->
    <rect x="-20" y="-20" width="80" height="150" rx="12" fill="#F6EFE6" stroke="#2E2A24" stroke-width="3"/>
    <!-- screen -->
    <rect x="-8" y="0" width="56" height="40" rx="4" fill="#5C6E58"/>
    <circle cx="20" cy="20" r="10" fill="#D9A441"/>
    <!-- buttons -->
    <circle cx="0" cy="60" r="7" fill="#B85C38"/>
    <circle cx="24" cy="60" r="7" fill="#B85C38"/>
    <circle cx="12" cy="80" r="7" fill="#2E2A24"/>
    <!-- probe pins -->
    <rect x="4" y="-40" width="4" height="22" fill="#2E2A24"/>
    <rect x="30" y="-40" width="4" height="22" fill="#2E2A24"/>
  </g>

  <!-- subtle steam/moisture wisps rising from stain -->
  <g stroke="#5C6E58" stroke-width="3" fill="none" opacity="0.4">
    <path d="M540 385 q10 -20 0 -35 q-10 -15 0 -30"/>
    <path d="M600 385 q10 -20 0 -35 q-10 -15 0 -30"/>
  </g>

  <!-- small decorative dots for texture -->
  <g fill="#2E2A24" opacity="0.15">
    <circle cx="150" cy="500" r="3"/>
    <circle cx="300" cy="510" r="3"/>
    <circle cx="900" cy="505" r="3"/>
    <circle cx="1000" cy="495" r="3"/>
  </g>
</svg>