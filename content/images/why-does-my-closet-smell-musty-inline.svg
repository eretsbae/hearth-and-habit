<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="78" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">How much colder a wall must be to get wet</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<text x="80" y="160">Room at 70°F, 50% humidity</text>
<rect x="80" y="178" width="1040" height="56" rx="8" fill="#E4C7B2"/>
<rect x="80" y="178" width="800" height="56" rx="8" fill="#5C6E58"/>
<text x="900" y="216">20°F colder</text>
<text x="80" y="310">Room at 70°F, 80% humidity</text>
<rect x="80" y="328" width="1040" height="56" rx="8" fill="#E4C7B2"/>
<rect x="80" y="328" width="280" height="56" rx="8" fill="#B85C38"/>
<text x="380" y="366">only 7°F colder</text>
<text x="80" y="470">Packed clothes keep an outside wall cold</text>
<text x="80" y="530">Fix: clear the outside wall, open the door</text>
</g>
<line x1="80" y1="420" x2="1120" y2="420" stroke="#D9A441" stroke-width="4"/>
<text x="1120" y="590" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E2A24" text-anchor="end">Figures: NIH condensation bulletin</text>
</svg>
