<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Divider -->
  <line x1="600" y1="60" x2="600" y2="580" stroke="#E4C7B2" stroke-width="3"/>

  <!-- LEFT PANEL: correct slope away from house -->
  <g>
    <!-- sky/negative space label circle omitted (no text) -->
    <!-- ground base -->
    <polygon points="60,470 560,470 560,560 60,560" fill="#E4C7B2"/>
    <!-- sloped ground away from house -->
    <polygon points="60,470 300,420 560,470 560,560 60,560" fill="#D9A441" opacity="0.55"/>
    <polygon points="60,470 300,420 300,470" fill="#B85C38" opacity="0.3"/>
    <!-- foundation wall -->
    <rect x="260" y="330" width="80" height="140" fill="#2E2A24"/>
    <!-- house body -->
    <rect x="200" y="230" width="200" height="100" fill="#B85C38"/>
    <!-- roof -->
    <polygon points="180,230 300,150 420,230" fill="#5C6E58"/>
    <!-- door -->
    <rect x="285" y="280" width="30" height="50" fill="#F6EFE6"/>
    <!-- water droplet moving away -->
    <ellipse cx="470" cy="440" rx="18" ry="12" fill="#5C6E58" opacity="0.6"/>
    <ellipse cx="510" cy="450" rx="10" ry="7" fill="#5C6E58" opacity="0.4"/>
    <!-- arrow showing slope direction -->
    <path d="M330 400 L480 430" stroke="#2E2A24" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
    <defs>
      <marker id="arrow1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#2E2A24"/>
      </marker>
    </defs>
  </g>

  <!-- RIGHT PANEL: incorrect slope toward house -->
  <g>
    <polygon points="640,470 1140,470 1140,560 640,560" fill="#E4C7B2"/>
    <!-- sloped ground toward house (dips near foundation) -->
    <polygon points="640,420 900,470 1140,420 1140,560 640,560" fill="#B85C38" opacity="0.4"/>
    <!-- foundation wall -->
    <rect x="860" y="330" width="80" height="140" fill="#2E2A24"/>
    <!-- house body -->
    <rect x="800" y="230" width="200" height="100" fill="#B85C38"/>
    <!-- roof -->
    <polygon points="780,230 900,150 1020,230" fill="#5C6E58"/>
    <!-- door -->
    <rect x="885" y="280" width="30" height="50" fill="#F6EFE6"/>
    <!-- pooling water at foundation -->
    <ellipse cx="900" cy="475" rx="55" ry="18" fill="#5C6E58" opacity="0.7"/>
    <ellipse cx="900" cy="470" rx="40" ry="12" fill="#5C6E58" opacity="0.5"/>
    <!-- arrows showing slope direction toward house -->
    <path d="M780 430 L860 460" stroke="#2E2A24" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
    <path d="M1020 430 L945 460" stroke="#2E2A24" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#2E2A24"/>
      </marker>
    </defs>
  </g>

  <!-- small decorative clouds -->
  <g fill="#D9A441" opacity="0.3">
    <ellipse cx="150" cy="90" rx="40" ry="16"/>
    <ellipse cx="190" cy="80" rx="30" ry="14"/>
    <ellipse cx="1030" cy="90" rx="40" ry="16"/>
    <ellipse cx="1070" cy="80" rx="30" ry="14"/>
  </g>

  <!-- subtle rain lines -->
  <g stroke="#5C6E58" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="240" y1="120" x2="230" y2="150"/>
    <line x1="270" y1="130" x2="260" y2="160"/>
    <line x1="900" y1="110" x2="890" y2="140"/>
    <line x1="930" y1="120" x2="920" y2="150"/>
  </g>
</svg>