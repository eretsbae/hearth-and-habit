<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="80" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Lowest temperature each one melts ice</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<text x="60" y="168">CMA: 20°F</text>
<rect x="420" y="138" width="140" height="44" rx="6" fill="#5C6E58"/>
