<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Bagged lettuce shelf life by fridge temperature</text>
<line x1="300" y1="120" x2="300" y2="520" stroke="#2E2A24" stroke-width="3"/>
<text x="270" y="183" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24" text-anchor="end">32°F</text>
<rect x="300" y="140" width="630" height="64" rx="6" fill="#5C6E58"/>
<text x="950" y="183" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">21 days</text>
<text x="270" y="283" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24" text-anchor="end">36°F</text>
<rect x="300" y="240" width="420" height="64" rx="6" fill="#5C6E58"/>
<rect x="720" y="240" width="120" height="64" rx="6" fill="#5C6E58" fill-opacity="0.45"/>
<text x="860" y="283" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">14–18 days</text>
<text x="270" y="383" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24" text-anchor="end">41°F</text>
<rect x="300" y="340" width="150" height="64" rx="6" fill="#D9A441"/>
<rect x="450" y="340" width="150" height="64" rx="6" fill="#D9A441" fill-opacity="0.45"/>
<text x="620" y="383" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">5–10 days</text>
<text x="270" y="483" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2E2A24" text-anchor="end">50°F</text>
<rect x="300" y="440" width="90" height="64" rx="6" fill="#B85C38"/>
<rect x="390" y="440" width="60" height="64" rx="6" fill="#B85C38" fill-opacity="0.45"/>
<text x="470" y="483" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2E2A24">3–5 days</text>
<text x="600" y="580" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#2E2A24" text-anchor="middle">Lettuce freezes just below 32°F: keep it off the back wall</text>
</svg>
