<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Same time, split differently</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<text x="80" y="140" font-size="30" font-weight="bold">Batch: one cleaning day</text>
<line x1="80" y1="300" x2="540" y2="300" stroke="#2E2A24" stroke-width="3"/>
<rect x="92" y="170" width="50" height="130" rx="4" fill="#B85C38"/>
<rect x="157" y="294" width="50" height="6" fill="#E4C7B2"/>
<rect x="222" y="294" width="50" height="6" fill="#E4C7B2"/>
<rect x="287" y="294" width="50" height="6" fill="#E4C7B2"/>
<rect x="352" y="294" width="50" height="6" fill="#E4C7B2"/>
<rect x="417" y="294" width="50" height="6" fill="#E4C7B2"/>
<rect x="482" y="294" width="50" height="6" fill="#E4C7B2"/>
<text x="160" y="200" font-size="26">About 85 minutes</text>
<text x="160" y="240" font-size="26">then nothing for days</text>
<text x="660" y="140" font-size="30" font-weight="bold">Daily: a short reset</text>
<line x1="660" y1="300" x2="1120" y2="300" stroke="#2E2A24" stroke-width="3"/>
<rect x="672" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="737" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="802" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="867" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="932" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="997" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<rect x="1062" y="280" width="50" height="20" rx="3" fill="#5C6E58"/>
<text x="672" y="200" font-size="26">10–15 minutes, every day</text>
<text x="672" y="240" font-size="26">70–105 minutes a week</text>
<rect x="80" y="380" width="1040" height="190" rx="14" fill="#FFFDF9" stroke="#D9A441" stroke-width="3"/>
<text x="600" y="455" font-size="30" text-anchor="middle">Batch: mess builds between cleans</text>
<text x="600" y="515" font-size="30" text-anchor="middle">Daily: no two-day head start</text>
</g>
</svg>
