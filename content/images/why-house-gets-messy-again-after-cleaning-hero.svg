<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- Left side: tidy room -->
  <g>
    <rect x="40" y="60" width="520" height="500" fill="#F6EFE6"/>
    <!-- wall accent -->
    <rect x="60" y="80" width="480" height="360" fill="#E4C7B2" opacity="0.4"/>
    <!-- floor -->
    <rect x="60" y="440" width="480" height="100" fill="#D9A441" opacity="0.25"/>

    <!-- shelf -->
    <rect x="100" y="140" width="180" height="14" fill="#5C6E58"/>
    <rect x="120" y="100" width="30" height="40" fill="#B85C38"/>
    <rect x="160" y="90" width="24" height="50" fill="#5C6E58"/>
    <rect x="195" y="105" width="26" height="35" fill="#D9A441"/>

    <!-- neat sofa -->
    <rect x="100" y="330" width="220" height="90" rx="14" fill="#B85C38"/>
    <rect x="100" y="310" width="220" height="30" rx="10" fill="#B85C38"/>
    <circle cx="130" cy="420" r="10" fill="#2E2A24"/>
    <circle cx="290" cy="420" r="10" fill="#2E2A24"/>
    <rect x="130" y="300" width="40" height="30" rx="6" fill="#E4C7B2"/>

    <!-- neat rug -->
    <rect x="90" y="440" width="240" height="16" rx="8" fill="#5C6E58" opacity="0.6"/>

    <!-- small tidy table with single cup -->
    <rect x="360" y="380" width="90" height="10" fill="#2E2A24"/>
    <rect x="370" y="390" width="6" height="40" fill="#2E2A24"/>
    <rect x="424" y="390" width="6" height="40" fill="#2E2A24"/>
    <ellipse cx="400" cy="370" rx="16" ry="10" fill="#D9A441"/>

    <!-- neatly placed shoes by door -->
    <ellipse cx="150" cy="520" rx="22" ry="10" fill="#5C6E58"/>
    <ellipse cx="195" cy="520" rx="22" ry="10" fill="#5C6E58"/>

    <!-- single folded blanket -->
    <rect x="230" y="500" width="60" height="16" rx="6" fill="#E4C7B2"/>
  </g>

  <!-- Right side: cluttered room -->
  <g>
    <rect x="640" y="60" width="520" height="500" fill="#F6EFE6"/>
    <rect x="660" y="80" width="480" height="360" fill="#E4C7B2" opacity="0.4"/>
    <rect x="660" y="440" width="480" height="100" fill="#D9A441" opacity="0.25"/>

    <!-- messy shelf -->
    <rect x="700" y="140" width="180" height="14" fill="#5C6E58"/>
    <rect x="710" y="95" width="30" height="45" fill="#B85C38" transform="rotate(6 725 117)"/>
    <rect x="750" y="90" width="24" height="50" fill="#5C6E58" transform="rotate(-4 762 115)"/>
    <rect x="790" y="100" width="26" height="40" fill="#D9A441" transform="rotate(10 803 120)"/>
    <!-- envelopes scattered -->
    <rect x="850" y="110" width="40" height="26" fill="#E4C7B2" transform="rotate(-12 870 123)"/>
    <rect x="880" y="130" width="40" height="26" fill="#E4C7B2" transform="rotate(8 900 143)"/>

    <!-- cluttered sofa -->
    <rect x="700" y="330" width="220" height="90" rx="14" fill="#B85C38"/>
    <rect x="700" y="310" width="220" height="30" rx="10" fill="#B85C38"/>
    <circle cx="730" cy="420" r="10" fill="#2E2A24"/>
    <circle cx="890" cy="420" r="10" fill="#2E2A24"/>

    <!-- pillow askew -->
    <rect x="720" y="295" width="45" height="35" rx="8" fill="#E4C7B2" transform="rotate(-10 742 312)"/>
    <!-- rumpled blanket over arm -->
    <path d="M900 300 Q935 280 950 320 Q925 340 905 335 Z" fill="#D9A441"/>

    <!-- scattered toys -->
    <circle cx="760" cy="470" r="16" fill="#5C6E58"/>
    <rect x="800" y="460" width="26" height="26" fill="#B85C38" transform="rotate(20 813 473)"/>
    <polygon points="850,485 865,455 880,485" fill="#D9A441"/>

    <!-- shoes kicked off, messy -->
    <ellipse cx="700" cy="530" rx="22" ry="10" fill="#5C6E58" transform="rotate(25 700 530)"/>
    <ellipse cx="740" cy="545" rx="22" ry="10" fill="#5C6E58" transform="rotate(-15 740 545)"/>

    <!-- cups on table -->
    <rect x="960" y="380" width="90" height="10" fill="#2E2A24"/>
    <rect x="970" y="390" width="6" height="40" fill="#2E2A24"/>
    <rect x="1024" y="390" width="6" height="40" fill="#2E2A24"/>
    <ellipse cx="985" cy="368" rx="14" ry="9" fill="#B85C38"/>
    <ellipse cx="1015" cy="365" rx="14" ry="9" fill="#D9A441" transform="rotate(15 1015 365)"/>

    <!-- mail pile on floor -->
    <rect x="900" y="500" width="50" height="34" fill="#E4C7B2" transform="rotate(-8 925 517)"/>
    <rect x="915" y="510" width="50" height="34" fill="#D9A441" opacity="0.8" transform="rotate(6 940 527)"/>

    <!-- extra clutter: a mug tipped -->
    <ellipse cx="1080" cy="470" rx="20" ry="11" fill="#B85C38"/>
  </g>

  <!-- connecting arrow suggesting time passing -->
  <g>
    <path d="M560 300 Q600 260 640 300" stroke="#2E2A24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="640,300 625,290 625,310" fill="#2E2A24"/>
    <circle cx="600" cy="270" r="5" fill="#5C6E58"/>
  </g>
</svg>