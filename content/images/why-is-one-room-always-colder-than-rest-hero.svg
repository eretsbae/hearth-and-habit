<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- roof -->
  <polygon points="150,140 600,40 1050,140 1000,140 600,90 200,140" fill="#B85C38"/>

  <!-- house outer frame -->
  <rect x="150" y="140" width="900" height="420" fill="#E4C7B2"/>

  <!-- attic duct trunk -->
  <rect x="180" y="150" width="840" height="34" fill="#5C6E58"/>
  <rect x="180" y="150" width="840" height="10" fill="#465241"/>

  <!-- vertical duct branches -->
  <rect x="340" y="184" width="26" height="90" fill="#5C6E58"/>
  <rect x="600" y="184" width="26" height="90" fill="#5C6E58"/>
  <rect x="860" y="184" width="26" height="140" fill="#5C6E58"/>

  <!-- interior wall dividers -->
  <rect x="480" y="274" width="14" height="286" fill="#2E2A24" opacity="0.15"/>
  <rect x="740" y="274" width="14" height="286" fill="#2E2A24" opacity="0.15"/>

  <!-- ROOM 1: cold room (left) -->
  <rect x="164" y="274" width="316" height="286" fill="#CFE0EA"/>
  <rect x="164" y="274" width="316" height="286" fill="#6E9AB5" opacity="0.18"/>

  <!-- cold room window -->
  <rect x="200" y="330" width="90" height="90" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
  <line x1="245" y1="330" x2="245" y2="420" stroke="#2E2A24" stroke-width="3"/>
  <line x1="200" y1="375" x2="290" y2="375" stroke="#2E2A24" stroke-width="3"/>

  <!-- frost accents on cold room -->
  <circle cx="420" cy="310" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="440" cy="330" r="4" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="400" cy="340" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- closed vent in cold room ceiling -->
  <rect x="330" y="274" width="70" height="18" fill="#5C6E58"/>
  <rect x="330" y="274" width="70" height="18" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <line x1="340" y1="283" x2="390" y2="283" stroke="#2E2A24" stroke-width="4"/>

  <!-- small snowflake symbol on cold room wall -->
  <g stroke="#5C6E58" stroke-width="3" opacity="0.6">
    <line x1="200" y1="480" x2="200" y2="510"/>
    <line x1="185" y1="495" x2="215" y2="495"/>
    <line x1="190" y1="485" x2="210" y2="505"/>
    <line x1="210" y1="485" x2="190" y2="505"/>
  </g>

  <!-- ROOM 2: warm room (middle) -->
  <rect x="494" y="274" width="246" height="286" fill="#F6E7C4"/>
  <rect x="494" y="274" width="246" height="286" fill="#D9A441" opacity="0.15"/>

  <!-- warm room window -->
  <rect x="560" y="330" width="90" height="90" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
  <line x1="605" y1="330" x2="605" y2="420" stroke="#2E2A24" stroke-width="3"/>
  <line x1="560" y1="375" x2="650" y2="375" stroke="#2E2A24" stroke-width="3"/>

  <!-- open vent in warm room ceiling -->
  <rect x="580" y="274" width="70" height="18" fill="#D9A441"/>
  <rect x="580" y="274" width="70" height="18" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <line x1="588" y1="278" x2="588" y2="288" stroke="#2E2A24" stroke-width="3"/>
  <line x1="600" y1="278" x2="600" y2="288" stroke="#2E2A24" stroke-width="3"/>
  <line x1="612" y1="278" x2="612" y2="288" stroke="#2E2A24" stroke-width="3"/>
  <line x1="624" y1="278" x2="624" y2="288" stroke="#2E2A24" stroke-width="3"/>
  <line x1="636" y1="278" x2="636" y2="288" stroke="#2E2A24" stroke-width="3"/>

  <!-- warm airflow wisp -->
  <path d="M600 296 Q615 320 600 344 Q585 368 605 392" stroke="#D9A441" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- sun symbol accents in warm room -->
  <circle cx="700" cy="480" r="14" fill="#D9A441" opacity="0.6"/>
  <g stroke="#D9A441" stroke-width="3" opacity="0.6">
    <line x1="700" y1="458" x2="700" y2="450"/>
    <line x1="700" y1="502" x2="700" y2="510"/>
    <line x1="678" y1="480" x2="670" y2="480"/>
    <line x1="722" y1="480" x2="730" y2="480"/>
  </g>

  <!-- ROOM 3: warm room (right) -->
  <rect x="754" y="274" width="282" height="286" fill="#F6E7C4"/>
  <rect x="754" y="274" width="282" height="286" fill="#D9A441" opacity="0.15"/>

  <!-- right room window -->
  <rect x="820" y="330" width="90" height="90" fill="#F6EFE6" stroke="#2E2A24" stroke-width="4"/>
  <line x1="865" y1="330" x2="865" y2="420" stroke="#2E2A24" stroke-width="3"/>
  <line x1="820" y1="375" x2="910" y2="375" stroke="#2E2A24" stroke-width="3"/>

  <!-- open vent in right room ceiling -->
  <rect x="840" y="324" width="70" height="18" fill="#D9A441"/>
  <rect x="840" y="324" width="70" height="18" fill="none" stroke="#2E2A24" stroke-width="3"/>
  <line x1="848" y1="328" x2="848" y2="338" stroke="#2E2A24" stroke-width="3"/>
  <line x1="860" y1="328" x2="860" y2="338" stroke="#2E2A24" stroke-width="3"/>
  <line x1="872" y1="328" x2="872" y2="338" stroke="#2E2A24" stroke-width="3"/>
  <line x1="884" y1="328" x2="884" y2="338" stroke="#2E2A24" stroke-width="3"/>
  <line x1="896" y1="328" x2="896" y2="338" stroke="#2E2A24" stroke-width="3"/>

  <path d="M865 346 Q880 370 865 394 Q850 418 870 442" stroke="#D9A441" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- small furniture shapes for coziness -->
  <rect x="960" y="480" width="60" height="40" rx="6" fill="#B85C38" opacity="0.8"/>
  <rect x="960" y="470" width="60" height="14" rx="6" fill="#B85C38"/>

  <rect x="200" y="500" width="70" height="10" fill="#2E2A24" opacity="0.2"/>

  <!-- floor baseboard line -->
  <rect x="150" y="555" width="900" height="5" fill="#2E2A24" opacity="0.2"/>

  <!-- ground -->
  <rect x="0" y="560" width="1200" height="70" fill="#5C6E58" opacity="0.15"/>

  <!-- chimney -->
  <rect x="880" y="60" width="46" height="90" fill="#B85C38"/>
  <rect x="872" y="52" width="62" height="18" fill="#2E2A24" opacity="0.85"/>
</svg>