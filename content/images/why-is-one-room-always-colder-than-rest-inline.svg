<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Which cold-room problem is it?</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#2E2A24">
<rect x="400" y="120" width="400" height="80" rx="14" fill="#D9A441"/>
<text x="600" y="171" font-size="30" font-weight="bold" text-anchor="middle">Check vent and door</text>
<path d="M500 200 L240 300" stroke="#2E2A24" stroke-width="4"/>
<polygon points="226,306 244,288 252,310" fill="#2E2A24"/>
<path d="M600 200 L600 300" stroke="#2E2A24" stroke-width="4"/>
<polygon points="588,292 612,292 600,314" fill="#2E2A24"/>
<path d="M700 200 L960 300" stroke="#2E2A24" stroke-width="4"/>
<polygon points="974,306 948,310 956,288" fill="#2E2A24"/>
<rect x="60" y="320" width="340" height="230" rx="14" fill="#FFFDF9" stroke="#B85C38" stroke-width="4"/>
<text x="230" y="380" font-size="28" font-weight="bold" text-anchor="middle">Weak air</text>
<text x="230" y="440" font-size="26" text-anchor="middle">Blockage or</text>
<text x="230" y="476" font-size="26" text-anchor="middle">leaky ducts</text>
<rect x="430" y="320" width="340" height="230" rx="14" fill="#FFFDF9" stroke="#5C6E58" stroke-width="4"/>
<text x="600" y="380" font-size="28" font-weight="bold" text-anchor="middle">Warm air, cold room</text>
<text x="600" y="440" font-size="26" text-anchor="middle">Heat loss: floor,</text>
<text x="600" y="476" font-size="26" text-anchor="middle">attic, drafts</text>
<rect x="800" y="320" width="340" height="230" rx="14" fill="#FFFDF9" stroke="#D9A441" stroke-width="4"/>
<text x="970" y="380" font-size="28" font-weight="bold" text-anchor="middle">Colder, door shut</text>
<text x="970" y="440" font-size="26" text-anchor="middle">No return path</text>
<text x="970" y="476" font-size="26" text-anchor="middle">for the air</text>
</g>
</svg>
