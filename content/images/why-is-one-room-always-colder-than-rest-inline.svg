<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- soft background circle -->
  <circle cx="600" cy="300" r="270" fill="#E4C7B2" opacity="0.35"/>

  <!-- floor plane suggestion -->
  <rect x="0" y="470" width="1200" height="160" fill="#E4C7B2" opacity="0.25"/>

  <!-- airflow lines coming out, angled -->
  <g stroke="#5C6E58" stroke-width="6" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 430 300 C 350 240 280 190 190 150"/>
    <path d="M 470 330 C 400 280 320 240 240 210"/>
    <path d="M 500 365 C 440 330 370 300 300 280"/>
  </g>
  <g stroke="#5C6E58" stroke-width="6" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M 420 260 C 340 190 260 140 170 100"/>
    <path d="M 480 400 C 430 380 370 360 310 350"/>
  </g>

  <!-- small chevron arrows along airflow -->
  <g fill="#5C6E58" opacity="0.5">
    <path d="M 300 200 l 14 -6 l -2 16 z"/>
    <path d="M 250 165 l 14 -6 l -2 16 z"/>
    <path d="M 350 320 l 12 -8 l 2 16 z"/>
  </g>

  <!-- register outer frame -->
  <rect x="430" y="200" width="340" height="260" rx="18" fill="#2E2A24"/>
  <rect x="446" y="216" width="308" height="228" rx="12" fill="#B85C38"/>

  <!-- inner recessed shadow -->
  <rect x="462" y="232" width="276" height="196" rx="8" fill="#8f4527"/>

  <!-- louvers: series of angled slats, half-open, tilted to show angle -->
  <g>
    <!-- each louver: a rounded rect rotated to indicate half-open angle -->
    <g fill="#D9A441" stroke="#2E2A24" stroke-width="3">
      <rect x="470" y="248" width="260" height="20" rx="6" transform="rotate(-25 600 258)"/>
      <rect x="470" y="288" width="260" height="20" rx="6" transform="rotate(-25 600 298)"/>
      <rect x="470" y="328" width="260" height="20" rx="6" transform="rotate(-25 600 338)"/>
      <rect x="470" y="368" width="260" height="20" rx="6" transform="rotate(-25 600 378)"/>
      <rect x="470" y="408" width="260" height="20" rx="6" transform="rotate(-25 600 418)"/>
    </g>
    <!-- lighter top highlight strip on each louver -->
    <g fill="#EBCB8E" opacity="0.6">
      <rect x="475" y="246" width="250" height="6" rx="3" transform="rotate(-25 600 258)"/>
      <rect x="475" y="286" width="250" height="6" rx="3" transform="rotate(-25 600 298)"/>
      <rect x="475" y="326" width="250" height="6" rx="3" transform="rotate(-25 600 338)"/>
      <rect x="475" y="366" width="250" height="6" rx="3" transform="rotate(-25 600 378)"/>
      <rect x="475" y="406" width="250" height="6" rx="3" transform="rotate(-25 600 418)"/>
    </g>
  </g>

  <!-- adjustment lever on side of register -->
  <rect x="762" y="300" width="14" height="60" rx="6" fill="#5C6E58"/>
  <circle cx="769" cy="300" r="10" fill="#5C6E58"/>
  <circle cx="769" cy="360" r="10" fill="#5C6E58"/>

  <!-- screws in corners -->
  <g fill="#2E2A24">
    <circle cx="452" cy="220" r="5"/>
    <circle cx="748" cy="220" r="5"/>
    <circle cx="452" cy="440" r="5"/>
    <circle cx="748" cy="440" r="5"/>
  </g>

  <!-- small decorative snowflake-ish mark to hint "colder room" far side -->
  <g stroke="#5C6E58" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <line x1="960" y1="150" x2="960" y2="200"/>
    <line x1="935" y1="175" x2="985" y2="175"/>
    <line x1="943" y1="158" x2="977" y2="192"/>
    <line x1="977" y1="158" x2="943" y2="192"/>
  </g>
  <circle cx="960" cy="175" r="45" fill="#5C6E58" opacity="0.08"/>

  <!-- warm sun-ish mark near register hinting warm side -->
  <circle cx="230" cy="480" r="40" fill="#D9A441" opacity="0.25"/>
  <circle cx="230" cy="480" r="22" fill="#D9A441" opacity="0.5"/>
</svg>