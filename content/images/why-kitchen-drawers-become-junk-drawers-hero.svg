<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="630" fill="#F6EFE6"/>

  <!-- soft background shapes -->
  <circle cx="1080" cy="90" r="90" fill="#E4C7B2" opacity="0.35"/>
  <circle cx="90" cy="540" r="70" fill="#D9A441" opacity="0.2"/>

  <!-- drawer outer frame -->
  <rect x="120" y="150" width="960" height="330" rx="14" fill="#E4C7B2"/>
  <rect x="120" y="150" width="960" height="330" rx="14" fill="none" stroke="#2E2A24" stroke-width="3" opacity="0.15"/>

  <!-- drawer inner cavity -->
  <rect x="150" y="180" width="900" height="260" rx="8" fill="#F6EFE6"/>

  <!-- divider line splitting neat/messy halves -->
  <rect x="595" y="180" width="6" height="260" fill="#5C6E58" opacity="0.5"/>

  <!-- LEFT SIDE: neat trays -->
  <g>
    <rect x="170" y="200" width="200" height="105" rx="10" fill="#5C6E58"/>
    <rect x="185" y="215" width="170" height="75" rx="6" fill="#F6EFE6"/>

    <rect x="170" y="320" width="95" height="100" rx="10" fill="#B85C38"/>
    <rect x="182" y="333" width="71" height="74" rx="6" fill="#F6EFE6"/>

    <rect x="275" y="320" width="95" height="100" rx="10" fill="#D9A441"/>
    <rect x="287" y="333" width="71" height="74" rx="6" fill="#F6EFE6"/>

    <rect x="385" y="200" width="185" height="220" rx="10" fill="#5C6E58" opacity="0.85"/>
    <rect x="398" y="213" width="159" height="90" rx="6" fill="#F6EFE6"/>
    <rect x="398" y="313" width="159" height="95" rx="6" fill="#F6EFE6"/>

    <!-- neat items in trays -->
    <rect x="200" y="230" width="60" height="14" rx="7" fill="#D9A441"/>
    <rect x="200" y="252" width="60" height="14" rx="7" fill="#B85C38"/>
    <rect x="270" y="230" width="60" height="14" rx="7" fill="#5C6E58"/>
    <rect x="270" y="252" width="60" height="14" rx="7" fill="#D9A441"/>

    <circle cx="215" cy="360" r="16" fill="#D9A441"/>
    <circle cx="250" cy="360" r="16" fill="#D9A441"/>
    <circle cx="320" cy="360" r="16" fill="#B85C38"/>
    <circle cx="355" cy="360" r="16" fill="#B85C38"/>

    <rect x="410" y="235" width="130" height="10" rx="5" fill="#5C6E58"/>
    <rect x="410" y="255" width="130" height="10" rx="5" fill="#5C6E58"/>
    <rect x="410" y="275" width="90" height="10" rx="5" fill="#B85C38"/>

    <rect x="410" y="335" width="18" height="55" rx="4" fill="#2E2A24" opacity="0.7"/>
    <rect x="440" y="335" width="18" height="55" rx="4" fill="#2E2A24" opacity="0.7"/>
    <rect x="470" y="335" width="18" height="55" rx="4" fill="#2E2A24" opacity="0.7"/>
    <rect x="500" y="335" width="18" height="55" rx="4" fill="#2E2A24" opacity="0.7"/>
  </g>

  <!-- RIGHT SIDE: chaotic junk -->
  <g>
    <!-- batteries -->
    <g>
      <rect x="650" y="230" width="16" height="55" rx="6" fill="#2E2A24" transform="rotate(15 658 257)"/>
      <rect x="650" y="228" width="16" height="10" rx="3" fill="#D9A441" transform="rotate(15 658 233)"/>

      <rect x="700" y="260" width="16" height="55" rx="6" fill="#5C6E58" transform="rotate(-20 708 287)"/>
      <rect x="700" y="258" width="16" height="10" rx="3" fill="#D9A441" transform="rotate(-20 708 263)"/>

      <rect x="760" y="215" width="16" height="55" rx="6" fill="#B85C38" transform="rotate(8 768 242)"/>
      <rect x="760" y="213" width="16" height="10" rx="3" fill="#D9A441" transform="rotate(8 768 218)"/>
    </g>

    <!-- rubber bands -->
    <ellipse cx="820" cy="330" rx="34" ry="20" fill="none" stroke="#B85C38" stroke-width="8" transform="rotate(20 820 330)"/>
    <ellipse cx="880" cy="290" rx="30" ry="17" fill="none" stroke="#5C6E58" stroke-width="7" transform="rotate(-10 880 290)"/>
    <ellipse cx="700" cy="360" rx="28" ry="16" fill="none" stroke="#D9A441" stroke-width="7" transform="rotate(35 700 360)"/>

    <!-- twist ties -->
    <path d="M 640 380 Q 660 360 645 345 Q 630 330 655 320" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 930 250 Q 950 235 935 220 Q 920 205 945 195" fill="none" stroke="#B85C38" stroke-width="5" stroke-linecap="round"/>
    <path d="M 780 400 Q 800 385 785 370 Q 770 355 795 345" fill="none" stroke="#5C6E58" stroke-width="5" stroke-linecap="round"/>

    <!-- loose buttons/coins -->
    <circle cx="950" cy="330" r="14" fill="#D9A441"/>
    <circle cx="950" cy="330" r="4" fill="#2E2A24" opacity="0.5"/>
    <circle cx="900" cy="380" r="12" fill="#B85C38"/>
    <circle cx="900" cy="380" r="4" fill="#2E2A24" opacity="0.5"/>

    <!-- paperclips -->
    <path d="M 660 250 q 10 -15 20 0 q 10 15 -5 20 l -25 10" fill="none" stroke="#5C6E58" stroke-width="4"/>
    <path d="M 850 380 q 10 -15 20 0 q 10 15 -5 20 l -25 10" fill="none" stroke="#2E2A24" stroke-width="4"/>

    <!-- small screws / misc -->
    <rect x="740" y="400" width="10" height="30" rx="3" fill="#2E2A24" transform="rotate(25 745 415)"/>
    <rect x="870" y="230" width="10" height="30" rx="3" fill="#2E2A24" transform="rotate(-30 875 245)"/>

    <!-- scattered small dots for texture -->
    <circle cx="620" cy="300" r="6" fill="#5C6E58"/>
    <circle cx="990" cy="250" r="6" fill="#B85C38"/>
    <circle cx="670" cy="410" r="6" fill="#D9A441"/>
  </g>

  <!-- drawer handle -->
  <rect x="560" y="130" width="80" height="20" rx="10" fill="#2E2A24" opacity="0.75"/>

  <!-- subtle shadow under drawer -->
  <rect x="130" y="484" width="940" height="16" rx="8" fill="#2E2A24" opacity="0.1"/>
</svg>