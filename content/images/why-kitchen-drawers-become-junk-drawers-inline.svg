<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- Large drawer tray -->
  <g>
    <rect x="120" y="160" width="740" height="340" rx="10" fill="#E4C7B2"/>
    <rect x="120" y="160" width="740" height="340" rx="10" fill="none" stroke="#2E2A24" stroke-width="3"/>

    <!-- dividers creating sections -->
    <line x1="360" y1="160" x2="360" y2="500" stroke="#2E2A24" stroke-width="3"/>
    <line x1="600" y1="160" x2="600" y2="500" stroke="#2E2A24" stroke-width="3"/>
    <line x1="120" y1="330" x2="360" y2="330" stroke="#2E2A24" stroke-width="3"/>

    <!-- Section 1: top-left small compartment -->
    <rect x="140" y="180" width="200" height="130" rx="6" fill="#F6EFE6"/>
    <!-- three identical spoons -->
    <g fill="#5C6E58">
      <ellipse cx="190" cy="220" rx="10" ry="16"/>
      <rect x="186" y="234" width="8" height="50" rx="4"/>
      <ellipse cx="240" cy="220" rx="10" ry="16"/>
      <rect x="236" y="234" width="8" height="50" rx="4"/>
      <ellipse cx="290" cy="220" rx="10" ry="16"/>
      <rect x="286" y="234" width="8" height="50" rx="4"/>
    </g>

    <!-- Section 2: bottom-left compartment -->
    <rect x="140" y="350" width="200" height="130" rx="6" fill="#F6EFE6"/>
    <!-- two forks -->
    <g fill="#B85C38">
      <rect x="200" y="370" width="6" height="60" rx="3"/>
      <rect x="212" y="370" width="6" height="60" rx="3"/>
      <rect x="224" y="370" width="6" height="60" rx="3"/>
      <rect x="200" y="430" width="30" height="8" rx="4"/>
      <rect x="196" y="438" width="10" height="40" rx="4"/>

      <rect x="270" y="370" width="6" height="60" rx="3"/>
      <rect x="282" y="370" width="6" height="60" rx="3"/>
      <rect x="294" y="370" width="6" height="60" rx="3"/>
      <rect x="270" y="430" width="30" height="8" rx="4"/>
      <rect x="266" y="438" width="10" height="40" rx="4"/>
    </g>

    <!-- Section 3: middle compartment -->
    <rect x="380" y="180" width="200" height="300" rx="6" fill="#F6EFE6"/>
    <!-- one whisk -->
    <g fill="none" stroke="#D9A441" stroke-width="5">
      <path d="M480 230 C 450 280, 450 340, 480 380"/>
      <path d="M480 230 C 510 280, 510 340, 480 380"/>
      <path d="M480 230 C 480 290, 480 330, 480 380"/>
    </g>
    <rect x="470" y="380" width="20" height="70" rx="8" fill="#D9A441"/>

    <!-- Section 4: right large compartment -->
    <rect x="620" y="180" width="220" height="300" rx="6" fill="#F6EFE6"/>
    <!-- single measuring cup -->
    <g>
      <path d="M700 260 L780 260 L770 380 L710 380 Z" fill="#5C6E58"/>
      <rect x="695" y="250" width="90" height="16" rx="4" fill="#5C6E58"/>
      <rect x="785" y="270" width="30" height="14" rx="6" fill="#5C6E58"/>
    </g>
  </g>

  <!-- Small empty overflow box beside tray -->
  <g>
    <rect x="920" y="330" width="170" height="170" rx="10" fill="#F6EFE6"/>
    <rect x="920" y="330" width="170" height="170" rx="10" fill="none" stroke="#2E2A24" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- subtle shadow beneath tray for depth -->
  <rect x="130" y="500" width="720" height="12" rx="6" fill="#2E2A24" opacity="0.08"/>
  <rect x="925" y="500" width="160" height="10" rx="5" fill="#2E2A24" opacity="0.06"/>

  <!-- decorative small accent circles top -->
  <circle cx="1090" cy="120" r="18" fill="#D9A441"/>
  <circle cx="1030" cy="100" r="10" fill="#B85C38"/>
  <circle cx="150" cy="100" r="14" fill="#5C6E58" opacity="0.5"/>
</svg>