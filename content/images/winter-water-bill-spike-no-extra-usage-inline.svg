<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600" y="72" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">Family of four, one winter month</text>
<g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24">
<text x="80" y="150">Average use: about 9,840 gallons</text>
<rect x="80" y="166" width="738" height="56" rx="8" fill="#5C6E58"/>
<text x="80" y="290">Plus a 50-gallon-a-day leak: +1,500</text>
<rect x="80" y="306" width="738" height="56" rx="8" fill="#5C6E58"/>
<rect x="818" y="306" width="112" height="56" rx="8" fill="#B85C38"/>
<text x="80" y="430">EPA leak flag: over 12,000 gallons</text>
<rect x="80" y="446" width="900" height="56" rx="8" fill="#E4C7B2" stroke="#B85C38" stroke-width="4"/>
<text x="80" y="570">1 CCF on your bill = 748 gallons</text>
</g>
<line x1="980" y1="130" x2="980" y2="520" stroke="#D9A441" stroke-width="4" stroke-dasharray="10 8"/>
</svg>
