<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- ceiling and wall -->
  <rect x="0" y="0" width="1200" height="180" fill="#EDE2D2"/>
  <rect x="0" y="180" width="1200" height="450" fill="#F6EFE6"/>
  <rect x="0" y="176" width="1200" height="8" fill="#D9C7AE"/>

  <!-- corner shadow -->
  <path d="M0,180 L200,180 L0,340 Z" fill="#E4C7B2" opacity="0.35"/>

  <!-- water stain rings -->
  <g opacity="0.9">
    <ellipse cx="230" cy="150" rx="220" ry="120" fill="#D9A441" opacity="0.18"/>
    <ellipse cx="230" cy="150" rx="170" ry="90" fill="#D9A441" opacity="0.28"/>
    <ellipse cx="220" cy="140" rx="120" ry="65" fill="#B85C38" opacity="0.22"/>
    <ellipse cx="210" cy="130" rx="75" ry="42" fill="#B85C38" opacity="0.3"/>
  </g>
  <path d="M120,110 Q160,140 150,175 Q145,195 175,205" stroke="#B85C38" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M260,90 Q300,120 280,160" stroke="#D9A441" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- crown molding line -->
  <rect x="0" y="176" width="1200" height="4" fill="#5C6E58" opacity="0.25"/>

  <!-- floor -->
  <rect x="0" y="560" width="1200" height="70" fill="#E4C7B2" opacity="0.5"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#5C6E58" stroke-width="2" opacity="0.3"/>

  <!-- ladder leaning near corner -->
  <g transform="translate(430,180)">
    <line x1="0" y1="0" x2="90" y2="380" stroke="#B85C38" stroke-width="16" stroke-linecap="round"/>
    <line x1="70" y1="0" x2="160" y2="380" stroke="#B85C38" stroke-width="16" stroke-linecap="round"/>
    <line x1="12" y1="70" x2="82" y2="70" stroke="#8C4527" stroke-width="10"/>
    <line x1="24" y1="150" x2="94" y2="150" stroke="#8C4527" stroke-width="10"/>
    <line x1="36" y1="230" x2="106" y2="230" stroke="#8C4527" stroke-width="10"/>
    <line x1="48" y1="310" x2="118" y2="310" stroke="#8C4527" stroke-width="10"/>
  </g>

  <!-- flashlight resting on floor -->
  <g transform="translate(650,560) rotate(-8)">
    <rect x="0" y="0" width="140" height="34" rx="14" fill="#5C6E58"/>
    <rect x="120" y="-6" width="34" height="46" rx="10" fill="#2E2A24"/>
    <circle cx="146" cy="17" r="9" fill="#D9A441"/>
    <rect x="8" y="6" width="90" height="6" rx="3" fill="#2E2A24" opacity="0.3"/>
    <path d="M154,17 L210,-6 L210,40 Z" fill="#D9A441" opacity="0.25"/>
  </g>

  <!-- small dust/floor shadow near ladder base -->
  <ellipse cx="560" cy="562" rx="90" ry="14" fill="#2E2A24" opacity="0.08"/>
  <ellipse cx="720" cy="580" rx="70" ry="10" fill="#2E2A24" opacity="0.07"/>

  <!-- decorative baseboard -->
  <rect x="0" y="560" width="1200" height="10" fill="#5C6E58" opacity="0.25"/>
</svg>