<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#F6EFE6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E2A24"/></marker></defs>
<text x="600" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2E2A24" text-anchor="middle">When does the stain darken?</text>
<rect x="60" y="120" width="420" height="80" rx="40" fill="#5C6E58"/>
<text x="270" y="171" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">After rain</text>
<line x1="490" y1="160" x2="585" y2="160" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="600" y="120" width="540" height="80" rx="12" fill="#E4C7B2"/>
<text x="870" y="170" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Roof or flashing</text>
<rect x="60" y="235" width="420" height="80" rx="40" fill="#5C6E58"/>
<text x="270" y="286" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">After showers</text>
<line x1="490" y1="275" x2="585" y2="275" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="600" y="235" width="540" height="80" rx="12" fill="#E4C7B2"/>
<text x="870" y="285" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Tub, drain, or fan duct</text>
<rect x="60" y="350" width="420" height="80" rx="40" fill="#5C6E58"/>
<text x="270" y="401" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">Winter thaw, no rain</text>
<line x1="490" y1="390" x2="585" y2="390" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="600" y="350" width="540" height="80" rx="12" fill="#E4C7B2"/>
<text x="870" y="400" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Attic condensation or ice dam</text>
<rect x="60" y="465" width="420" height="80" rx="40" fill="#B85C38"/>
<text x="270" y="516" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#F6EFE6" text-anchor="middle">AC season</text>
<line x1="490" y1="505" x2="585" y2="505" stroke="#2E2A24" stroke-width="4" marker-end="url(#a)"/>
<rect x="600" y="465" width="540" height="80" rx="12" fill="#D9A441"/>
<text x="870" y="515" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#2E2A24" text-anchor="middle">Clogged condensate drain</text>
</svg>
